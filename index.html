zF5r375W1tGDR64uhRU8aP9XBx3nXk2MWbt7auWLbgu292HT46evpMLIT1dHPZtvI3tSQKGGZxOHuOnVAoFHg8zsjAcMX8nxA7D4/HTf/xl4jQ4HWLF6n7IuAJNlaWF65dz8zNk8nlUHskd+SggU8bG2f+/KuqERxuy4plDra26uoLvvsWh8Wu3bHLxtKylk4P8PZSDxORYeLokVweb+q8n/A4nB6Z/MPsmbfuP1SP3d3F+RWpEAAAAAAAgB4Dw/DBP09HP/yHxeGs373nXnzCil9+/m761PW790z+fp5YIgnw9h4a+cmLf1sJhmEmmyORSqzMLQj/eoCauS08Pt/awhzZKqz7KBSKRiaLRCJSTExQr462NoVUJkUcVwh8gQCDgfTI/3lBQY1QJCYRCYitA8OwWCIhEYlq00cskUAQpDGYqFAoGGw2Go22oNHU5WVyeVtbW6eXIZCWBUKRHpkE/Zvr96y8TCaSSAz19ZEWOlaXyeVSqVS9o4m2wcrb5CQiUdvYAQAAAAAAvDvI5PJGJotMItEoz3kVD3zvEgAAAAAAAODtA76tBAAAAAAAAPD2ATYZAAAAAAAAwNsH2GQAAAAAAAAAbx9gkwEAAAAAAAC8fYBNBgAAAAAAAIB66/wPp0P2FVhRqxcAAAAASUVORK5CYII=\">\u003c/p>\n\u003cp>The left panel marks the quadrant containing the arbitrary missing square; the right panel shows the central L covering one square in each other quadrant. The artificially reserved squares are covered by that central tile, not permanently removed from the board.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> The lecture supports interpreting a diagram, constructing an inductive step and explaining why the smaller cases meet the hypothesis. There is no direct approved tutorial problem on this tiling.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Proving only a corner-hole version then applying it to an arbitrary hole; placing the central tile across the wrong quadrants; using boards of size 2k rather than 2^k; counting areas without constructing a tiling.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> four quadrants → one real hole + three central reserved squares → central triomino → apply the hypothesis to each quadrant.\u003c/p>\n\u003cp>Source: C5 pp. 17–19; diagram directly rendered from the inspected original.\u003c/p>", "search": "\n\nWhat it means. The lecture proves that every 2^n by 2^n checkerboard with one square removed can be tiled by L-shaped triominoes for n≥1. Each tile covers three squares. The statement is about any missing-square position, not just a corner; this strength is what makes the recursive construction work.\n\nHow to use it. Match the geometry of the next board to the previous board size. Divide into four quadrants. One quadrant contains the original missing square. Place a central triomino covering one centre-adjacent square in each of the other three quadrants. Each quadrant is now a smaller board with one unavailable square and can use the hypothesis. The central tile plus the four tilings cover exactly the desired board.\n\nWorked proof — lecture example, explained. Basis n=1: a 2×2 board with any one square removed is exactly an L triomino. Assume every deficient 2^k×2^k board can be tiled, wherever its removed square lies. In a deficient 2^(k+1)×2^(k+1) board, apply the four-quadrant construction described above. Tile the quadrant with the original hole by the hypothesis. In each other quadrant, reserve its centre-adjacent square for the central triomino and tile the remaining deficient board by the hypothesis. These pieces do not overlap and leave no uncovered square except the original missing one. This proves the next case.\n\n![Original checkerboard induction diagram, Chapter 5 physical page 19](assets/chapter5-page-19.png)\n\nThe left panel marks the quadrant containing the arbitrary missing square; the right panel shows the central L covering one square in each other quadrant. The artificially reserved squares are covered by that central tile, not permanently removed from the board.\n\nQuiz 2 style. The lecture supports interpreting a diagram, constructing an inductive step and explaining why the smaller cases meet the hypothesis. There is no direct approved tutorial problem on this tiling.\n\nCommon traps. Proving only a corner-hole version then applying it to an arbitrary hole; placing the central tile across the wrong quadrants; using boards of size 2k rather than 2^k; counting areas without constructing a tiling.\n\nCHEAT SHEET CANDIDATE: four quadrants → one real hole + three central reserved squares → central triomino → apply the hypothesis to each quadrant.\n\nSource: C5 pp. 17–19; diagram directly rendered from the inspected original.\n\na id=\"i09\"/a\n\n", "shortTitle": "Geometric induction: deficient checkerboards", "part": "Part 10 — remaining Level 2 theory and applications"}, {"id": "I07", "title": "Invalid induction proofs and boundary failures", "section": "Chapter 5, Section 5.1 — Mathematical induction", "chapter": "Chapter 5", "priority": "L2", "source": "C5 pp. 20–23; T04 P12 indirectly reinforces domain checks", "ability": "Find the failed transition or missing base and justify why a proposed proof fails. Counterexample, proof critique", "prereq": "I01; quantifier domains", "confusion": "True induction hypothesis versus invalid application; tested examples versus universal step", "visual": "V pp. 20–21; T pp. 22–23", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> Induction is valid only if the base is established and the transition works for every k in the stated range. A proof can contain correct algebra for k≥3 and still fail if the base only establishes P(2). The gap from 2 to 3 breaks the chain.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Identify the exact claim and first base. Test the transition at its smallest allowed k. Check that every object to which the hypothesis is applied meets the hypothesis&#x27;s conditions. Look for an overlap, nonzero factor, or earlier index that disappears at the boundary. State the failed inference, not merely that the final conclusion is false.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> A proposed proof claims that any n distinct nonparallel lines meet at one point. The basis n=2 is true. In the step it takes the first k lines and last k lines from k+1 lines, giving intersection points p_1,p_2. For k≥3, the two collections share at least two distinct lines; if p_1≠p_2, both shared lines would contain both points, impossible for distinct lines. But at k=2 the collections share only one line, and two different intersection points can lie on it. Thus P(2) does not imply P(3). Three lines forming a triangle give a concrete counterexample.\u003c/p>\n\u003cp>\u003cstrong>Why this is different from disproving induction.\u003c/strong> The principle is not wrong; the claimed transition was not proved over its whole required domain. Adding P(3) would not fix this particular theorem because P(3) is false.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> The lecture explicitly teaches mistaken proofs. T04 P12 also requires attention to starting values. Proof criticism and boundary justification are source-supported demands, not a prediction of a specific question.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Saying “the hypothesis is an assumption, so induction is circular”; pointing only to a false conclusion without locating the invalid step; choosing a base disconnected from the transition range.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> audit base, first transition, domain of every hypothesis application and hidden assumptions such as overlap or nonzero factors.\u003c/p>\n\u003cp>Source: C5 pp. 20–23.\u003c/p>", "search": "\n\nWhat it means. Induction is valid only if the base is established and the transition works for every k in the stated range. A proof can contain correct algebra for k≥3 and still fail if the base only establishes P(2). The gap from 2 to 3 breaks the chain.\n\nHow to use it. Identify the exact claim and first base. Test the transition at its smallest allowed k. Check that every object to which the hypothesis is applied meets the hypothesis's conditions. Look for an overlap, nonzero factor, or earlier index that disappears at the boundary. State the failed inference, not merely that the final conclusion is false.\n\nWorked example — lecture example, explained. A proposed proof claims that any n distinct nonparallel lines meet at one point. The basis n=2 is true. In the step it takes the first k lines and last k lines from k+1 lines, giving intersection points p_1,p_2. For k≥3, the two collections share at least two distinct lines; if p_1≠p_2, both shared lines would contain both points, impossible for distinct lines. But at k=2 the collections share only one line, and two different intersection points can lie on it. Thus P(2) does not imply P(3). Three lines forming a triangle give a concrete counterexample.\n\nWhy this is different from disproving induction. The principle is not wrong; the claimed transition was not proved over its whole required domain. Adding P(3) would not fix this particular theorem because P(3) is false.\n\nQuiz 2 style. The lecture explicitly teaches mistaken proofs. T04 P12 also requires attention to starting values. Proof criticism and boundary justification are source-supported demands, not a prediction of a specific question.\n\nCommon traps. Saying “the hypothesis is an assumption, so induction is circular”; pointing only to a false conclusion without locating the invalid step; choosing a base disconnected from the transition range.\n\nCHEAT SHEET CANDIDATE: audit base, first transition, domain of every hypothesis application and hidden assumptions such as overlap or nonzero factors.\n\nSource: C5 pp. 20–23.\n\n", "shortTitle": "Diagnosing invalid induction proofs", "part": "Part 6 — ordinary mathematical induction"}, {"id": "I08", "title": "Strong induction; sufficient bases and choice of induction form", "section": "Chapter 5, Section 5.2 — Strong induction and well-ordering", "chapter": "Chapter 5", "priority": "L1", "source": "C5 pp. 26–32; T04 P14; T05 P3(b); T04 P15 supports a splitting application", "ability": "Use all required smaller cases and justify base coverage; follow a required method. Proof construction, method selection", "prereq": "I01; integer inequalities", "confusion": "Ordinary versus strong hypothesis; logical equivalence versus equal convenience", "visual": "V p. 28; Q abbreviated base step; F p. 27 illustration", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> Strong induction allows the step for k+1 to assume P(j) for every earlier j in the established domain, not only P(k). It is useful when the next object depends on several smaller objects or an earlier index not equal to k. It is logically equivalent to ordinary induction, but often a better fit to the construction.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Choose the starting domain. Inspect the step to see how far back it reaches; establish enough initial cases to cover that gap. State the hypothesis for all b≤j≤k. When invoking it at j=k−3 or at the sizes of two smaller pieces, explicitly check those indices lie in the allowed range.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture postage example, explained.\u003c/strong> Every integer amount n≥12 can be made with 4-cent and 5-cent stamps. Bases: 12=4+4+4, 13=4+4+5, 14=4+5+5, 15=5+5+5. Assume every amount from 12 through k is attainable, where k≥15. Then k−3≥12, so form k−3 by the hypothesis and add a 4-cent stamp. The result is k+1. Four bases are needed for this particular subtract-4 step.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture ladder example, qualified.\u003c/strong> If rungs 1 and 2 are reachable and reaching any rung lets you move up two, verify both bases. For k≥2, k−1≥1, so the strong hypothesis gives rung k−1 and the rule gives rung k+1. The original p. 28 basis line mentions only rung 1, but rung 2 is explicitly given in the problem and must also be included in the proof&#x27;s starting information.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P14 requires strong induction; T05 P3(b) asks for strong induction on construction steps. Respect a named method even if another proof is possible.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Assuming only P(k) then using P(k−2); choosing one base for a step that needs several; invoking the hypothesis at 0 when the domain begins at 1; assuming the desired k+1 case is already included.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> assume all b≤j≤k; prove k+1 using genuinely earlier indices; establish every initial case needed before that transition works.\u003c/p>\n\u003cp>Source: C5 pp. 26–32; T04 P14; T05 P3(b).\u003c/p>", "search": "\n\nWhat it means. Strong induction allows the step for k+1 to assume P(j) for every earlier j in the established domain, not only P(k). It is useful when the next object depends on several smaller objects or an earlier index not equal to k. It is logically equivalent to ordinary induction, but often a better fit to the construction.\n\nHow to use it. Choose the starting domain. Inspect the step to see how far back it reaches; establish enough initial cases to cover that gap. State the hypothesis for all b≤j≤k. When invoking it at j=k−3 or at the sizes of two smaller pieces, explicitly check those indices lie in the allowed range.\n\nWorked example — lecture postage example, explained. Every integer amount n≥12 can be made with 4-cent and 5-cent stamps. Bases: 12=4+4+4, 13=4+4+5, 14=4+5+5, 15=5+5+5. Assume every amount from 12 through k is attainable, where k≥15. Then k−3≥12, so form k−3 by the hypothesis and add a 4-cent stamp. The result is k+1. Four bases are needed for this particular subtract-4 step.\n\nWorked example — lecture ladder example, qualified. If rungs 1 and 2 are reachable and reaching any rung lets you move up two, verify both bases. For k≥2, k−1≥1, so the strong hypothesis gives rung k−1 and the rule gives rung k+1. The original p. 28 basis line mentions only rung 1, but rung 2 is explicitly given in the problem and must also be included in the proof's starting information.\n\nQuiz 2 style. T04 P14 requires strong induction; T05 P3(b) asks for strong induction on construction steps. Respect a named method even if another proof is possible.\n\nCommon traps. Assuming only P(k) then using P(k−2); choosing one base for a step that needs several; invoking the hypothesis at 0 when the domain begins at 1; assuming the desired k+1 case is already included.\n\nCHEAT SHEET CANDIDATE: assume all b≤j≤k; prove k+1 using genuinely earlier indices; establish every initial case needed before that transition works.\n\nSource: C5 pp. 26–32; T04 P14; T05 P3(b).\n\na id=\"i10\"/a\n\n", "shortTitle": "Strong induction and sufficient base cases", "part": "Part 7 — strong induction and well-ordering"}, {"id": "I09", "title": "Constructive strong-induction applications: denomination totals and splitting", "section": "Chapter 5, Section 5.2 — Strong induction and well-ordering", "chapter": "Chapter 5", "priority": "L2", "source": "C5 pp. 30–32; T04 P14–15; P10 related construction", "ability": "Determine attainable totals or prove a splitting invariant, including necessary restrictions. Modelling, multi-step proof", "prereq": "I08,N01; algebra; decomposition", "confusion": "Existence of a construction versus all attainable cases; one splitting sequence versus every sequence", "visual": "V T04 p. 2; F C5 pp. 31–32 if transcribing", "confidence": "CONFIRMED / L2; P15's strong-induction placement is STRONGLY SUPPORTED", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> Some induction statements assert a construction exists; others assert every construction has the same outcome. The step must build a permitted object or analyse all permitted decompositions. A numerical pattern alone does neither.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> For attainable amounts, first find necessary restrictions such as a common divisor, then establish bases covering the step size. For an arbitrary split, express the object as two strictly smaller pieces and apply strong induction to both. For a representation by divisors, verify that transformed pieces remain divisors and remain distinct.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P14.\u003c/strong> Amounts formed from $25 and $40 are 5 times integers of the form 5a+8b, a,b≥0. For scaled amounts, 28=4·5+8,29=5+3·8,30=6·5,31=3·5+2·8,32=4·8. Strong induction now gives every integer ≥28: for a target t≥33, t−5≥28 is an earlier attainable amount, and one more 5 completes t. Thus every multiple of $5 at least $140 is attainable.\u003c/p>\n\u003cp>To determine \u003cstrong>all\u003c/strong> smaller possibilities, enumerate b=0,1,2,3 while 5a+8b&lt;28. The positive scaled results are 5,8,10,13,15,16,18,20,21,23,24,25,26. Multiply by 5 to obtain $25,$40,$50,$65,$75,$80,$90,$100,$105,$115,$120,$125,$130. Include $0 only if using no certificates is permitted. No nonmultiple of $5 is attainable. This separates the finite boundary check from the infinite induction argument.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P15.\u003c/strong> Let the claim for n stones be that every full splitting process has total product sum n(n−1)/2. Basis n=1 has no split and sum 0. If the first split gives r,s≥1 with r+s=n, the first contribution is rs. Both piles are smaller than n, so strong induction gives their later totals r(r−1)/2 and s(s−1)/2 regardless of the subsequent splitting choices. Their sum with rs is [(r+s)²−(r+s)]/2=n(n−1)/2. This proves independence from the splitting sequence.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P10, ordinary induction.\u003c/strong> Claim: every positive m≤n! is a sum of at most n distinct positive divisors of n!. Basis n=1 is 1. Assume the claim for n. For m≤(n+1)!, divide m=(n+1)q+r with 0≤r≤n and 0≤q≤n!. If q&gt;0, express q as a sum of at most n distinct divisors d_i of n!. Then (n+1)d_i are distinct divisors of (n+1)!. If r&gt;0, it also divides (n+1)! because 1≤r≤n, and it is smaller than every (n+1)d_i, so it is a new distinct divisor. These at most n+1 divisors sum to m. If q=0 use only r; if r=0 omit it. All edge cases and distinctness are accounted for.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> These are directly supplied application problems. P14 specifies strong induction; P10 specifies mathematical induction; P15&#x27;s decomposition naturally supports strong induction without that method being explicitly mandated.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Proving only that large amounts work when all amounts are requested; treating 0 as a positive divisor; omitting distinctness; considering one stone-splitting order rather than an arbitrary first split.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> constructions need validity checks; splitting proof: first contribution + two smaller totals; amount proof: necessary restrictions + sufficient bases + backward step.\u003c/p>\n\u003cp>Source: C5 pp. 30–32; T04 P10,14–15.\u003c/p>", "search": "\n\nWhat it means. Some induction statements assert a construction exists; others assert every construction has the same outcome. The step must build a permitted object or analyse all permitted decompositions. A numerical pattern alone does neither.\n\nHow to use it. For attainable amounts, first find necessary restrictions such as a common divisor, then establish bases covering the step size. For an arbitrary split, express the object as two strictly smaller pieces and apply strong induction to both. For a representation by divisors, verify that transformed pieces remain divisors and remain distinct.\n\nWorked example — derived T04 P14. Amounts formed from $25 and $40 are 5 times integers of the form 5a+8b, a,b≥0. For scaled amounts, 28=4·5+8,29=5+3·8,30=6·5,31=3·5+2·8,32=4·8. Strong induction now gives every integer ≥28: for a target t≥33, t−5≥28 is an earlier attainable amount, and one more 5 completes t. Thus every multiple of $5 at least $140 is attainable.\n\nTo determine all smaller possibilities, enumerate b=0,1,2,3 while 5a+8b28. The positive scaled results are 5,8,10,13,15,16,18,20,21,23,24,25,26. Multiply by 5 to obtain $25,$40,$50,$65,$75,$80,$90,$100,$105,$115,$120,$125,$130. Include $0 only if using no certificates is permitted. No nonmultiple of $5 is attainable. This separates the finite boundary check from the infinite induction argument.\n\nWorked example — derived T04 P15. Let the claim for n stones be that every full splitting process has total product sum n(n−1)/2. Basis n=1 has no split and sum 0. If the first split gives r,s≥1 with r+s=n, the first contribution is rs. Both piles are smaller than n, so strong induction gives their later totals r(r−1)/2 and s(s−1)/2 regardless of the subsequent splitting choices. Their sum with rs is [(r+s)²−(r+s)]/2=n(n−1)/2. This proves independence from the splitting sequence.\n\nWorked example — derived T04 P10, ordinary induction. Claim: every positive m≤n! is a sum of at most n distinct positive divisors of n!. Basis n=1 is 1. Assume the claim for n. For m≤(n+1)!, divide m=(n+1)q+r with 0≤r≤n and 0≤q≤n!. If q0, express q as a sum of at most n distinct divisors d_i of n!. Then (n+1)d_i are distinct divisors of (n+1)!. If r0, it also divides (n+1)! because 1≤r≤n, and it is smaller than every (n+1)d_i, so it is a new distinct divisor. These at most n+1 divisors sum to m. If q=0 use only r; if r=0 omit it. All edge cases and distinctness are accounted for.\n\nQuiz 2 style. These are directly supplied application problems. P14 specifies strong induction; P10 specifies mathematical induction; P15's decomposition naturally supports strong induction without that method being explicitly mandated.\n\nCommon traps. Proving only that large amounts work when all amounts are requested; treating 0 as a positive divisor; omitting distinctness; considering one stone-splitting order rather than an arbitrary first split.\n\nCHEAT SHEET CANDIDATE: constructions need validity checks; splitting proof: first contribution + two smaller totals; amount proof: necessary restrictions + sufficient bases + backward step.\n\nSource: C5 pp. 30–32; T04 P10,14–15.\n\na id=\"r06\"/a\n\n", "shortTitle": "Constructive induction: amounts, divisors and splitting", "part": "Part 10 — remaining Level 2 theory and applications"}, {"id": "I10", "title": "Well-ordering; least-element proofs; division algorithm and gcd existence", "section": "Chapter 5, Section 5.2 — Strong induction and well-ordering", "chapter": "Chapter 5", "priority": "L1", "source": "C5 pp. 8,29,33–34; C4 p. 50; T04 P17(a–e)", "ability": "Show a relevant set is nonempty, use its least element and complete existence/uniqueness arguments. Proof construction/completion", "prereq": "N01–02,N14,N16; contradiction; sets", "confusion": "Least versus merely minimal; existence versus uniqueness; well-ordering versus arbitrary ordering", "visual": "V p. 33 and T04 p. 2; F p. 34; Q string-order claim", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> Every nonempty subset of the nonnegative integers has a least element. This is a property of the domain, not a claim that every arbitrary ordered set has a least member. In a proof, define a set of candidate values, show it is nonempty, take its least member, and show that any violation of the target would produce a smaller member of the same set.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> The crucial checks are membership and nonnegativity/positivity. Saying “there would be a smaller number” is insufficient; that number must still belong to your candidate set. A least-element contradiction then proves the desired bound or divisibility.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture division-algorithm proof, expanded.\u003c/strong> For a∈Z,d&gt;0, let S={a−dq≥0:q∈Z}. It is nonempty because sufficiently negative q makes a−dq positive. Let r=a−dq_0 be its least member. If r≥d, then r−d=a−d(q_0+1) is a nonnegative member of S smaller than r, impossible. Hence 0≤r&lt;d and a=dq_0+r. For uniqueness, if a=dq+r=dq&#x27;+r&#x27;, then d(q−q&#x27;)=r&#x27;−r; the right side has absolute value &lt;d, so it is 0. Thus r=r&#x27; and q=q&#x27;. The uniqueness argument is an explanatory completion of the result stated on the slide.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P17.\u003c/strong> For positive a,b, define S={as+bt&gt;0:s,t∈Z}. It contains a, hence is nonempty. Let c be its least member. Every common divisor d of a,b divides c because c is an integer linear combination. Divide a by c: a=qc+r, 0≤r&lt;c. If r&gt;0, write c=as_0+bt_0; then r=a−qc=a(1−qs_0)+b(−qt_0), a smaller positive member of S. Contradiction. Therefore c∣a; the same reasoning gives c∣b. So c is a common divisor, and every positive common divisor divides c and is at most c. It is the gcd. Its representation c=as_0+bt_0 proves Bézout existence. If two positive numbers were both greatest common divisors, each would have to equal that same greatest value, giving uniqueness.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P17 scaffolds this exact reasoning chain. Nonemptiness, least-element use, and the remainder contradiction each need a reason.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Taking a least element before proving nonemptiness; using all integer combinations rather than positive ones; forgetting to show the smaller remainder is still a combination; confusing “a common divisor” with “the greatest”.\u003c/p>\n\u003cp>\u003cstrong>Source qualification.\u003c/strong> C5 p. 33 also says finite strings in lexicographic order are well ordered. That is not generally true for ordinary dictionary order on all finite strings; see the source register. The integer principle used above is unaffected.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> define S → show S nonempty → choose least c → assume failure → construct smaller member of S → contradiction.\u003c/p>\n\u003cp>Source: C5 pp. 8,29,33–34; C4 p. 50; T04 P17.\u003c/p>", "search": "\n\nWhat it means. Every nonempty subset of the nonnegative integers has a least element. This is a property of the domain, not a claim that every arbitrary ordered set has a least member. In a proof, define a set of candidate values, show it is nonempty, take its least member, and show that any violation of the target would produce a smaller member of the same set.\n\nHow to use it. The crucial checks are membership and nonnegativity/positivity. Saying “there would be a smaller number” is insufficient; that number must still belong to your candidate set. A least-element contradiction then proves the desired bound or divisibility.\n\nWorked example — lecture division-algorithm proof, expanded. For a∈Z,d0, let S={a−dq≥0:q∈Z}. It is nonempty because sufficiently negative q makes a−dq positive. Let r=a−dq_0 be its least member. If r≥d, then r−d=a−d(q_0+1) is a nonnegative member of S smaller than r, impossible. Hence 0≤rd and a=dq_0+r. For uniqueness, if a=dq+r=dq'+r', then d(q−q')=r'−r; the right side has absolute value d, so it is 0. Thus r=r' and q=q'. The uniqueness argument is an explanatory completion of the result stated on the slide.\n\nWorked example — derived T04 P17. For positive a,b, define S={as+bt0:s,t∈Z}. It contains a, hence is nonempty. Let c be its least member. Every common divisor d of a,b divides c because c is an integer linear combination. Divide a by c: a=qc+r, 0≤rc. If r0, write c=as_0+bt_0; then r=a−qc=a(1−qs_0)+b(−qt_0), a smaller positive member of S. Contradiction. Therefore c∣a; the same reasoning gives c∣b. So c is a common divisor, and every positive common divisor divides c and is at most c. It is the gcd. Its representation c=as_0+bt_0 proves Bézout existence. If two positive numbers were both greatest common divisors, each would have to equal that same greatest value, giving uniqueness.\n\nQuiz 2 style. T04 P17 scaffolds this exact reasoning chain. Nonemptiness, least-element use, and the remainder contradiction each need a reason.\n\nCommon traps. Taking a least element before proving nonemptiness; using all integer combinations rather than positive ones; forgetting to show the smaller remainder is still a combination; confusing “a common divisor” with “the greatest”.\n\nSource qualification. C5 p. 33 also says finite strings in lexicographic order are well ordered. That is not generally true for ordinary dictionary order on all finite strings; see the source register. The integer principle used above is unaffected.\n\nCHEAT SHEET CANDIDATE: define S → show S nonempty → choose least c → assume failure → construct smaller member of S → contradiction.\n\nSource: C5 pp. 8,29,33–34; C4 p. 50; T04 P17.\n\na id=\"i11\"/a\n\n", "shortTitle": "Well-ordering and least-element arguments", "part": "Part 7 — strong induction and well-ordering"}, {"id": "I11", "title": "Relationship between ordinary induction, strong induction and well-ordering", "section": "Chapter 5, Section 5.2 — Strong induction and well-ordering", "chapter": "Chapter 5", "priority": "L2", "source": "C5 pp. 8,29; —", "ability": "Recognise equivalence and follow the supplied well-ordering justification of induction. Recognition, proof completion", "prereq": "I01,I08,I10", "confusion": "Equivalent principles versus identical proof templates", "visual": "T; all equivalence-direction proofs are not supplied", "confidence": "CONFIRMED / L2 for stated equivalence/supplied argument", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> Ordinary induction, strong induction and well-ordering are equivalent principles for the relevant integer domain. “Strong” means a broader-looking hypothesis, not a logically more powerful theorem. Choose the form that fits the way smaller cases enter the problem.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> One predecessor naturally suggests ordinary induction; several or arbitrary smaller predecessors suggest strong induction; a smallest failing/candidate value suggests well-ordering. If a tutorial prescribes a method, follow that instruction. The slides state equivalence but do not supply every textbook proof direction, so the goal here is the stated relationship and the supplied justification.\u003c/p>\n\u003cp>\u003cstrong>Worked argument — lecture validity proof, explained.\u003c/strong> Suppose P(1) is true and every P(k)⇒P(k+1) holds. If any positive integer failed, let m be the least failing value by well-ordering. It cannot be 1. Thus m−1≥1 and is not a failure, so P(m−1) holds. The transition implies P(m), contradicting the choice of m. Therefore there are no failures. Notice how the base rules out m=1 before m−1 is used.\u003c/p>\n\u003cp>\u003cstrong>Explanatory connection — derived, not an additional syllabus unit.\u003c/strong> To see how ordinary induction can package a strong hypothesis, define Q(k) to mean P(b),P(b+1),...,P(k) all hold. Ordinary induction on Q lets the next step use all those facts. This explains the equivalence without demanding memorisation of every formal direction.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> Recognition, method justification and completing the supplied least-counterexample proof are lecture-supported. No approved tutorial asks for all equivalence proofs as a standalone set.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Thinking strong induction proves statements ordinary induction cannot; confusing the induction hypothesis with the conclusion; choosing a least counterexample in a domain without a suitable least-element property.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> ordinary = previous case; strong = all earlier cases; well-ordering = least candidate/counterexample. Equivalent principles, different convenient proof organisations.\u003c/p>\n\u003cp>Source: C5 pp. 8,29.\u003c/p>", "search": "\n\nWhat it means. Ordinary induction, strong induction and well-ordering are equivalent principles for the relevant integer domain. “Strong” means a broader-looking hypothesis, not a logically more powerful theorem. Choose the form that fits the way smaller cases enter the problem.\n\nHow to use it. One predecessor naturally suggests ordinary induction; several or arbitrary smaller predecessors suggest strong induction; a smallest failing/candidate value suggests well-ordering. If a tutorial prescribes a method, follow that instruction. The slides state equivalence but do not supply every textbook proof direction, so the goal here is the stated relationship and the supplied justification.\n\nWorked argument — lecture validity proof, explained. Suppose P(1) is true and every P(k)⇒P(k+1) holds. If any positive integer failed, let m be the least failing value by well-ordering. It cannot be 1. Thus m−1≥1 and is not a failure, so P(m−1) holds. The transition implies P(m), contradicting the choice of m. Therefore there are no failures. Notice how the base rules out m=1 before m−1 is used.\n\nExplanatory connection — derived, not an additional syllabus unit. To see how ordinary induction can package a strong hypothesis, define Q(k) to mean P(b),P(b+1),...,P(k) all hold. Ordinary induction on Q lets the next step use all those facts. This explains the equivalence without demanding memorisation of every formal direction.\n\nQuiz 2 style. Recognition, method justification and completing the supplied least-counterexample proof are lecture-supported. No approved tutorial asks for all equivalence proofs as a standalone set.\n\nCommon traps. Thinking strong induction proves statements ordinary induction cannot; confusing the induction hypothesis with the conclusion; choosing a least counterexample in a domain without a suitable least-element property.\n\nCHEAT SHEET CANDIDATE: ordinary = previous case; strong = all earlier cases; well-ordering = least candidate/counterexample. Equivalent principles, different convenient proof organisations.\n\nSource: C5 pp. 8,29.\n\na id=\"n18\"/a\n\n", "shortTitle": "Why the induction principles agree", "part": "Part 7 — strong induction and well-ordering"}, {"id": "R01", "title": "Recursive functions: basis/rule, evaluation, factorial/sum definitions and well-definedness", "section": "Chapter 5, Section 5.3 — Recursion and structural induction", "chapter": "Chapter 5", "priority": "L1", "source": "C5 pp. 37–39; T05 P1", "ability": "Evaluate or construct a supported recursive definition; show why a proposed definition fails. Definition, calculation, construction, counterexample/contradiction", "prereq": "Function domain; integer indexing; I01", "confusion": "Recursive definition versus closed formula; omitted base versus circular/nondecreasing dependency", "visual": "V T05 p. 1 from inspection; F C5 pp. 38–39", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> A recursive definition specifies starting values and rules for later values using already determined ones. It is a valid definition only if every input in the domain obtains exactly one value. A formula that refers to earlier-looking symbols can still fail through missing bases, leaving the domain or circular constraints.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> For evaluation, start at the base and compute only from known values. For construction, identify the simplest input and how the next case is built. For validity, inspect the smallest inputs first, check all referenced inputs lie in the domain, and look for a self-referential contradiction. A recurrence is not a request to solve it by Chapter 8 techniques.\u003c/p>\n\u003cp>\u003cstrong>Worked examples — lecture examples, explained.\u003c/strong> With f(0)=3 and f(n+1)=2f(n)+3, the values are f(1)=9,f(2)=21,f(3)=45,f(4)=93. Factorial is defined by f(0)=1 and f(n+1)=(n+1)f(n). A running sum S(n)=Σ_(j=0)^n a_j is defined by S(0)=a_0 and S(n+1)=S(n)+a_(n+1). Each rule identifies a base and moves to a strictly earlier input.\u003c/p>\n\u003cp>\u003cstrong>Worked examples — derived T05 P1.\u003c/strong> In P1(a), the odd-input rule f(n)=3f(n−2) with only f(0)=4 refers at n=1 to f(−1), outside the nonnegative domain. The given basis covers the even chain, not the odd chain. Even if the recursive rule is intended only for positive inputs, the odd case fails. In P1(b), f(n)=f(f(n−1))+5 with f(0)=1 forces at n=1 the equation f(1)=f(f(0))+5=f(1)+5, impossible. This is a contradiction, not merely a slow evaluation.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T05 P1 asks you to prove failure, so name the specific input and obstruction. A vague “it is recursive” or “it is circular” is not enough.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Forgetting a second base for a two-step recurrence; applying a recursive rule at an input reserved for the basis; mixing f(n−1) with f(n)−1; assuming every displayed recurrence defines a function.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> basis + rule + domain; every dependency must be available; test the earliest inputs when diagnosing a bad definition.\u003c/p>\n\u003cp>Source: C5 pp. 37–39; T05 P1.\u003c/p>", "search": "\n\nWhat it means. A recursive definition specifies starting values and rules for later values using already determined ones. It is a valid definition only if every input in the domain obtains exactly one value. A formula that refers to earlier-looking symbols can still fail through missing bases, leaving the domain or circular constraints.\n\nHow to use it. For evaluation, start at the base and compute only from known values. For construction, identify the simplest input and how the next case is built. For validity, inspect the smallest inputs first, check all referenced inputs lie in the domain, and look for a self-referential contradiction. A recurrence is not a request to solve it by Chapter 8 techniques.\n\nWorked examples — lecture examples, explained. With f(0)=3 and f(n+1)=2f(n)+3, the values are f(1)=9,f(2)=21,f(3)=45,f(4)=93. Factorial is defined by f(0)=1 and f(n+1)=(n+1)f(n). A running sum S(n)=Σ_(j=0)^n a_j is defined by S(0)=a_0 and S(n+1)=S(n)+a_(n+1). Each rule identifies a base and moves to a strictly earlier input.\n\nWorked examples — derived T05 P1. In P1(a), the odd-input rule f(n)=3f(n−2) with only f(0)=4 refers at n=1 to f(−1), outside the nonnegative domain. The given basis covers the even chain, not the odd chain. Even if the recursive rule is intended only for positive inputs, the odd case fails. In P1(b), f(n)=f(f(n−1))+5 with f(0)=1 forces at n=1 the equation f(1)=f(f(0))+5=f(1)+5, impossible. This is a contradiction, not merely a slow evaluation.\n\nQuiz 2 style. T05 P1 asks you to prove failure, so name the specific input and obstruction. A vague “it is recursive” or “it is circular” is not enough.\n\nCommon traps. Forgetting a second base for a two-step recurrence; applying a recursive rule at an input reserved for the basis; mixing f(n−1) with f(n)−1; assuming every displayed recurrence defines a function.\n\nCHEAT SHEET CANDIDATE: basis + rule + domain; every dependency must be available; test the earliest inputs when diagnosing a bad definition.\n\nSource: C5 pp. 37–39; T05 P1.\n\na id=\"r02\"/a\n\n", "shortTitle": "Recursive functions and well-definedness", "part": "Part 8 — recursive functions and recursively defined sets"}, {"id": "R02", "title": "Fibonacci recursion and inductive identities", "section": "Chapter 5, Section 5.3 — Recursion and structural induction", "chapter": "Chapter 5", "priority": "L1", "source": "C5 pp. 40–41; T05 P2(a–b)", "ability": "Calculate terms and prove sum/product identities using the given recursion. Calculation, proof", "prereq": "R01,I01,I08; sums and products", "confusion": "f_n squared versus f_(n squared); Fibonacci recursion versus Chapter 8 solution machinery", "visual": "F C5 pp. 40–41; V T05 p. 1", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> The course uses f_0=0,f_1=1 and f_n=f_(n−1)+f_(n−2) for n≥2. Thus the sequence begins 0,1,1,2,3,5,8,... . Two starting values are needed because the rule reaches back two positions. The same recurrence can be used inside an induction proof without finding a closed formula.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Keep the indices explicit. To prove a sum identity, append the new term, substitute the hypothesis and use the Fibonacci rule to combine adjacent terms. If the desired identity involves a product, factor one common Fibonacci term. Do not confuse a square f_j² with a changed index f_(j²).\u003c/p>\n\u003cp>\u003cstrong>Worked proof — derived T05 P2(a).\u003c/strong> Claim Σ_(j=0)^n f_(2j)=f_(2n+1)−1. Basis n=0: 0=1−1. Assuming the identity at k, the next sum is f_(2k+1)−1+f_(2k+2)=f_(2k+3)−1, precisely the formula at k+1.\u003c/p>\n\u003cp>\u003cstrong>Worked proof — derived T05 P2(b).\u003c/strong> Claim Σ_(j=0)^n f_j²=f_n f_(n+1). Basis n=0: 0=0·1. At k+1, the sum equals f_k f_(k+1)+f_(k+1)²=f_(k+1)[f_k+f_(k+1)]=f_(k+1)f_(k+2). This proves the identity. For a numerical check only, at n=4 the left side is 0+1+1+4+9=15 and the right is 3·5=15; the induction establishes all n.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T05 P2 explicitly asks for identities; C5 p. 41 also uses strong induction for a growth bound, treated in R03. No characteristic-equation method is needed or imported.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Starting with f_1=f_2=1 but forgetting the problem includes f_0; adding f_(2k+1) rather than f_(2k+2) in the even-index sum; changing an index without citing the recurrence.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> f_0=0,f_1=1; f_(n+2)=f_(n+1)+f_n; append next term, factor, then use adjacent-term recurrence.\u003c/p>\n\u003cp>Source: C5 pp. 40–41; T05 P2.\u003c/p>", "search": "\n\nWhat it means. The course uses f_0=0,f_1=1 and f_n=f_(n−1)+f_(n−2) for n≥2. Thus the sequence begins 0,1,1,2,3,5,8,... . Two starting values are needed because the rule reaches back two positions. The same recurrence can be used inside an induction proof without finding a closed formula.\n\nHow to use it. Keep the indices explicit. To prove a sum identity, append the new term, substitute the hypothesis and use the Fibonacci rule to combine adjacent terms. If the desired identity involves a product, factor one common Fibonacci term. Do not confuse a square f_j² with a changed index f_(j²).\n\nWorked proof — derived T05 P2(a). Claim Σ_(j=0)^n f_(2j)=f_(2n+1)−1. Basis n=0: 0=1−1. Assuming the identity at k, the next sum is f_(2k+1)−1+f_(2k+2)=f_(2k+3)−1, precisely the formula at k+1.\n\nWorked proof — derived T05 P2(b). Claim Σ_(j=0)^n f_j²=f_n f_(n+1). Basis n=0: 0=0·1. At k+1, the sum equals f_k f_(k+1)+f_(k+1)²=f_(k+1)[f_k+f_(k+1)]=f_(k+1)f_(k+2). This proves the identity. For a numerical check only, at n=4 the left side is 0+1+1+4+9=15 and the right is 3·5=15; the induction establishes all n.\n\nQuiz 2 style. T05 P2 explicitly asks for identities; C5 p. 41 also uses strong induction for a growth bound, treated in R03. No characteristic-equation method is needed or imported.\n\nCommon traps. Starting with f_1=f_2=1 but forgetting the problem includes f_0; adding f_(2k+1) rather than f_(2k+2) in the even-index sum; changing an index without citing the recurrence.\n\nCHEAT SHEET CANDIDATE: f_0=0,f_1=1; f_(n+2)=f_(n+1)+f_n; append next term, factor, then use adjacent-term recurrence.\n\nSource: C5 pp. 40–41; T05 P2.\n\na id=\"r04\"/a\n\n", "shortTitle": "Fibonacci recursion and inductive identities", "part": "Part 8 — recursive functions and recursively defined sets"}, {"id": "R03", "title": "Fibonacci growth bound and Lamé's theorem", "section": "Chapter 5, Section 5.3 — Recursion and structural induction", "chapter": "Chapter 5", "priority": "L3", "source": "C5 pp. 41–44; —", "ability": "Follow the growth-bound proof and apply/explain the division-count bound, including its Fibonacci connection and stated logarithmic consequence. Theorem application, proof completion", "prereq": "R02,I08,N15; logarithms; decimal digit count", "confusion": "Number of divisions versus number of digits; upper complexity bound versus exact runtime", "visual": "F pp. 41–44, especially paired columns p. 43", "confidence": "CONFIRMED / L3", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> The lecture links two earlier topics: Fibonacci numbers grow quickly, and a long Euclidean division chain forces its initial numbers to be at least as large as corresponding Fibonacci numbers. Thus a number&#x27;s decimal digit count bounds how many divisions the Euclidean algorithm can require.\u003c/p>\n\u003cp>Let α=(1+√5)/2. The supplied Fibonacci bound is f_n&gt;α^(n−2) for n≥3. Lamé&#x27;s theorem says that for positive a≥b, the number D of Euclidean divisions is at most five times the number d of decimal digits in b. Count the final exact division as a division. This is an upper bound, not an exact count or a promise that five divisions occur per digit.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> For an application, identify the smaller positive input b, compute its decimal digit count and multiply by 5. For proof completion, follow the chain: Fibonacci growth → remainder lower bounds → logarithm → integer division bound. Do not import characteristic equations to obtain a Fibonacci closed form.\u003c/p>\n\u003cp>\u003cstrong>Worked growth proof — lecture argument, explained.\u003c/strong> α²=α+1. Bases: f_3=2&gt;α and f_4=3&gt;α². Assume the bound for all 3≤j≤k with k≥4. Then\u003c/p>\n\u003cp>f_(k+1)=f_k+f_(k−1)&gt;α^(k−2)+α^(k−3)=α^(k−3)(α+1)=α^(k−1).\u003c/p>\n\u003cp>This is the desired exponent (k+1)−2. Two bases support the two earlier Fibonacci terms.\u003c/p>\n\u003cp>\u003cstrong>Worked proof chain — lecture Lamé argument, expanded.\u003c/strong> Write the Euclidean remainders as r_0=a,r_1=b,...,r_D&gt;0 with the final equation r_(D−1)=q_D r_D. For a&gt;b, the last quotient is at least 2; earlier quotients are at least 1. Hence r_D≥1=f_2, r_(D−1)≥2r_D≥f_3, and moving backwards gives r_j≥r_(j+1)+r_(j+2), so b=r_1≥f_(D+1). For D&gt;2, the growth bound yields b&gt;α^(D−1). Taking base-10 logs gives D−1&lt;log_10 b/log_10 α&lt;5 log_10 b, since log_10 α&gt;1/5. With d decimal digits, b&lt;10^d, so D−1&lt;5d; because D and 5d are integers, D≤5d. Cases D≤2 satisfy the bound directly because d≥1. If a=b, one exact division also satisfies it. These small cases make the slide&#x27;s abbreviated argument complete.\u003c/p>\n\u003cp>\u003cstrong>Worked application — analogous.\u003c/strong> For a=287,b=91, b has 2 digits, so the theorem gives at most 10 divisions. The actual chain in N15 has 3, which is consistent. A 100-digit b gives a bound of 500 divisions regardless of the larger a. The lecture&#x27;s O(log b) consequence describes the growth in the number of divisions, not a full bit-operation runtime analysis.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> The lecture supports applying the bound and following a multi-step proof. No direct scoped tutorial problem establishes higher emphasis.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Counting digits of a instead of b; confusing d with D; using the growth theorem below its stated range; treating the upper bound as equality; losing the index offset f_(D+1).\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> α²=α+1; f_n&gt;α^(n−2), n≥3; b≥f_(D+1); D≤5·digits(b); handle D≤2/a=b directly.\u003c/p>\n\u003cp>Source: C5 pp. 41–44; paired proof columns and indices visually verified.\u003c/p>", "search": "\n\nWhat it means. The lecture links two earlier topics: Fibonacci numbers grow quickly, and a long Euclidean division chain forces its initial numbers to be at least as large as corresponding Fibonacci numbers. Thus a number's decimal digit count bounds how many divisions the Euclidean algorithm can require.\n\nLet α=(1+√5)/2. The supplied Fibonacci bound is f_nα^(n−2) for n≥3. Lamé's theorem says that for positive a≥b, the number D of Euclidean divisions is at most five times the number d of decimal digits in b. Count the final exact division as a division. This is an upper bound, not an exact count or a promise that five divisions occur per digit.\n\nHow to use it. For an application, identify the smaller positive input b, compute its decimal digit count and multiply by 5. For proof completion, follow the chain: Fibonacci growth → remainder lower bounds → logarithm → integer division bound. Do not import characteristic equations to obtain a Fibonacci closed form.\n\nWorked growth proof — lecture argument, explained. α²=α+1. Bases: f_3=2α and f_4=3α². Assume the bound for all 3≤j≤k with k≥4. Then\n\nf_(k+1)=f_k+f_(k−1)α^(k−2)+α^(k−3)=α^(k−3)(α+1)=α^(k−1).\n\nThis is the desired exponent (k+1)−2. Two bases support the two earlier Fibonacci terms.\n\nWorked proof chain — lecture Lamé argument, expanded. Write the Euclidean remainders as r_0=a,r_1=b,...,r_D0 with the final equation r_(D−1)=q_D r_D. For ab, the last quotient is at least 2; earlier quotients are at least 1. Hence r_D≥1=f_2, r_(D−1)≥2r_D≥f_3, and moving backwards gives r_j≥r_(j+1)+r_(j+2), so b=r_1≥f_(D+1). For D2, the growth bound yields bα^(D−1). Taking base-10 logs gives D−1log_10 b/log_10 α5 log_10 b, since log_10 α1/5. With d decimal digits, b10^d, so D−15d; because D and 5d are integers, D≤5d. Cases D≤2 satisfy the bound directly because d≥1. If a=b, one exact division also satisfies it. These small cases make the slide's abbreviated argument complete.\n\nWorked application — analogous. For a=287,b=91, b has 2 digits, so the theorem gives at most 10 divisions. The actual chain in N15 has 3, which is consistent. A 100-digit b gives a bound of 500 divisions regardless of the larger a. The lecture's O(log b) consequence describes the growth in the number of divisions, not a full bit-operation runtime analysis.\n\nQuiz 2 style. The lecture supports applying the bound and following a multi-step proof. No direct scoped tutorial problem establishes higher emphasis.\n\nCommon traps. Counting digits of a instead of b; confusing d with D; using the growth theorem below its stated range; treating the upper bound as equality; losing the index offset f_(D+1).\n\nCHEAT SHEET CANDIDATE: α²=α+1; f_nα^(n−2), n≥3; b≥f_(D+1); D≤5·digits(b); handle D≤2/a=b directly.\n\nSource: C5 pp. 41–44; paired proof columns and indices visually verified.\n\na id=\"r10\"/a\n\n", "shortTitle": "Fibonacci growth and Lamé's theorem", "part": "Part 11 — Level 3 material"}, {"id": "R04", "title": "Recursive sets, basis/rules/exclusion; generated elements", "section": "Chapter 5, Section 5.3 — Recursion and structural induction", "chapter": "Chapter 5", "priority": "L1", "source": "C5 pp. 45–46; T05 P3(a),4", "ability": "Generate elements and formulate a recursive set definition that reaches exactly the intended set. Definition/construction, calculation", "prereq": "Sets; ordered pairs; function/rule notation", "confusion": "Being closed under rules versus containing only generated elements", "visual": "V T05 p. 1; T lecture", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> A recursive set is specified by basis elements and rules for generating new elements from existing ones. The course assumes an exclusion rule: nothing belongs unless obtainable by finitely many applications of those rules. Closure alone is not a full characterisation, because many larger sets are also closed.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> To generate elements, start with the bases, apply every rule systematically and remove duplicates. To design a definition, choose seeds covering the possible boundary cases and transformations preserving the desired property. Then prove both that generated elements are valid and that every intended element can be generated.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T05 P3(a).\u003c/strong> Begin with (0,0); each move adds (2,3) or (3,2). After exactly t moves, using the second move j times and the first t−j times, a generated pair has the form (2t+j,3t−j), 0≤j≤t. The first five layers are:\u003c/p>\n\u003cul>\u003cli>t=1: (2,3),(3,2).\u003c/li>\u003cli>t=2: (4,6),(5,5),(6,4).\u003c/li>\u003cli>t=3: (6,9),(7,8),(8,7),(9,6).\u003c/li>\u003cli>t=4: (8,12),(9,11),(10,10),(11,9),(12,8).\u003c/li>\u003cli>t=5: (10,15),(11,14),(12,13),(13,12),(14,11),(15,10).\u003c/li>\u003c/ul>\n\u003cp>This uses “applications” as generation depth/layers. If the intended wording counts individual sequential rule executions instead, the listed intermediate set depends on which execution is chosen; the layer interpretation and the distinction should be explicit.\u003c/p>\n\u003cp>\u003cstrong>Construction example — derived T05 P4(a).\u003c/strong> To generate all positive pairs (a,b) with a+b even, use bases (1,1),(2,2) and moves (a,b)→(a+2,b),(a,b+2). These preserve equal parity. Conversely any positive odd-odd pair reduces by 2 in its coordinates to (1,1), and any positive even-even pair to (2,2). This second direction proves completeness.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T05 P3 asks for generated elements; P4 asks you to invent a correct definition and justify it. Listing several members is not the same as defining the whole set.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Missing a parity class; using a move that leaves the target set; neglecting the exclusion rule; proving only that generated elements are valid.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> seeds + constructors + exclusion; correctness = soundness and completeness; distinguish exact generation depth from cumulative membership.\u003c/p>\n\u003cp>Source: C5 pp. 45–46; T05 P3–4.\u003c/p>", "search": "\n\nWhat it means. A recursive set is specified by basis elements and rules for generating new elements from existing ones. The course assumes an exclusion rule: nothing belongs unless obtainable by finitely many applications of those rules. Closure alone is not a full characterisation, because many larger sets are also closed.\n\nHow to use it. To generate elements, start with the bases, apply every rule systematically and remove duplicates. To design a definition, choose seeds covering the possible boundary cases and transformations preserving the desired property. Then prove both that generated elements are valid and that every intended element can be generated.\n\nWorked example — derived T05 P3(a). Begin with (0,0); each move adds (2,3) or (3,2). After exactly t moves, using the second move j times and the first t−j times, a generated pair has the form (2t+j,3t−j), 0≤j≤t. The first five layers are:\n\n- t=1: (2,3),(3,2).\n- t=2: (4,6),(5,5),(6,4).\n- t=3: (6,9),(7,8),(8,7),(9,6).\n- t=4: (8,12),(9,11),(10,10),(11,9),(12,8).\n- t=5: (10,15),(11,14),(12,13),(13,12),(14,11),(15,10).\n\nThis uses “applications” as generation depth/layers. If the intended wording counts individual sequential rule executions instead, the listed intermediate set depends on which execution is chosen; the layer interpretation and the distinction should be explicit.\n\nConstruction example — derived T05 P4(a). To generate all positive pairs (a,b) with a+b even, use bases (1,1),(2,2) and moves (a,b)→(a+2,b),(a,b+2). These preserve equal parity. Conversely any positive odd-odd pair reduces by 2 in its coordinates to (1,1), and any positive even-even pair to (2,2). This second direction proves completeness.\n\nQuiz 2 style. T05 P3 asks for generated elements; P4 asks you to invent a correct definition and justify it. Listing several members is not the same as defining the whole set.\n\nCommon traps. Missing a parity class; using a move that leaves the target set; neglecting the exclusion rule; proving only that generated elements are valid.\n\nCHEAT SHEET CANDIDATE: seeds + constructors + exclusion; correctness = soundness and completeness; distinguish exact generation depth from cumulative membership.\n\nSource: C5 pp. 45–46; T05 P3–4.\n\n", "shortTitle": "Recursive sets and constructing definitions", "part": "Part 8 — recursive functions and recursively defined sets"}, {"id": "R05", "title": "Structural induction, invariants and proving equality of recursively defined sets", "section": "Chapter 5, Section 5.3 — Recursion and structural induction", "chapter": "Chapter 5", "priority": "L1", "source": "C5 pp. 56–58; T05 P3(b–c),4", "ability": "Prove preservation under every constructor; distinguish soundness from full set equality; compare induction on construction steps with structural induction. Proof construction", "prereq": "R04,I01,I08,N01; two set inclusions", "confusion": "Invariant versus complete characterisation; structural proof versus induction on numerical value", "visual": "V tutorial p. 1; T lecture", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> Structural induction proves a property of every object generated by a recursive definition. Check the property for every basis object. Then, for each construction rule, assume the input objects satisfy the property and show the new object does too. The exclusion rule ensures every member is reached by these cases. The hypothesis follows the construction, not an arbitrary numerical label.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Copy the basis cases and constructors from the definition. Write the desired property for a generic object. In the recursive step, state the property for every input used by the constructor and derive it for the output. If proving that a recursively defined set equals a described set, a preservation argument establishes only one inclusion; supply a generation/decomposition argument for the other.\u003c/p>\n\u003cp>\u003cstrong>Worked proof — derived T05 P3(c).\u003c/strong> Property: if (a,b) is generated, then 5∣a+b. The basis (0,0) has sum 0. Assume 5∣a+b. The two constructors give sums (a+2)+(b+3)=a+b+5 and (a+3)+(b+2)=a+b+5, both divisible by 5. Both rules preserve the property, so every generated pair has it. For P3(b), an induction on the number of construction steps instead assumes the property for all pairs obtainable earlier, then applies the same sum calculation. The calculation is the same; the organisation of the hypothesis differs.\u003c/p>\n\u003cp>\u003cstrong>Worked set-equality proof — lecture example, explained.\u003c/strong> Let S start with 3 and be closed under adding two members. Structural induction proves every member is a positive multiple of 3: basis 3, and sums of positive multiples remain so. Conversely, ordinary induction proves every 3n for n≥1 is in S: 3 is the basis, and 3(n+1)=3n+3 is generated from two members. Both inclusions give S={3,6,9,...}; the first alone would not exclude an incomplete subset such as {3} if the constructor obligation were not also checked.\u003c/p>\n\u003cp>\u003cstrong>Further construction variations — derived T05 P4(b–c).\u003c/strong> For positive pairs with at least one odd coordinate, take seeds (1,1),(1,2),(2,1), with +2 in either coordinate. The three permitted parity patterns are preserved, and any target reduces to the matching seed. For a+b odd and 3∣b, use seeds (2,3),(1,6), with moves +2 in a or +6 in b. If b is an odd multiple of 3, a must be even and the first seed applies; if b is an even multiple of 3, a must be odd and the second applies. Subtraction of these increments reduces every target to one of the seeds. This supplies soundness and completeness, not merely an invariant.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T05 P3–5 explicitly ask for structural induction. Showing a few generated examples is not a proof for all objects.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Forgetting a constructor; assuming the output property rather than input properties; showing an invariant but claiming it characterises the set; using ordinary numeric induction when a structural proof is required.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> all bases + every constructor; hypotheses on constituent objects; for equality, add the converse generation argument.\u003c/p>\n\u003cp>Source: C5 pp. 56–58; T05 P3–4.\u003c/p>", "search": "\n\nWhat it means. Structural induction proves a property of every object generated by a recursive definition. Check the property for every basis object. Then, for each construction rule, assume the input objects satisfy the property and show the new object does too. The exclusion rule ensures every member is reached by these cases. The hypothesis follows the construction, not an arbitrary numerical label.\n\nHow to use it. Copy the basis cases and constructors from the definition. Write the desired property for a generic object. In the recursive step, state the property for every input used by the constructor and derive it for the output. If proving that a recursively defined set equals a described set, a preservation argument establishes only one inclusion; supply a generation/decomposition argument for the other.\n\nWorked proof — derived T05 P3(c). Property: if (a,b) is generated, then 5∣a+b. The basis (0,0) has sum 0. Assume 5∣a+b. The two constructors give sums (a+2)+(b+3)=a+b+5 and (a+3)+(b+2)=a+b+5, both divisible by 5. Both rules preserve the property, so every generated pair has it. For P3(b), an induction on the number of construction steps instead assumes the property for all pairs obtainable earlier, then applies the same sum calculation. The calculation is the same; the organisation of the hypothesis differs.\n\nWorked set-equality proof — lecture example, explained. Let S start with 3 and be closed under adding two members. Structural induction proves every member is a positive multiple of 3: basis 3, and sums of positive multiples remain so. Conversely, ordinary induction proves every 3n for n≥1 is in S: 3 is the basis, and 3(n+1)=3n+3 is generated from two members. Both inclusions give S={3,6,9,...}; the first alone would not exclude an incomplete subset such as {3} if the constructor obligation were not also checked.\n\nFurther construction variations — derived T05 P4(b–c). For positive pairs with at least one odd coordinate, take seeds (1,1),(1,2),(2,1), with +2 in either coordinate. The three permitted parity patterns are preserved, and any target reduces to the matching seed. For a+b odd and 3∣b, use seeds (2,3),(1,6), with moves +2 in a or +6 in b. If b is an odd multiple of 3, a must be even and the first seed applies; if b is an even multiple of 3, a must be odd and the second applies. Subtraction of these increments reduces every target to one of the seeds. This supplies soundness and completeness, not merely an invariant.\n\nQuiz 2 style. T05 P3–5 explicitly ask for structural induction. Showing a few generated examples is not a proof for all objects.\n\nCommon traps. Forgetting a constructor; assuming the output property rather than input properties; showing an invariant but claiming it characterises the set; using ordinary numeric induction when a structural proof is required.\n\nCHEAT SHEET CANDIDATE: all bases + every constructor; hypotheses on constituent objects; for equality, add the converse generation argument.\n\nSource: C5 pp. 56–58; T05 P3–4.\n\na id=\"r08\"/a\n\n", "shortTitle": "Structural induction and exact set characterisation", "part": "Part 9 — structural induction and trees"}, {"id": "R06", "title": "Strings, empty string, concatenation and recursive length", "section": "Chapter 5, Section 5.3 — Recursion and structural induction", "chapter": "Chapter 5", "priority": "L2", "source": "C5 pp. 47–49; —", "ability": "Apply the supplied definitions and construct/interpret strings and lengths. Definition, calculation, recursive construction", "prereq": "R01,R04; alphabet and set notation", "confusion": "Symbol versus string; empty string versus empty set; concatenation versus arithmetic", "visual": "F pp. 47–49 notation", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> An alphabet Σ is a set of symbols. Σ* is the set of finite strings over it, including the empty string λ. A recursive definition gives λ∈Σ* and, for w∈Σ* and x∈Σ, wx∈Σ*. The exclusion rule prevents other objects. A symbol is one item; a string is a finite ordered sequence of symbols.\u003c/p>\n\u003cp>Concatenation joins strings in order. Recursively, w·λ=w and w_1·(w_2x)=(w_1·w_2)x. Length obeys l(λ)=0 and l(wx)=l(w)+1. These are definitions on structure, not arithmetic multiplication and not multiplication of lengths.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Build a string by appending symbols to λ. For a recursive argument, split a nonempty string into a shorter prefix w and a final symbol x. Match the basis and recursive cases to that definition. When evaluating concatenation, preserve both order and repeated symbols.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> For Σ={a,b}, λ→a→aa→aab demonstrates membership of aab. Its length is l(aab)=l(aa)+1=l(a)+2=l(λ)+3=3. Concatenating abra and cadabra yields abracadabra, length 11, preserving all repeated letters.\u003c/p>\n\u003cp>\u003cstrong>Worked proof — analogous structural application.\u003c/strong> Show l(uv)=l(u)+l(v), fixing any u and inducting structurally on v. Basis v=λ: l(uλ)=l(u)=l(u)+0. If the property holds for v=w, then l(u(wx))=l((uw)x)=l(uw)+1=l(u)+l(w)+1=l(u)+l(wx). Thus the constructor preserves it. This demonstrates how the string definitions support a proof, not just evaluation.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> These definitions are explicit in the lecture; no direct approved tutorial task adds emphasis. Recursive construction and definition application are supported styles.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Confusing λ with ∅: λ is one string, ∅ is a set with no members. Concatenation is generally not commutative: ab differs from ba. A repeated symbol still contributes to length.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> λ basis; append one symbol; l(λ)=0,l(wx)=l(w)+1; wλ=w; split a nonempty string into prefix and last symbol.\u003c/p>\n\u003cp>Source: C5 pp. 47–49.\u003c/p>", "search": "\n\nWhat it means. An alphabet Σ is a set of symbols. Σ is the set of finite strings over it, including the empty string λ. A recursive definition gives λ∈Σ and, for w∈Σ and x∈Σ, wx∈Σ. The exclusion rule prevents other objects. A symbol is one item; a string is a finite ordered sequence of symbols.\n\nConcatenation joins strings in order. Recursively, w·λ=w and w_1·(w_2x)=(w_1·w_2)x. Length obeys l(λ)=0 and l(wx)=l(w)+1. These are definitions on structure, not arithmetic multiplication and not multiplication of lengths.\n\nHow to use it. Build a string by appending symbols to λ. For a recursive argument, split a nonempty string into a shorter prefix w and a final symbol x. Match the basis and recursive cases to that definition. When evaluating concatenation, preserve both order and repeated symbols.\n\nWorked example — lecture example, explained. For Σ={a,b}, λ→a→aa→aab demonstrates membership of aab. Its length is l(aab)=l(aa)+1=l(a)+2=l(λ)+3=3. Concatenating abra and cadabra yields abracadabra, length 11, preserving all repeated letters.\n\nWorked proof — analogous structural application. Show l(uv)=l(u)+l(v), fixing any u and inducting structurally on v. Basis v=λ: l(uλ)=l(u)=l(u)+0. If the property holds for v=w, then l(u(wx))=l((uw)x)=l(uw)+1=l(u)+l(w)+1=l(u)+l(wx). Thus the constructor preserves it. This demonstrates how the string definitions support a proof, not just evaluation.\n\nQuiz 2 style. These definitions are explicit in the lecture; no direct approved tutorial task adds emphasis. Recursive construction and definition application are supported styles.\n\nCommon traps. Confusing λ with ∅: λ is one string, ∅ is a set with no members. Concatenation is generally not commutative: ab differs from ba. A repeated symbol still contributes to length.\n\nCHEAT SHEET CANDIDATE: λ basis; append one symbol; l(λ)=0,l(wx)=l(w)+1; wλ=w; split a nonempty string into prefix and last symbol.\n\nSource: C5 pp. 47–49.\n\na id=\"r07\"/a\n\n", "shortTitle": "Strings, concatenation and recursive length", "part": "Part 10 — remaining Level 2 theory and applications"}, {"id": "R07", "title": "Balanced-parenthesis recursive example and well-formed formulae", "section": "Chapter 5, Section 5.3 — Recursion and structural induction", "chapter": "Chapter 5", "priority": "L2", "source": "C5 pp. 50–51; —", "ability": "Recognise permitted constructions and explain membership under the given rules; interpret formula syntax. Recognition, recursive construction", "prereq": "R04,R06; propositional operator symbols", "confusion": "Syntactic well-formedness versus truth; balanced strings versus strings generated by the supplied restricted rules", "visual": "V p. 50; F p. 51; Q completeness of parenthesis grammar", "confidence": "CONFIRMED / L2 topic; full grammar claim UNCERTAIN", "status": "QUALIFIED", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> Recursive syntax specifies which symbol strings are permitted expressions. This is separate from whether an expression is true. The lecture&#x27;s well-formed formula bases are T,F and propositional variables. From already well-formed E,F one may form (¬E),(E∧F),(E∨F),(E→F),(E↔F).\u003c/p>\n\u003cp>For parentheses, the supplied p. 50 uses basis () and rules w→()w, w→(w), w→w(). These rules preserve balanced parentheses, but their claim to describe every balanced string is incomplete; the qualification below is part of the lesson, not a silent change of the course definition.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> For membership under a specified grammar, exhibit a finite sequence of allowed constructions. For well-formed formulae, identify the outermost operator and its already valid argument(s). To establish a string is impossible, identify a property every constructor preserves or show that no final constructor could have produced it. Do not invent an extra rule because the string looks reasonable.\u003c/p>\n\u003cp>\u003cstrong>Worked examples — lecture constructions, explained.\u003c/strong> Starting with (), append () to obtain ()(), then wrap to obtain (()()). Every operation is allowed. A string beginning with ) such as ))(() cannot be generated, because the base and all three constructors preserve the property that no prefix has more closing than opening parentheses.\u003c/p>\n\u003cp>For formulae, start with variables p,q and the constant F. Form (p∨q) and (q∧F), then combine them as ((p∨q)→(q∧F)). This is well formed regardless of its truth value for particular p,q. The string pq∧ is not produced by the infix, parenthesised grammar.\u003c/p>\n\u003cp>\u003cstrong>Source limitation — completeness remains unresolved.\u003c/strong> The balanced string (())(()) cannot be produced by the displayed parenthesis rules: it does not begin with (), does not end with (), and cannot be one wrapping (w), because its first opening parenthesis closes before the last character. Those exhaust the possible final constructors. A more general grammar could add a suitable concatenation rule, but that rule is not supplied and is not being substituted as the official definition. Whether the empty string is intended as balanced is also unstated. The valid restricted constructions and formula grammar are taught; the blanket “all balanced strings” claim is not endorsed.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> Definition application and recursive construction are lecture-supported. There is no direct relevant tutorial resolving the parenthesis grammar.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Equating well formed with true; using an operator with missing operands; ignoring parentheses; confusing “every generated string is balanced” with “every balanced string is generated”.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> syntax≠truth; prove grammar membership by constructors; grammar soundness≠completeness; retain the p. 50 qualification until lecturer clarification.\u003c/p>\n\u003cp>Source: C5 pp. 50–51; original visual checked. Supported content taught; completeness/empty-string convention explicitly unresolved.\u003c/p>", "search": "\n\nWhat it means. Recursive syntax specifies which symbol strings are permitted expressions. This is separate from whether an expression is true. The lecture's well-formed formula bases are T,F and propositional variables. From already well-formed E,F one may form (¬E),(E∧F),(E∨F),(E→F),(E↔F).\n\nFor parentheses, the supplied p. 50 uses basis () and rules w→()w, w→(w), w→w(). These rules preserve balanced parentheses, but their claim to describe every balanced string is incomplete; the qualification below is part of the lesson, not a silent change of the course definition.\n\nHow to use it. For membership under a specified grammar, exhibit a finite sequence of allowed constructions. For well-formed formulae, identify the outermost operator and its already valid argument(s). To establish a string is impossible, identify a property every constructor preserves or show that no final constructor could have produced it. Do not invent an extra rule because the string looks reasonable.\n\nWorked examples — lecture constructions, explained. Starting with (), append () to obtain ()(), then wrap to obtain (()()). Every operation is allowed. A string beginning with ) such as ))(() cannot be generated, because the base and all three constructors preserve the property that no prefix has more closing than opening parentheses.\n\nFor formulae, start with variables p,q and the constant F. Form (p∨q) and (q∧F), then combine them as ((p∨q)→(q∧F)). This is well formed regardless of its truth value for particular p,q. The string pq∧ is not produced by the infix, parenthesised grammar.\n\nSource limitation — completeness remains unresolved. The balanced string (())(()) cannot be produced by the displayed parenthesis rules: it does not begin with (), does not end with (), and cannot be one wrapping (w), because its first opening parenthesis closes before the last character. Those exhaust the possible final constructors. A more general grammar could add a suitable concatenation rule, but that rule is not supplied and is not being substituted as the official definition. Whether the empty string is intended as balanced is also unstated. The valid restricted constructions and formula grammar are taught; the blanket “all balanced strings” claim is not endorsed.\n\nQuiz 2 style. Definition application and recursive construction are lecture-supported. There is no direct relevant tutorial resolving the parenthesis grammar.\n\nCommon traps. Equating well formed with true; using an operator with missing operands; ignoring parentheses; confusing “every generated string is balanced” with “every balanced string is generated”.\n\nCHEAT SHEET CANDIDATE: syntax≠truth; prove grammar membership by constructors; grammar soundness≠completeness; retain the p. 50 qualification until lecturer clarification.\n\nSource: C5 pp. 50–51; original visual checked. Supported content taught; completeness/empty-string convention explicitly unresolved.\n\n", "shortTitle": "Balanced parentheses and well-formed formulae", "part": "Part 10 — remaining Level 2 theory and applications"}, {"id": "R08", "title": "Recursively defined rooted/full binary trees; height and vertex count", "section": "Chapter 5, Section 5.3 — Recursion and structural induction", "chapter": "Chapter 5", "priority": "L2", "source": "C5 pp. 52–55,59; T05 P5", "ability": "Interpret constructors; calculate recursive height/size and distinguish the two tree classes. Definition, calculation, application", "prereq": "R01,R04; max; basic vertex/edge/root vocabulary supplied here", "confusion": "Rooted versus full binary; full versus perfect/complete (do not import additional tree theory); height versus size", "visual": "V pp. 52–55,59", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> A rooted tree has a distinguished root. The Chapter 5 recursive construction begins with a single vertex; a new root can be attached to the roots of disjoint rooted trees. A full binary tree uses exactly two subtrees whenever a new non-leaf root is formed; its basis is a single vertex. “Full” does not require equal subtree heights or that every level be filled.\u003c/p>\n\u003cp>For a single vertex, height h=0 and vertex count n=1. For T formed from full binary subtrees T_1,T_2,\u003c/p>\n\u003cp>h(T)=1+max(h(T_1),h(T_2)), while n(T)=1+n(T_1)+n(T_2).\u003c/p>\n\u003cp>Height measures the longest root-to-leaf path in edges. Size counts all vertices, including the root. These are different quantities and therefore use max versus addition.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Decompose at the root. Identify the two disjoint child subtrees. Compute each subtree&#x27;s height and size first, then combine with the recursions. For a proof, the same decomposition tells you which two hypotheses structural induction may use.\u003c/p>\n\u003cp>\u003cstrong>Worked examples — analogous, using the lecture constructors.\u003c/strong> A root with two single-vertex children has h=1+max(0,0)=1 and n=1+1+1=3. Attach a new root above that tree and a single leaf: h=1+max(1,0)=2 and n=1+3+1=5. This five-vertex tree is full even though its leaves have different depths. Joining two three-vertex trees under a root gives h=2 and n=7. Equal height therefore does not imply equal size. A root with three single-vertex children is a rooted tree with height 1 and size 4, but is not a full binary tree: its non-leaf root has three children, not two.\u003c/p>\n\u003cp>\u003cimg loading=\"lazy\" alt=\"Original Chapter 5 tree construction, physical page 55\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAzEAAAHMCAIAAABqZ7E5AABsjUlEQVR4nO3dB3wURcMG8J3du0suvSckpBJ6r1KkSJMuTZGOoEiRLggiIgoiikgHQQFBRBGQIkhTEBCQIr2Gnt7r9dud77e3uN+9oRgguU3C8/d9Ibe3ZW73dJ/MzM6Qci80YQAAAABAUayyhwcAAAAAZDIAAACAYgH1ZAAAAADKQyYDAAAAUB4yGQAAAIDykMkAAAAAlIdMBgAAAKA8ZDIAAAAA5SGTAQAAACgPmQwAAABAechkAAAAAMpDJgMAAABQHjIZAAAAgPKQyQAAAACUh0wGAAAAoDxkMgAAAADlIZMBAAAAKE/FFA+Vosu1btY0Jzd3+559WTk5DMPUqlpl+KABqenp81d8k5aR+dCtPNzdRg0ZHB4S8t3Pm/46cfKh+4HHyHeSCSF9e3Rr9WKTQ8f/Xv3jxkI8dV4eHl3bt3N10f5++MjVGzdxUQAAAAohk7V8scns9ydrtc7yEioIOoMhNy/v1t17ew7+uefAnwajseA7JIS0e6nFW/366A2GW/fuHflbTFcVykU1qV8vKyfnp207HpXJPN09XmrcqExgwIWrV/86cfKh+ylqHMd+9O74Li+3PX/5ypgPpmdkZeX7aBNHDOvbvetfJ0+9O2Om3mB49sO9P3pUpzatH7XC3bi4CR99EpuQUJC95TvJKo5rVLdOw7p1GIZ5fCZjWXbqmFGvdulkv9Bqtebp9JnZ2RevXN2y67d/LlyklMoHGj6wv5uri6uLy9Uby5jiKqRM0KzJk8JCQv5zTUEQNu/ctXzt9/JnBAAAcHQm8/HydHXRCpSePHsuJS2NYRhXFxcfL6+I0LLNGzVs1vCFts2bTf3s88ys7ILv02Ay2e5zlOf5gm9FGZrvjvh0+3kWapU60M9fo1YH+PmKOfV/IpmYycoEBqjVan9fX62z87NnMrVKHRoc7OHuxvO80WQihHCs+A9hCMexhBB3NzeO45giRggT4OenVqmycnKOnTptMptZwnq4u/n7+kaFh1WIiuzQuuWS1d+t2vCTIAgMw5gtFumKWHkrU4y5urhEhJYN9Pf/zzUFQfD39XVIoQAA4Lnw9G2XFovl+01bDvx1VF7iotUOG9hv4GuvvvhCg85tWq/9eXMBd0UpXbtx06Fjx80Wy+17sU9dpMLaT4kQn5Q0eNy78YlJ9gsJIdJ5cFgxUlLTZi9ckpqeLi+JCC370bvjG9Su1a9Ht2OnTl+6dp1hmPOXr/QZMcrVRXv73j2mGLt+81a73v3VahXPC4IgWKyWqhUrLv1slo+X17Y9ez+cM5chRMVxYhTmWJ3egEoyAAAojv3J9AbDup83N6lfv3L56BpVqrDsL1IdSUEYjMYrMTeevQyFtZ8SqjhEhDuxcat/3FitUkUfb+/IsDApkwmCcCe2ZKRko8lktNW25jullFJbThMsFotypQMAgFKrkJ+7JITlWHGfBuOzNtI9hkajdndzfZJSibVHE
