"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Let f(0)=2 and f(n+1)=3f(n)−1 for n≥0. Compute f(1),f(2),f(3) and explain why this definition determines every value uniquely.", "answer": "f(1)=5,f(2)=14,f(3)=41. Starting at the given base, each next value is obtained from one already determined value by a specified arithmetic operation. Repeatedly decreasing the index reaches 0, so there is no missing dependency.", "rubric": ["Compute 5,14,41", "Identify base", "Explain backward dependency termination"], "trap": "Do not use an unproved closed formula or a general recurrence solver.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 37–39; T05 P1"]}, {"id": "Q076", "concepts": ["R01"], "skill": "conceptual", "type": "Counterexample", "difficulty": "Standard", "prompt": "Can f:nonnegative integers→integers satisfy f(0)=0 and f(n)=f(n)+1 for every n≥1? Contrast this with a recursion missing only its base.", "answer": "No: at n=1 it would require an integer equal to itself plus 1, a contradiction. This is inconsistent, not merely incomplete. A rule g(n+1)=g(n)+1 without g(0) has many solutions (different initial values), so it is underdetermined rather than contradictory.", "rubric": ["Identify explicit contradiction", "Distinguish inconsistency", "Explain missing-base nonuniqueness"], "trap": "Circularity, inconsistency and nonuniqueness are related but not identical defects.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 37–39; T05 P1"]}, {"id": "Q077", "concepts": ["R02"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "With f₀=0,f₁=1,fₙ₊₂=fₙ₊₁+fₙ, prove Σ(i=1 to n) fᵢ=fₙ₊₂−1 for n≥1.", "answer": "For n=1,f₁=1=f₃−1. Assume the identity at k. Adding fₖ₊₁ gives fₖ₊₂−1+fₖ₊₁=fₖ₊₃−1 by the recurrence, exactly the next case.", "rubric": ["State/check initial values", "Inductive sum", "Add next term", "Apply recurrence with correct indices"], "trap": "Do not confuse fₖ₊₂ with fₖ+2.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 40–41; T05 P2(a–b)"]}, {"id": "Q078", "concepts": ["R02"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "For f₀=0,f₁=1,fₙ₊₂=fₙ₊₁+fₙ, prove Σ(i=1 to n) fᵢ²=fₙfₙ₊₁ for n≥1.", "answer": "At n=1 both sides are 1. Assuming the formula at k, add fₖ₊₁²: fₖfₖ₊₁+fₖ₊₁²=fₖ₊₁(fₖ+fₖ₊₁)=fₖ₊₁fₖ₊₂. This is the required formula at k+1.", "rubric": ["Base", "Use square-sum hypothesis", "Factor shared term", "Apply recurrence"], "trap": "fᵢ² means (fᵢ)², not f indexed by i².", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 40–41; T05 P2(a–b)"]}, {"id": "Q079", "concepts": ["R03"], "skill": "calculation", "type": "Theorem application", "difficulty": "Standard", "prompt": "For positive a≥b=9876, what division-count bound does Lamé’s theorem give? Does it assert the algorithm actually takes that many divisions?", "answer": "b has four decimal digits, so D≤5·4=20 divisions, counting the final exact division. This is an upper bound; the actual count depends on a,b and may be far smaller. Use digits of the smaller input, not the larger one.", "rubric": ["Four digits", "Bound 20", "Upper bound and counting convention"], "trap": "A complexity upper bound is not an exact running time.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L3", "sources": ["C5 pp. 41–44; —"]}, {"id": "Q080", "concepts": ["R03"], "skill": "proof", "type": "Proof completion", "difficulty": "Challenge", "prompt": "Let α=(1+√5)/2, α²=α+1. Prove fₙ>α^(n−2) for n≥3 from the Fibonacci recurrence.", "answer": "Check f₃=2>α and f₄=3>α². For k≥4 assume both earlier bounds (or the strong hypothesis). Then fₖ₊₁=fₖ+fₖ₋₁>α^(k−2)+α^(k−3)=α^(k−3)(α+1)=α^(k−1). That is the desired next exponent.", "rubric": ["Two correct bases", "Valid smaller indices", "Factor powers", "Use α²=α+1"], "trap": "One base does not justify a step using two prior terms.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L3", "sources": ["C5 pp. 41–44; —"]}, {"id": "Q081", "concepts": ["R04"], "skill": "calculation", "type": "Construction", "difficulty": "Standard", "prompt": "Let S be the smallest set of ordered pairs containing (0,0) and closed under (a,b)↦(a+1,b+2). List the first four generation layers, counting the basis as layer 0.", "answer": "Layer 0:{(0,0)}; layer 1:{(1,2)}; layer 2:{(2,4)}; layer 3:{(3,6)}. Each layer applies the rule once to the preceding new layer. The word smallest excludes extra pairs not generated in finitely many applications.", "rubric": ["Correct layer convention", "Four layers", "Explain smallest-set restriction"], "trap": "An explicitly stated generation convention avoids ambiguity about counting rule applications.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 45–46; T05 P3(a),4"]}, {"id": "Q082", "concepts": ["R04"], "skill": "conceptual", "type": "Construction", "difficulty": "Standard", "prompt": "Give a recursive definition generating exactly the positive odd integers. Include an exclusion clause and justify that every target is reached.", "answer": "Basis:1 is in S. Rule:if x∈S,then x+2∈S. Exclusion:only elements obtained by finitely many such applications belong to S. Every generated value is 1+2k with k≥0, hence positive odd. Conversely any positive odd integer 2k+1 is reached after k applications.", "rubric": ["Basis and rule", "Exclusion clause", "Soundness", "All positive odds reachable"], "trap": "Closure alone would also allow a larger set containing unwanted elements.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 45–46; T05 P3(a),4"]}, {"id": "Q083", "concepts": ["R05"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Let S have basis (0,0) and constructors (a,b)↦(a+1,b+2), (a,b)↦(a+2,b+4), with only finitely generated pairs included. Use structural induction to prove b=2a for every pair in S.", "answer": "The basis satisfies 0=2·0. Assume b=2a for an input pair. The first constructor gives b+2=2(a+1); the second gives b+4=2(a+2). Both preserve the property, so every finitely generated pair satisfies it by structural induction.", "rubric": ["Basis", "First constructor", "Second constructor", "Structural conclusion"], "trap": "Every constructor must be checked, even if one looks redundant.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 56–58; T05 P3(b–c),4"]}, {"id": "Q084", "concepts": ["R05"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "Let S have basis (0,0), rules (a,b)↦(a+1,b+2) and (a,b)↦(a+2,b+4), and contain only finitely generated pairs. prove S={(n,2n):n≥0}. Explain why the invariant alone is insufficient.", "answer": "Structural induction gives S⊆T, where T is the stated target. For the reverse inclusion, start at (0,0) and apply the +1,+2 constructor n times to reach (n,2n), for each n≥0. Thus T⊆S. The invariant restricts generated elements but does not by itself show that every permitted pair can be generated.", "rubric": ["First inclusion", "Explicit construction for arbitrary n", "Reverse inclusion", "Equality and invariant distinction"], "trap": "Soundness and completeness are separate directions.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 56–58; T05 P3(b–c),4"]}, {"id": "Q085", "concepts": ["R06"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Let λ be the empty string and let u=ab,v=baa over {a,b}. Find uv,vu,λu and their lengths. Explain whether concatenation commutes.", "answer": "uv=abbaa and vu=baaab, each of length 5. λu=ab has length 2. The empty string has length 0 and is the concatenation identity. Here uv≠vu, so concatenation is not commutative in general.", "rubric": ["Correct strings", "Correct lengths", "Empty-string identity", "Noncommutativity example"], "trap": "λ is a string of length zero, not the empty set.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 47–49; —"]}, {"id": "Q086", "concepts": ["R06"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Using length(λ)=0 and length(wa)=length(w)+1 for a symbol a, prove length(uv)=length(u)+length(v) by induction on construction of v.", "answer": "Base v=λ: uλ=u and the formula holds. If it holds for v=w, then for v=wa, length(u(wa))=length((uw)a)=length(uw)+1=length(u)+length(w)+1=length(u)+length(wa). This checks the append-symbol constructor.", "rubric": ["Empty-string basis", "Constructor hypothesis", "Associative regrouping", "Length recursion"], "trap": "Appending a symbol is one step; appending a whole string needs the argument.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 47–49; —"]}, {"id": "Q087", "concepts": ["R07"], "skill": "conceptual", "type": "Construction", "difficulty": "Standard", "prompt": "Use ONLY this explicit grammar: basis (); from w you may form ()w, (w), or w(). Give a derivation of (()()). Do not make a claim about all balanced strings or the empty string.", "answer": "Start with (). Apply w↦w() to obtain ()(). Apply w↦(w) to obtain (()()). Every step is one of the stated constructors. This establishes membership under this restricted grammar only; its universal balanced-string completeness and the source’s empty-string convention remain unresolved.", "rubric": ["Start from basis", "Legal first step", "Legal wrapping step", "Keep claim restricted"], "trap": "Do not silently add a rule allowing concatenation of arbitrary generated strings.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 50–51; —"]}, {"id": "Q088", "concepts": ["R07"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "Suppose propositional letters are well-formed; from formula A one may form (¬A), and from A,B one may form (A∧B). Show ((¬p)∧q) is well-formed. Does that establish its truth?", "answer": "p and q are basis formulae. Apply negation to p to form (¬p), then apply the binary constructor to (¬p) and q. Thus ((¬p)∧q) is syntactically well-formed. Truth depends on the values of p,q: it is true precisely when p is false and q is true. This explicit syntax does not rely on the disputed parenthesis completeness claim.", "rubric": ["Basis formulae", "Correct constructor sequence", "Separate syntax from truth"], "trap": "Well-formedness is about grammar, not validity under every assignment.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 50–51; —"]}, {"id": "Q089", "concepts": ["R08"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "A full binary tree has a root whose left subtree is a single vertex and whose right subtree is a root with two leaves. Using h(singleton)=0 and v(singleton)=1, compute height and vertices.", "answer": "The right subtree has h=1 and v=3; the left has h=0 and v=1. Hence the whole tree has h=1+max(0,1)=2 and v=1+1+3=5. Each internal vertex has exactly two children.", "rubric": ["Compute subtrees", "Use max for height", "Sum vertices plus root", "Full-binary condition"], "trap": "Height counts edges on a longest root-to-leaf path, not total vertices.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 52–55,59; T05 P5"]}, {"id": "Q090", "concepts": ["R08"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "A rooted tree has one root with three leaf children. Is it a full binary tree? Explain using the constructors rather than importing later tree theory.", "answer": "It is a rooted tree, but not full binary: the full-binary constructor joins exactly two full-binary subtrees to a new root (or gives a singleton). A root with three children is not produced by that constructor. It has height 1 and four vertices.", "rubric": ["Recognise rooted tree", "Reject full-binary status", "Use exactly-two constructor", "Height and vertex count"], "trap": "Full binary does not mean simply that all leaves have the same depth.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 52–55,59; T05 P5"]}, {"id": "Q091", "concepts": ["R09"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "Prove v(T)≤2^(h(T)+1)−1 for every full binary tree by structural induction.", "answer": "For a singleton v=1,h=0, so equality holds. Let the two subtrees have heights h₁,h₂ and sizes v₁,v₂ satisfying the hypothesis. With h=1+max(h₁,h₂), each hᵢ≤h−1. Thus v=1+v₁+v₂≤1+(2^(h₁+1)−1)+(2^(h₂+1)−1)≤1+2(2ʰ−1)=2^(h+1)−1.", "rubric": ["Singleton base", "Both subtree hypotheses", "Relate heights to maximum", "Algebraic bound"], "trap": "Subtree heights need not be equal.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 58–60; T05 P5"]}, {"id": "Q092", "concepts": ["R09"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "Prove v(T)≥2h(T)+1 for every full binary tree by structural induction.", "answer": "The singleton gives 1≥1. For a composite tree choose a subtree of maximum height h−1. By induction it has at least 2(h−1)+1 vertices. The other subtree has at least one vertex. Adding the root gives v≥[2(h−1)+1]+1+1=2h+1. The choice of maximum subtree is valid even when the heights tie.", "rubric": ["Singleton base", "Choose maximum-height subtree", "Use other subtree nonempty", "Add root and simplify"], "trap": "The lower bound is not the same as the lecture’s exponential upper bound.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 58–60; T05 P5"]}, {"id": "Q093", "concepts": ["R10"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "In strict lexicographic order on nonnegative integer pairs, compare (1,100) and (2,0). Explain why every nonempty subset has a least pair.", "answer": "(1,100)\u003c(2,0) because the first coordinate is smaller. For a nonempty set, choose the least first coordinate that appears, then the least second coordinate among pairs having that first coordinate. The resulting pair is in the set and precedes every other pair.", "rubric": ["Correct comparison", "Least first coordinate", "Least second within that fibre", "Explain leastness"], "trap": "Lexicographic order does not compare coordinate sums or demand both coordinates decrease.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L3", "sources": ["C5 pp. 61–62; —"]}, {"id": "Q094", "concepts": ["R10"], "skill": "proof", "type": "Proof completion", "difficulty": "Challenge", "prompt": "Define a(0,0)=0, a(m,0)=a(m−1,0)+1 for m>0, and a(m,n)=a(m,n−1)+n for n>0. Prove a(m,n)=m+n(n+1)/2 using earlier pairs in strict lexicographic order.", "answer": "The formula is true at (0,0). Assume it at every earlier pair. If n=0,m>0, the earlier pair (m−1,0) gives a(m,0)=m−1+1=m. If n>0, (m,n−1) is earlier and gives a(m,n)=m+(n−1)n/2+n=m+n(n+1)/2. Both dependencies remain nonnegative and are strictly earlier.", "rubric": ["Base", "n=0 branch", "n>0 branch", "Validate dependency order"], "trap": "Never assume the current pair through a non-strict induction hypothesis.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L3", "sources": ["C5 pp. 61–62; —"]}, {"id": "Q095", "concepts": ["N07", "N06", "N03"], "skill": "calculation", "type": "Multi-step", "difficulty": "Challenge", "prompt": "Find digits a,b with a nonzero such that (a3b)₅=(b3a)₈. Show uniqueness among admissible digits.", "answer": "The expansions give 25a+15+b=64b+24+a, hence 24a−63b=9 or 8a−21b=3. Modulo 8, −5b≡3, giving b≡1 (mod 8). As a,b are base-5 digits, 0≤b≤4, so b=1. Then a=3. Both are valid and nonzero-leading. Check (331)₅=75+15+1=91 and (133)₈=64+24+3=91. The bounded congruence gives uniqueness.", "rubric": ["Correct expansions", "Derive bounded digit equation", "Unique admissible solution", "Verify both numerals"], "trap": "Digits must satisfy both bases; unrestricted integer solutions are not enough.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 24–28; T03 P12(a–c),13", "C4 pp. 22–26; T03 P12–13", "C4 pp. 11–13; T03 P9–11; T04 P4"]}, {"id": "Q096", "concepts": ["N16", "N15", "N17"], "skill": "proof", "type": "Multi-step", "difficulty": "Challenge", "prompt": "Use Euclid and Bézout for 35 and 22, then prove that 35 divides 22z implies 35 divides z for every integer z.", "answer": "35=22+13;22=13+9;13=9+4;9=2·4+1. Back-substitution gives 1=8·22−5·35. Multiplying by z gives z=8(22z)−5(35z). If 35 divides 22z it divides both terms on the right, hence divides z.", "rubric": ["Valid Euclidean chain", "Correct identity", "Multiply by z", "Divisibility implication"], "trap": "Coprime cancellation needs a reason; here the identity provides it.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 50–51; T04 P5,17", "C4 pp. 47–49; T04 P4–5,17", "C4 pp. 52,54; T04 P6–7"]}, {"id": "Q097", "concepts": ["N21", "N19", "N20"], "skill": "calculation", "type": "Multi-step", "difficulty": "Challenge", "prompt": "Solve 3x≡2 (mod 5), 2x≡3 (mod 7), giving the least nonnegative representative and all integer solutions.", "answer": "The inverses are 3⁻¹≡2 (mod 5) and 2⁻¹≡4 (mod 7). Thus x≡4 (mod 5) and x≡5 (mod 7). Write x=5t+4; then 5t≡1 (mod 7), so t≡3. Hence x≡19 (mod 35), or x=19+35k. Check 3·19≡2 (mod 5) and 2·19≡3 (mod 7).", "rubric": ["Solve each linear congruence", "Use coprime moduli", "Combine to 19 modulo 35", "Check original conditions"], "trap": "Combine the solved residue constraints, not the original right-hand sides.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 62–65; T04 P7–8", "C4 pp. 57–60; T04 P5–6", "C4 pp. 57,61; T04 P5(a–c)"]}, {"id": "Q098", "concepts": ["I04", "N03", "I01"], "skill": "proof", "type": "Multi-step", "difficulty": "Challenge", "prompt": "Prove by induction that 5 divides 6ⁿ−1 for n≥0. Then explain why this does not imply 25 divides 6ⁿ−1 for every n≥0.", "answer": "Base n=0 gives 0. If 6ᵏ−1=5t, then 6^(k+1)−1=6(6ᵏ−1)+5=5(6t+1), proving the first assertion. The stronger modulus claim fails at n=1:6−1=5 is not divisible by 25. Congruence modulo a divisor does not automatically lift to a multiple.", "rubric": ["Base and hypothesis", "Valid step", "Counterexample n=1", "Explain modulus direction"], "trap": "A proof for modulus 5 does not automatically prove modulus 25.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 p. 14; T04 P9(a–c),10", "C4 pp. 11–13; T03 P9–11; T04 P4", "C5 pp. 5–9,22–23; T04 P9–13,16"]}, {"id": "Q099", "concepts": ["R05", "R04", "N01"], "skill": "proof", "type": "Multi-step", "difficulty": "Challenge", "prompt": "Let S contain 3 and be closed under x↦x+6, with no other elements. Prove S={6k+3:k≥0}, and deduce that every member is odd and divisible by 3.", "answer": "Basis 3=6·0+3. The constructor sends 6k+3 to 6(k+1)+3, so structural induction gives S contained in the target. Conversely k applications from 3 produce 6k+3, so equality holds. Each value is 2(3k+1)+1, hence odd, and 3(2k+1), hence divisible by 3.", "rubric": ["Structural soundness", "Reach every target", "Two inclusions give equality", "Deduce both properties"], "trap": "Proving only the odd/divisible-by-3 invariant would not on its own establish equality.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 56–58; T05 P3(b–c),4", "C5 pp. 45–46; T05 P3(a),4", "C4 pp. 6–8; T03 P7; T04 P7,17 use these facts"]}, {"id": "Q100", "concepts": ["R02", "N15", "N14", "I01"], "skill": "proof", "type": "Multi-step", "difficulty": "Challenge", "prompt": "For f₀=0,f₁=1 and Fibonacci recursion, prove consecutive terms fₙ,fₙ₊₁ are coprime for all n≥0 using induction and the Euclidean invariant.", "answer": "Base gcd(f₀,f₁)=gcd(0,1)=1. For k≥0, gcd(fₖ₊₁,fₖ₊₂)=gcd(fₖ₊₁,fₖ+fₖ₊₁)=gcd(fₖ₊₁,fₖ)=1 by the Euclidean invariant and hypothesis. Thus all consecutive pairs are coprime. This uses the recurrence directly, not a closed-form recurrence solution.", "rubric": ["Base with zero", "Substitute recurrence", "Apply gcd invariant", "Inductive conclusion"], "trap": "Adjacent Fibonacci terms being individually prime is unnecessary and generally false.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 40–41; T05 P2(a–b)", "C4 pp. 47–49; T04 P4–5,17", "C4 pp. 43–46; T04 P3–4,7", "C5 pp. 5–9,22–23; T04 P9–13,16"]}], "cheats": [{"id": "CS-N01", "concept": "N01", "category": "definitions", "text": "a∣b ⇔ b=ak for k∈Z; a∣b,a∣c ⇒ a∣(mb+nc); a∣b,b∣c ⇒ a∣c."}, {"id": "CS-N02", "concept": "N02", "category": "algorithms", "text": "a=dq+r, 0≤r\u003cd, d>0; q=floor(a/d), r=a−dq. For a=dq+r with r>0, −a=d(−q−1)+(d−r)."}, {"id": "CS-N03", "concept": "N03", "category": "definitions", "text": "a≡b (mod m) ⇔ m∣a−b ⇔ a=b+km ⇔ equal remainders. If n∣m, congruence mod m implies congruence mod n."}, {"id": "CS-N04", "concept": "N04", "category": "common traps", "text": "reduce sums/products at any stage; use the same modulus; cancellation needs gcd(factor,modulus)=1. Exponent reduction needs a separate justified theorem."}, {"id": "CS-N05", "concept": "N05", "category": "definitions", "text": "+_m and ·_m mean perform operation then mod; additive inverse is −a mod m; multiplicative inverse requires a·x≡1 (mod m)."}, {"id": "CS-N06", "concept": "N06", "category": "formulas", "text": "(a_k...a_0)_b=Σa_jb^j; 0≤a_j\u003cb; rightmost digit = number mod b."}, {"id": "CS-N07", "concept": "N07", "category": "algorithms", "text": "to decimal, weighted sum; from decimal, repeated division and reverse remainders; verify by expansion."}, {"id": "CS-N08", "concept": "N08", "category": "algorithms", "text": "octal↔3 bits; hexadecimal↔4 bits; group from right; pad left only; retain full internal blocks."}, {"id": "CS-N09", "concept": "N09", "category": "definitions", "text": "prime means p>1 with exactly two positive divisors; disproof of “always prime” needs one legal input and a proper factorisation."}, {"id": "CS-N14", "concept": "N14", "category": "formulas", "text": "gcd=min exponents; lcm=max exponents; ab=gcd·lcm for a,b>0; pairwise means every pair."}, {"id": "CS-N15", "concept": "N15", "category": "algorithms", "text": "a=bq+r ⇒ gcd(a,b)=gcd(b,r); repeat until r=0; retain the division equations."}, {"id": "CS-N16", "concept": "N16", "category": "algorithms", "text": "gcd(a,b)=sa+tb, s,t∈Z. Euclid forward, substitute backwards, verify equality. gcd=1 ⇒ coefficient of a is an inverse of a mod b."}, {"id": "CS-N17", "concept": "N17", "category": "theorem conditions", "text": "gcd(c,m)=1 and ac≡bc (mod m) ⇒ a≡b (mod m); p prime and p∣∏a_i ⇒ p∣a_i for some i."}, {"id": "CS-N19", "concept": "N19", "category": "algorithms", "text": "1=sa+tm ⇒ a^(−1)≡s (mod m); exists iff gcd(a,m)=1 for m>1; inverse is unique modulo m."}, {"id": "CS-N20", "concept": "N20", "category": "algorithms", "text": "gcd(a,m)=1 ⇒ ax≡b has x≡a^(−1)b (mod m); give the class and verify it in the original congruence."}, {"id": "CS-N21", "concept": "N21", "category": "algorithms", "text": "pairwise gcd=1; M=∏m_i; M_i=M/m_i; y_i=M_i^(−1) mod m_i; x≡Σa_iM_i y_i (mod M). Uniqueness: each m_i∣x−y ⇒ M∣x−y."}, {"id": "CS-N22", "concept": "N22", "category": "algorithms", "text": "x≡a (mod m) ⇔ x=a+mt, t∈Z; substitute one condition at a time and preserve the arbitrary integer parameter."}, {"id": "CS-I01", "concept": "I01", "category": "proof templates", "text": "state P(n)/domain → basis P(b) → assume P(k), k≥b → derive P(k+1) → conclude by induction."}, {"id": "CS-I02", "concept": "I02", "category": "proof templates", "text": "isolate the new summand; hold parameters fixed; factor shared products before expanding."}, {"id": "CS-I03", "concept": "I03", "category": "proof templates", "text": "check small n; choose a range where the step works; justify every inequality with hypothesis or domain; list exceptional cases separately."}, {"id": "CS-I04", "concept": "I04", "category": "proof templates", "text": "expose the old expression; for a growing divisor, show where the new factor comes from; A²−1=(A−1)(A+1)."}, {"id": "CS-I07", "concept": "I07", "category": "common traps", "text": "audit base, first transition, domain of every hypothesis application and hidden assumptions such as overlap or nonzero factors."}, {"id": "CS-I08", "concept": "I08", "category": "proof templates", "text": "assume all b≤j≤k; prove k+1 using genuinely earlier indices; establish every initial case needed before that transition works."}, {"id": "CS-I10", "concept": "I10", "category": "proof templates", "text": "define S → show S nonempty → choose least c → assume failure → construct smaller member of S → contradiction."}, {"id": "CS-I11", "concept": "I11", "category": "proof templates", "text": "ordinary = previous case; strong = all earlier cases; well-ordering = least candidate/counterexample. Equivalent principles, different convenient proof organisations."}, {"id": "CS-N18", "concept": "N18", "category": "proof templates", "text": "existence: strong induction and prime/composite split. Uniqueness: prime divides product ⇒ matching prime; cancel and repeat."}, {"id": "CS-R01", "concept": "R01", "category": "definitions", "text": "basis + rule + domain; every dependency must be available; test the earliest inputs when diagnosing a bad definition."}, {"id": "CS-R02", "concept": "R02", "category": "formulas", "text": "f_0=0,f_1=1; f_(n+2)=f_(n+1)+f_n; append next term, factor, then use adjacent-term recurrence."}, {"id": "CS-R04", "concept": "R04", "category": "definitions", "text": "seeds + constructors + exclusion; correctness = soundness and completeness; distinguish exact generation depth from cumulative membership."}, {"id": "CS-R05", "concept": "R05", "category": "proof templates", "text": "all bases + every constructor; hypotheses on constituent objects; for equality, add the converse generation argument."}, {"id": "CS-R08", "concept": "R08", "category": "formulas", "text": "leaf: (h,n)=(0,1); join: h=1+max(h_1,h_2), n=1+n_1+n_2."}, {"id": "CS-R09", "concept": "R09", "category": "proof templates", "text": "2h+1≤n≤2^(h+1)−1 for full binary trees; set H=max(h_1,h_2) and use both subtree hypotheses."}, {"id": "CS-N10", "concept": "N10", "category": "algorithms", "text": "composite n has a prime factor ≤√n; trial-divide by those primes; sieve retains p and removes its larger multiples."}, {"id": "CS-N11", "concept": "N11", "category": "proof templates", "text": "finite-prime-list contradiction: product+1 → prime divisor → none of listed primes divides it → contradiction."}, {"id": "CS-N12", "concept": "N12", "category": "formulas", "text": "if q=2^p−1 is prime, N=2^(p−1)q is perfect; divisor sum=(1+q)(2^p−1)=2N."}, {"id": "CS-N23", "concept": "N23", "category": "theorem conditions", "text": "p prime, p∤a ⇒ a^(p−1)≡1; all a ⇒ a^p≡a; exponent reduction requires the first version's hypotheses."}, {"id": "CS-N25", "concept": "N25", "category": "theorem conditions", "text": "r primitive mod prime p ⇔ its powers cover all p−1 nonzero residues; calculate a modular power cycle and check coverage."}, {"id": "CS-N26", "concept": "N26", "category": "definitions", "text": "r^e≡a (mod p), p prime, r primitive, 1≤a≤p−1, **1≤e≤p−1**; read e from the modular power table."}, {"id": "CS-I05", "concept": "I05", "category": "proof templates", "text": "split off one element/set; for complements, outside a union = outside every member; prove the n→n+1 transition explicitly."}, {"id": "CS-I06", "concept": "I06", "category": "proof templates", "text": "four quadrants → one real hole + three central reserved squares → central triomino → apply the hypothesis to each quadrant."}, {"id": "CS-I09", "concept": "I09", "category": "proof templates", "text": "constructions need validity checks; splitting proof: first contribution + two smaller totals; amount proof: necessary restrictions + sufficient bases + backward step."}, {"id": "CS-R06", "concept": "R06", "category": "definitions", "text": "λ basis; append one symbol; l(λ)=0,l(wx)=l(w)+1; wλ=w; split a nonempty string into prefix and last symbol."}, {"id": "CS-R07", "concept": "R07", "category": "common traps", "text": "syntax≠truth; prove grammar membership by constructors; grammar soundness≠completeness; retain the p. 50 qualification until lecturer clarification."}, {"id": "CS-N13", "concept": "N13", "category": "common traps", "text": "π(x)∼x/ln x means the ratio tends to 1; prime density heuristic ≈1/ln x; conjecture≠theorem; keep quantifiers."}, {"id": "CS-N24", "concept": "N24", "category": "common traps", "text": "composite + passes Fermat congruence = pseudoprime to that base. For n>2, base-2 failure ⇒ composite; passage does not ⇒ prime."}, {"id": "CS-R03", "concept": "R03", "category": "formulas", "text": "α²=α+1; f_n>α^(n−2), n≥3; b≥f_(D+1); D≤5·digits(b); handle D≤2/a=b directly."}, {"id": "CS-R10", "concept": "R10", "category": "proof templates", "text": "compare first coordinate, then second; hypothesis covers strictly earlier pairs; verify each recursive branch points backwards and stays in N×N."}], "prerequisites": "\u003ch3>Part 1 — prerequisites needed for the scoped material\u003c/h3>\n\u003cp>An integer is an element of Z: ...,−2,−1,0,1,2,... . Here N uses the course convention {0,1,2,...}; positive integers start at 1. A theorem&#x27;s domain is part of the theorem: a claim for positive integers need not include 0 or negative integers.\u003c/p>\n\u003cp>\u003cstrong>Quantifiers and proof language.\u003c/strong> “For every n” asks for a general argument. Ten successful numerical checks do not establish it. A single permitted counterexample disproves a universal claim. “There exists k” can be proved by exhibiting a suitable k. “If P then Q” allows you to assume P and derive Q; it does not allow you to assume Q. An “if and only if” claim requires both directions. A contradiction proof assumes the negation of the target and derives an impossibility. When using a theorem, identify its hypotheses before taking its conclusion.\u003c/p>\n\u003cp>\u003cstrong>Algebra and notation.\u003c/strong> a^(u+v)=a^u a^v and (a^u)^v=a^(uv); a^(u+v) is generally not a^u+a^v. Distinguish 3^(2^n), 3^(2n), and (3^2)^n. The factorial n!=1·2·...·n for n≥1 and 0!=1, so (n+1)!=(n+1)n!. A sum Σ_(j=0)^n a_j contains n+1 terms, and its next version adds a_(n+1). A finite geometric sum obeys Σ_(j=0)^n r^j=(1−r^(n+1))/(1−r) for r≠1: subtract r times the sum from the sum to see all intermediate terms cancel. We use this only as algebra needed for the mapped examples.\u003c/p>\n\u003cp>\u003cstrong>Sets and functions.\u003c/strong> x∈A means membership; A⊆B means every member of A is in B. Prove A=B by proving both inclusions. A∪B means “in at least one”; A∩B means “in both”; the complement of A is relative to a declared universal set. An ordered pair (a,b) keeps the order of its coordinates. A function must assign exactly one value to every input in its declared domain. A recursive rule is not automatically a well-defined function.\u003c/p>\n\u003cp>\u003cstrong>Proof example, analogous.\u003c/strong> To prove that the sum of two even integers is even, write a=2s and b=2t for integers s,t. Then a+b=2(s+t), and s+t is an integer. The last phrase matters: it explicitly supplies the integer witness demanded by the definition. This definition→witness→algebra→conclusion pattern underlies divisibility proofs.\u003c/p>\n\u003cp>\u003cstrong>Reading formulae.\u003c/strong> f_n^2 means (f_n)^2; f_(n^2) is a different indexed term. A bar over a union complements the entire union. In modular notation, the modulus is not a factor to multiply by. Every formula below was checked against the originals where the map flagged extraction risk.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> domains; iff requires two directions; set equality requires two inclusions; Σ through n+1 = Σ through n + next term; (n+1)!=(n+1)n!; conditions belong with every theorem.\u003c/p>", "introduction": "\u003ch2>CS1231 Quiz 2 — complete teaching package\u003c/h2>\n\u003cp>Prepared 4 October 2026. Scope: Chapter 4 §§4.1–4.4 and Chapter 5 §§5.1–5.3, as approved in exam-map.md \u003cspan class=\"source-ref\">(exam-map.md)\u003c/span>. Section 4.5 is excluded. The only tutorial portions used are T03 P7–13, T04 P1–17 and T05 P1–5. Chapter 8 recurrence-solving and the broader Chapter 11 tree syllabus are not imported.\u003c/p>\n\u003cp>This is a complete teaching pass, not a test or evidence of mastery. “TAUGHT” in the coverage ledger \u003cspan class=\"source-ref\">(teaching-coverage.md)\u003c/span> means an explanation, method, worked application and limitations are supplied here. It does not mean you have read, understood or independently solved them. No performance has been inferred.\u003c/p>\n\u003cp>\u003cstrong>How to read:\u003c/strong> follow the numbered parts in order. Concept IDs match the approved map even when their teaching order differs. L1/L2/L3 are study priorities, not difficulty or predicted marks. Each concept includes meaning, use, worked examples, supported question style, traps and \u003cstrong>CHEAT SHEET CANDIDATE\u003c/strong> material. These tags are candidates only; this is not the final A4 cheat sheet.\u003c/p>\n\u003cp>\u003cstrong>Sources and attribution:\u003c/strong> C4/C5 refer to Chapter4.pdf \u003cspan class=\"source-ref\">(../Sources/Chapter4.pdf)\u003c/span> and Chapter5.pdf \u003cspan class=\"source-ref\">(../Sources/Chapter5.pdf)\u003c/span>; all page numbers are physical PDF pages. T03/T04/T05 refer to the corresponding Tutorial 03 \u003cspan class=\"source-ref\">(../Sources/tutorial03.pdf)\u003c/span>, Tutorial 04 \u003cspan class=\"source-ref\">(../Sources/tutorial04.pdf)\u003c/span>, Tutorial 05 \u003cspan class=\"source-ref\">(../Sources/tutorial05.pdf)\u003c/span>. “Lecture example, explained” uses a supplied worked example. “Derived tutorial solution” is my independently developed solution to a supplied problem, not an official answer key. “Analogous example” is an original teaching illustration, not a lecturer question. All proof expansions are explanatory derivations unless stated otherwise.\u003c/p>\n\u003cp>The question-style profile \u003cspan class=\"source-ref\">(professor-style-profile.md)\u003c/span> supports proof, computation, construction and justification. It does not establish exact marks, frequency, question count or response-format mix. “Common traps” below are mathematical pitfalls, not diagnoses of your work or claims about the lecturer&#x27;s marking rubric.\u003c/p>", "appendix": "\u003ch3>Source qualifications, visual completion and boundaries\u003c/h3>\n\u003cp>All 47 groups have been addressed. \u003cstrong>46 are marked TAUGHT; R07 is marked UNRESOLVED — SUPPORTED PARTS TAUGHT\u003c/strong> because the supplied balanced-parenthesis grammar does not support its complete-characterisation claim. Its valid constructions, nonmembership reasoning and well-formed formulae have been taught in full above. This status records a source limitation, not a learner limitation.\u003c/p>\n\u003cp>The following issues remain visible rather than being silently corrected:\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003ctr>\u003cth>Source issue\u003c/th>\u003cth>Treatment in this teaching package\u003c/th>\u003cth>Remaining uncertainty\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>C5 p. 28 lists one basis in a problem giving two reachable rungs\u003c/td>\u003ctd>I08 explicitly uses both given bases\u003c/td>\u003ctd>No mathematical teaching gap; whether a lecturer expects a particular shortened presentation is unknown\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C5 p. 33 says arbitrary finite strings in lexicographic order are well ordered\u003c/td>\u003ctd>I10 teaches the valid integer principle; R10 proves the valid pair case\u003c/td>\u003ctd>Lecturer&#x27;s intended string-order convention remains unspecified. For ordinary dictionary order with a&lt;b, b&gt;ab&gt;aab&gt;... has no least member, so the blanket claim cannot be used\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C5 p. 50 parenthesis grammar\u003c/td>\u003ctd>R07 teaches its actual rules and shows why completeness fails for (())(())\u003c/td>\u003ctd>Intended full grammar and empty-string convention remain unresolved; excluded from later definitive scoring until clarified\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C5 p. 61 says ≤ but supplies a strict condition\u003c/td>\u003ctd>R10 labels the displayed relation as strict and follows p. 62&#x27;s “earlier pair” proof\u003c/td>\u003ctd>Typographical intent is not confirmed by an announcement, but the mathematical distinction is explicit\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C4 p. 71 omits a test restriction\u003c/td>\u003ctd>N24 retains n&gt;2 from p. 70 and explains the n=2 exception\u003c/td>\u003ctd>No missing mathematical condition in the teaching explanation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C4 p. 41 uses overly broad prime-function/polynomial wording\u003c/td>\u003ctd>N11 does not assert the blanket statement; it teaches the supported counterexample method and notes the constant-prime-function exception\u003c/td>\u003ctd>No lecturer erratum supplied\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C4 p. 23 promises a base-representation proof not worked in supplied §5.1\u003c/td>\u003ctd>N06 teaches the theorem, method and remainder-based explanation\u003c/td>\u003ctd>Whether that missing particular proof is independently required remains unconfirmed\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Textbook exercise references / induction equivalence directions\u003c/td>\u003ctd>Teach supplied results and explanations without importing whole exercise sets\u003c/td>\u003ctd>Unprovided proof requirements remain unconfirmed\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>T03 P13 leading zeros\u003c/td>\u003ctd>N06 derives a unique nonzero-leading solution, valid either way\u003c/td>\u003ctd>General leading-zero convention remains unstated but does not change this worked result\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>T05 P3(a) “first five applications”\u003c/td>\u003ctd>R04 explicitly uses generation layers and lists them\u003c/td>\u003ctd>Individual rule-execution interpretation would require an execution order\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Visual checks completed before the affected lessons:\u003c/strong> C4 pp. 14–19,23–28,39–51,57–74 (43 pages) and C5 pp. 5,9–16,27,31–32,34,38–44,47–49,51 (24 pages), in addition to the prior visually checked scope, tutorial, tree and checkerboard pages. T04 p. 1 was enlarged again to disambiguate P9(a): it is 4^n+7^n+1; P9(c) has 3^(2^n)−1. There is \u003cstrong>no outstanding visual-verification blocker for the material taught here\u003c/strong>. Original-source mathematical/wording issues listed above are not cured by clearer rendering.\u003c/p>\n\u003cp>\u003cstrong>Scope remains unchanged.\u003c/strong> No characteristic equations, general recurrence solver, cryptography, non-coprime generalized CRT, whole Chapter 9 order theory or whole Chapter 11 tree theory has been introduced. Prerequisite explanations and mathematical checks of source claims are clearly used only to support the mapped content. No textbook-only exercise is assigned.\u003c/p>\n\u003cp>\u003cstrong>Assessment unknowns remain unknown:\u003c/strong> total marks, question count, response-format mix, topic allocation and exact marking rubric. The worked examples demonstrate reasoning, not a forecast of actual Quiz 2 questions.\u003c/p>\n\u003cp>\u003cstrong>Next stage, not started:\u003c/strong> source-qualified practice and mastery assessment across all mapped groups, beginning with Level 1 and later integrating Levels 2–3. Use actual independent answers to establish learning evidence. Do not treat this completed teaching document as demonstrated understanding or readiness. No formal question bank, mistake log, Challenge Mode, mock or score was created in this pass.\u003c/p>", "map": "\u003ch2>CS1231 — Quiz 2 exam map\u003c/h2>\n\u003cp>Prepared 4 October 2026 from this project&#x27;s supplied sources and the user&#x27;s approved inspection. This is an assessment map, not a learner record. No mastery, weakness, progress, readiness, exposure or practice history is assigned. The approved teaching pass is now delivered in quiz2-teaching-package.md \u003cspan class=\"source-ref\">(quiz2-teaching-package.md)\u003c/span>; current teaching-only statuses and completed visual checks are in teaching-coverage.md \u003cspan class=\"source-ref\">(teaching-coverage.md)\u003c/span>. This does not establish learner mastery.\u003c/p>\n\u003ch3>Assessment and scope authority\u003c/h3>\n\u003cul>\u003cli>Quiz 2: Monday 12 October 2026, 08:30–09:30; 25% of the module; hardcopy/offline.\u003c/li>\u003cli>Closed book with one A4 double-sided cheat sheet; no other cheat-sheet restrictions stated. Non-programmable calculators permitted, without communication or web access.\u003c/li>\u003cli>Scope: Chapter 4 §§4.1–4.4 and Chapter 5 §§5.1–5.3, restricted to supplied lecture/tutorial coverage. §4.5 explicitly excluded.\u003c/li>\u003cli>Questions are expected to resemble tutorial problems. Marks, question count, response-format mix and topic allocation are not specified.\u003c/li>\u003cli>Primary authority: Quiz 2 instructions \u003cspan class=\"source-ref\">(../exam/quiz2-information.pdf)\u003c/span>, physical PDF pp. 2–4, especially p. 3. Weighting/delivery: Introduction \u003cspan class=\"source-ref\">(../exam/Introduction.pdf)\u003c/span>, p. 6. The rough schedule on p. 10 does not expand scope.\u003c/li>\u003cli>Scope chain: instructions p. 3 → Chapters 4 and 5 → actual section headings and material in those decks; instructions p. 3 → tutorials → T03 P7–13, T04 P1–17, T05 P1–5, as approved by the user. These references are resolved. Missing tutorial solutions do not invalidate question-stem evidence.\u003c/li>\u003cli>Source hierarchy: dedicated Quiz 2 instructions and specific subsequent clarifications; Introduction for compatible assessment details; scoped lecture/tutorial material jointly for content, with tutorials preferred for style; Quiz 1 only for weak background style. No external course content is imported.\u003c/li>\u003c/ul>\n\u003ch3>Reading the map\u003c/h3>\n\u003cp>All pages below are \u003cstrong>physical PDF pages\u003c/strong>, not printed slide numbers. Repeated slide builds can make the two differ. \u003ccode>C4\u003c/code> = Chapter4.pdf \u003cspan class=\"source-ref\">(../Sources/Chapter4.pdf)\u003c/span>; \u003ccode>C5\u003c/code> = Chapter5.pdf \u003cspan class=\"source-ref\">(../Sources/Chapter5.pdf)\u003c/span>. T03/T04/T05 = corresponding tutorial PDFs. Each also has a same-stem Markdown file; the two formats are one source, not corroborating evidence.\u003c/p>\n\u003cp>\u003cstrong>Confidence concerns scope, not predicted appearance or learner ability:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>CONFIRMED:\u003c/strong> directly present in a scoped lecture section or an approved relevant tutorial. This includes lecture-only topics; tutorial absence does not remove them.\u003c/li>\u003cli>\u003cstrong>STRONGLY SUPPORTED:\u003c/strong> a finer application/placement supported by an approved problem but not explicitly named as a standalone lecture topic.\u003c/li>\u003cli>\u003cstrong>UNCERTAIN:\u003c/strong> missing support, unresolved scope extension, or disputed exact detail. Such extensions stay outside the active map.\u003c/li>\u003c/ul>\n\u003cp>Expected abilities and question demands are planning interpretations of supplied definitions, examples and tutorial commands, not an official marking rubric. “Confusable” means a distinction worth preserving, not an observed learner mistake or measured frequency of misconceptions. A dash under tutorials means \u003cstrong>no direct problem in the approved subset\u003c/strong>, not exclusion.\u003c/p>\n\u003cp>The visual flags below preserve the map-stage inspection snapshot; all F checks for the delivered lessons have since been completed, as recorded in teaching-coverage.md \u003cspan class=\"source-ref\">(teaching-coverage.md)\u003c/span>.\u003c/p>\n\u003cp>Visual status: \u003cstrong>V\u003c/strong> = relevant original visually checked; \u003cstrong>F\u003c/strong> = precise formula/layout check still needed at the pages stated; \u003cstrong>T\u003c/strong> = text inspected, with no special visual dependency identified; \u003cstrong>Q\u003c/strong> = source-quality issue recorded below. V does not certify mathematical correctness. Several rows combine statuses because only some pages were checked.\u003c/p>\n\u003ch3>Chapter 4, Section 4.1 — Divisibility and modular arithmetic\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003ctr>\u003cth>ID / exact concept\u003c/th>\u003cth>Lecture / tutorial evidence\u003c/th>\u003cth>Expected ability and likely demand\u003c/th>\u003cth>Prerequisites\u003c/th>\u003cth>Confusable neighbouring concept\u003c/th>\u003cth>PDF verification\u003c/th>\u003cth>Confidence / priority\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>N01 Divisibility, factors/multiples, closure under integer linear combinations and transitivity\u003c/td>\u003ctd>C4 pp. 6–8; T03 P7; T04 P7,17 use these facts\u003c/td>\u003ctd>Translate divisibility into an integer witness; construct short proofs and apply closure. Definition, proof, theorem application\u003c/td>\u003ctd>Integers; existential statements; algebra\u003c/td>\u003ctd>Divisibility relation versus division; direction of divisor/multiple\u003c/td>\u003ctd>T; preserve divides/not-divides glyphs\u003c/td>\u003ctd>CONFIRMED / L1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N02 Division algorithm; quotient/remainder; div and mod for negative integers\u003c/td>\u003ctd>C4 pp. 9–10; C5 p. 34; T03 P8; T04 P17(d)\u003c/td>\u003ctd>Compute quotient/remainder with the stated bounds; prove an iff involving negative dividends. Calculation, proof\u003c/td>\u003ctd>N01; inequalities; iff proof\u003c/td>\u003ctd>Nonnegative remainder versus truncation toward zero; theorem versus executable algorithm\u003c/td>\u003ctd>V for T03 pp. 1–2; F C5 p. 34\u003c/td>\u003ctd>CONFIRMED / L1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N03 Congruence and its equivalent divisibility/equality/remainder formulations\u003c/td>\u003ctd>C4 pp. 11–13; T03 P9–11; T04 P4\u003c/td>\u003ctd>Translate forms and prove congruences, including changed moduli and residue cases. Recognition, proof, calculation\u003c/td>\u003ctd>N01–02; case splits\u003c/td>\u003ctd>Congruence relation versus mod function; equality versus congruence\u003c/td>\u003ctd>V tutorial formulas; T lecture text\u003c/td>\u003ctd>CONFIRMED / L1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N04 Addition/multiplication of congruences; remainder reduction; limits of cancellation\u003c/td>\u003ctd>C4 pp. 14–16; T03 P9–11; T04 P4,6\u003c/td>\u003ctd>Manipulate valid congruences and justify conditions; identify invalid division. Calculation, theorem application, counterexample\u003c/td>\u003ctd>N03; algebra\u003c/td>\u003ctd>Multiplication always preserving a congruence versus cancellation requiring conditions\u003c/td>\u003ctd>F C4 pp. 14–16 for grouping; tutorial notation V\u003c/td>\u003ctd>CONFIRMED / L1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N05 Arithmetic in Z_m: operations, closure, associativity, commutativity, identities, distributivity and additive inverses\u003c/td>\u003ctd>C4 pp. 17–19; —\u003c/td>\u003ctd>Apply and recognise the listed operation properties and inverse distinctions. Definition, calculation, short proof\u003c/td>\u003ctd>N02–04\u003c/td>\u003ctd>Additive versus multiplicative inverse; integer operation versus reduced operation\u003c/td>\u003ctd>F C4 pp. 17–19: operation subscripts\u003c/td>\u003ctd>CONFIRMED / L2\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Chapter 4, Section 4.2 — Integer representations\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003ctr>\u003cth>ID / exact concept\u003c/th>\u003cth>Lecture / tutorial evidence\u003c/th>\u003cth>Expected ability and likely demand\u003c/th>\u003cth>Prerequisites\u003c/th>\u003cth>Confusable neighbouring concept\u003c/th>\u003cth>PDF verification\u003c/th>\u003cth>Confidence / priority\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>N06 Positional base-b representation; digit constraints and uniqueness statement\u003c/td>\u003ctd>C4 pp. 22–26; T03 P12–13\u003c/td>\u003ctd>Interpret numeral expansions and constrain unknown digits. Recognition, calculation, algebraic application\u003c/td>\u003ctd>Powers; finite sums; N02\u003c/td>\u003ctd>Digit string versus product; value versus representation; allowed digits versus leading digit\u003c/td>\u003ctd>V T03 p. 2; F C4 p. 23 for polynomial subscripts\u003c/td>\u003ctd>CONFIRMED / L1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N07 Conversion to/from decimal by expansion and repeated division\u003c/td>\u003ctd>C4 pp. 24–28; T03 P12(a–c),13\u003c/td>\u003ctd>Convert bases and explain/record remainders in the correct o d by the supplied restricted rules\u003c/td>\u003ctd>V p. 50; F p. 51; Q completeness of parenthesis grammar\u003c/td>\u003ctd>CONFIRMED / L2 topic; full grammar claim UNCERTAIN\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>R08 Recursively defined rooted/full binary trees; height and vertex count\u003c/td>\u003ctd>C5 pp. 52–55,59; T05 P5\u003c/td>\u003ctd>Interpret constructors; calculate recursive height/size and distinguish the two tree classes. Definition, calculation, application\u003c/td>\u003ctd>R01,R04; max; basic vertex/edge/root vocabulary supplied here\u003c/td>\u003ctd>Rooted versus full binary; full versus perfect/complete (do not import additional tree theory); height versus size\u003c/td>\u003ctd>V pp. 52–55,59\u003c/td>\u003ctd>CONFIRMED / L2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>R09 Structural-induction bounds on full binary trees\u003c/td>\u003ctd>C5 pp. 58–60; T05 P5\u003c/td>\u003ctd>Build a structural proof using subtree hypotheses and the height/size recursions. Multi-step proof, inequality application\u003c/td>\u003ctd>R05,R08; inequalities; powers\u003c/td>\u003ctd>Lecture upper bound versus tutorial lower bound; max of heights versus sum of sizes\u003c/td>\u003ctd>V p. 60 and T05 p. 1; formulas recorded below\u003c/td>\u003ctd>CONFIRMED / L2\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>R10 Generalized induction on ordered pairs\u003c/td>\u003ctd>C5 pp. 61–62; —\u003c/td>\u003ctd>Interpret the supported order on nonnegative integer pairs and complete the two-branch inductive proof. Definition, proof completion\u003c/td>\u003ctd>I10,R01; ordered pairs; case distinction\u003c/td>\u003ctd>Strict versus non-strict lexicographic order; induction on pairs versus Chapter 9 general relation theory\u003c/td>\u003ctd>V pp. 61–62; Q strict/non-strict wording\u003c/td>\u003ctd>CONFIRMED / L3 topic\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Priority structure and evidence\u003c/h3>\n\u003cp>These levels specify study order, not difficulty, marks, question probability or learner proficiency. No official topic allocation exists. Tutorial frequency is supporting evidence, not a numerical forecast.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003ctr>\u003cth>Level\u003c/th>\u003cth>Map IDs\u003c/th>\u003cth>Evidence for placement\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>Level 1 — core\u003c/strong>\u003c/td>\u003ctd>N01–04, N06–07, N09, N14–17, N19–21; I01–04, I08, I10; R01–02, R04–05\u003c/td>\u003ctd>Direct recurring work across T03 P7–13, T04 P1,3–9,11–12,14,16–17 and T05 P1–4; several concepts are required repeatedly inside later proofs/calculations. Base conversion has three direct subparts plus the digit problem. Euclidean/Bézout methods recur within the three inverse tasks.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>Level 2 — covered applications and supporting theory\u003c/strong>\u003c/td>\u003ctd>N05,N08,N10–12,N18,N22–23,N25–26; I05–07,I09,I11; R06–09\u003c/td>\u003ctd>Explicit slide coverage with fewer/no direct tutorial tasks, or specialised tutorial applications: T04 P2,10,13,15 and T05 P5. Trees are an application of the Level 1 structural-induction method. Fermat/primitive-root/discrete-log topics remain included despite no direct scoped tutorial problem.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>Level 3 — lecture-supported peripheral/specialised material\u003c/strong>\u003c/td>\u003ctd>N13,N24,R03,R10\u003c/td>\u003ctd>Lecture-only distribution/conjecture material, pseudoprime-test limitations, Lamé/Fibonacci runtime linkage, and generalized induction; no direct problem in the approved tutorial subset. Study after the core, not omit.\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Supplementary detail within the corresponding rows: dated prime records and computational-search anecdotes are low-priority contextual slide content, not established memorisation targets. Full proofs of external textbook exercises merely mentioned on slides are not automatically imported.\u003c/p>\n\u003ch3>Tutorial coverage cross-check\u003c/h3>\n\u003cp>Every approved top-level problem has a home; mappings can overlap.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003ctr>\u003cth>Source\u003c/th>\u003cth>Problem → map IDs\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>T03\u003c/td>\u003ctd>7→N01; 8→N02; 9–11→N03–04; 12→N06–07; 13→N06–07\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>T04\u003c/td>\u003ctd>1→N09,N11; 2→N12; 3→N14; 4→N03,N14–15; 5→N15–16,N19–20; 6→N17,N19; 7–8→N17,N21; 9→I04; 10→I04,I09; 11→I02; 12→I03; 13→I05; 14–15→I08–09; 16→I02; 17→N16,I10\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>T05\u003c/td>\u003ctd>1→R01; 2→R02; 3→R04–05,I08; 4→R04–05; 5→R08–09\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>T03 P7–10 are on PDF p. 1 and P11–13 on p. 2. T04 P1–10 are on p. 1 and P11–17 on p. 2. T05 P1–5 are on p. 1.\u003c/p>\n\u003ch3>Verified visual and formula register\u003c/h3>\n\u003cp>Inspection history below includes the approved source-inspection stage plus this mapping stage. Rendering a page alone was not counted as inspection.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003ctr>\u003cth>Source/pages\u003c/th>\u003cth>Information checked\u003c/th>\u003cth>Status\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Quiz 2 instructions pp. 2–4; Introduction pp. 6,10\u003c/td>\u003ctd>Scope, permissions, weighting, timetable and crossed-out seat wording\u003c/td>\u003ctd>Visually checked in source inspection\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C4 pp. 29–30\u003c/td>\u003ctd>Base table columns and three/four-bit grouping\u003c/td>\u003ctd>Visually checked in source inspection\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C4 p. 37\u003c/td>\u003ctd>Sieve underlining and colour distinguish eliminations/primes\u003c/td>\u003ctd>Visually checked in source inspection; individual entries should be enlarged if transcribed\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C5 pp. 17–19\u003c/td>\u003ctd>Four subboards, missing-square position and central triomino\u003c/td>\u003ctd>Visually checked in source inspection\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C5 pp. 20–21\u003c/td>\u003ctd>Failed induction transition and overlapping-line argument\u003c/td>\u003ctd>Visually checked in source inspection\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C5 pp. 52–55,59–60\u003c/td>\u003ctd>Tree constructors, height/size recursions, upper bound n(T) ≤ 2^(h(T)+1)−1\u003c/td>\u003ctd>Visually checked in source inspection\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>T03 pp. 1–2\u003c/td>\u003ctd>Divisibility signs, moduli, bases and digit constraints\u003c/td>\u003ctd>Visually checked during map construction\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>T04 pp. 1–2\u003c/td>\u003ctd>P9(c) is 3^(2^n)−1 divisible by 2^(n+2); P13 has complement over the union and on each intersected set; fraction and product layout in P11/P16\u003c/td>\u003ctd>Visually checked at enlarged resolution during map construction\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>T05 p. 1\u003c/td>\u003ctd>Piecewise definition, Fibonacci indices, tree lower bound n(T) ≥ 2h(T)+1\u003c/td>\u003ctd>Visually checked in source inspection; lecture upper bound and tutorial lower bound are different claims, not a contradiction\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C5 pp. 28,33,50,61–62\u003c/td>\u003ctd>Base-case abbreviation, ordering claims, parenthesis grammar, pair-order wording and piecewise recurrence\u003c/td>\u003ctd>Visually checked during map construction; source issues remain below\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Map-stage original-PDF checks, now completed for the teaching package (see the coverage ledger):\u003c/strong> C4 pp. 14–19,23–28,39–51,57–74 for grouped expressions, min/max exponents, coefficients, inverse bars, CRT subscripts and power/log notation; C5 pp. 5,9,10–16,27,31–32,34,38–44,47–49,51 for illustrations, bounds, recurrence indices and symbolic syntax. Prioritise C4 pp. 45–51,59–65 and C5 pp. 41–44. Already checked illustrations need not be re-audited unless a later lesson needs unreadable detail. These pending checks do not make section membership uncertain; they limit safe transcription/teaching of exact formulas.\u003c/p>\n\u003ch3>Unresolved source issues and limits\u003c/h3>\n\u003cp>The following are source-fidelity flags, not a lesson or learner-error record. Mathematical concerns are reasoned checks of supplied statements; no outside source is being promoted to course authority.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>C5 p. 28:\u003c/strong> the problem assumes the first two ladder rungs are reachable, but the displayed basis step mentions only the first, while the transition starts at k≥2. Preserve the second given base explicitly when later presenting this argument. Topic remains confirmed.\u003c/li>\u003cli>\u003cstrong>C5 p. 33:\u003c/strong> the blanket assertion that finite strings in lexicographic order are well ordered needs an ordering restriction/convention. Ordinary dictionary order on arbitrary finite strings does not generally have this property. Do not turn that unqualified statement into a scored fact without resolution.\u003c/li>\u003cli>\u003cstrong>C5 p. 50:\u003c/strong> the displayed parenthesis rules use only ()w, (w), and w(). Their completeness for all balanced strings is questionable; arbitrary concatenation is not supplied and the empty-string convention is unstated. Topic confirmed; a claim of complete characterisation remains unresolved. Do not silently replace the lecturer&#x27;s grammar.\u003c/li>\u003cli>\u003cstrong>C5 p. 61:\u003c/strong> says “less than or equal” but gives strict comparisons. The p. 62 application uses strictly earlier pairs. Record this as a wording inconsistency rather than importing Chapter 9.\u003c/li>\u003cli>\u003cstrong>C4 p. 71:\u003c/strong> the base-2 primality-test prose loses the n&gt;2 qualification on the preceding page. Check and retain domain/base restrictions before teaching or grading it. No new primality algorithms are implied.\u003c/li>\u003cli>\u003cstrong>C4 p. 41:\u003c/strong> broad wording about no simple prime-producing function needs careful interpretation; its concrete polynomial example does not justify an unrestricted impossibility claim. Keep the supported counterexample task distinct from this prose.\u003c/li>\u003cli>\u003cstrong>C4 p. 23:\u003c/strong> promises a proof of unique base representation in §5.1, but the supplied §5.1 deck has no explicit worked proof of that theorem. The representation theorem/application is confirmed; requiring that particular missing proof is UNCERTAIN.\u003c/li>\u003cli>\u003cstrong>C5 p. 29 and other exercise references:\u003c/strong> references to textbook proofs do not supply all those proofs here. Recognition of the stated equivalence of induction principles is included; reconstruction of every equivalence direction is not established.\u003c/li>\u003cli>\u003cstrong>T03 P13:\u003c/strong> the stem says “not all 0” but does not expressly settle whether leading zero digits are permitted in both written three-position numerals. Preserve this boundary when later interpreting or solving it.\u003c/li>\u003cli>Tutorial solutions, Quiz 2 sample paper, detailed marking rubric, exact format/count/marks and numerical topic distribution remain absent. No later Canvas clarification was supplied. None is fabricated.\u003c/li>\u003c/ul>\n\u003ch3>Explicit exclusions and unconfirmed extensions\u003c/h3>\n\u003cul>\u003cli>§4.5 excluded. Chapters 1–2 are prerequisites only where a mapped task needs them, not independent Quiz 2 units.\u003c/li>\u003cli>No Chapter 8 characteristic equations, general recurrence-solving methods, rabbit models or inclusion–exclusion unit.\u003c/li>\u003cli>No whole Chapter 11 tree unit or Chapter 9 relation/order unit. Only C5&#x27;s explicit constructions and generalized-induction example are mapped.\u003c/li>\u003cli>T05 P10 and P13 remain outside the initial pool, as do P6–15 generally. Shared number-theory words do not import counting methods.\u003c/li>\u003cli>T03 P1–6, T01–02, T06–07 and the Quiz 1 content are not additional Quiz 2 practice scope.\u003c/li>\u003cli>General non-coprime congruence classification, generalized CRT with non-coprime moduli, and cryptographic algorithms are UNCERTAIN/unsupported extensions, not active map entries.\u003c/li>\u003cli>Historical biographies and search records on slides are background; no evidence establishes detailed historical/date recall as a Quiz 2 demand.\u003c/li>\u003c/ul>\n\u003ch3>Lecturer/question-style profile\u003c/h3>\n\u003cp>See the complete evidence-based profile \u003cspan class=\"source-ref\">(professor-style-profile.md)\u003c/span>. In brief: the official tutorial-similarity statement supports preparation for computation, proof, justification, counterexample, construction and multi-step theorem application. Tutorial method restrictions matter. Quiz 1 cannot establish Quiz 2&#x27;s structure or marking.\u003c/p>\n\u003ch3>Recommended teaching order — approved and used\u003c/h3>\n\u003cp>This is a dependency-based recommendation informed by the priorities above, not evidence that any concept has been studied.\u003c/p>\n\u003cul>\u003cli>Minimal prerequisite refresh as needed: integer algebra, quantifiers/implications, proof forms, sets, powers, factorial and sum notation.\u003c/li>\u003cli>N01–05: divisibility, quotient/remainder, congruence and modular operations.\u003c/li>\u003cli>N06–08: representations and conversions.\u003c/li>\u003cli>N09–10,N14–17: primes, gcd/lcm, Euclidean algorithm, Bézout and cancellation.\u003c/li>\u003cli>N19–22: modular inverses, linear congruences, CRT and substitution.\u003c/li>\u003cli>I01–04,I07: induction structure, sums, inequalities, divisibility and proof errors.\u003c/li>\u003cli>I08,I10–11, then N18: strong induction, well-ordering, method relationships and prime-factorisation proofs.\u003c/li>\u003cli>R01–02,R04–05: recursive functions/Fibonacci, recursive sets and structural induction.\u003c/li>\u003cli>R08–09: the Chapter 5 tree construction and structural bounds.\u003c/li>\u003cli>Remaining Level 2 applications: N11–12,N23,N25–26,I05–06,I09,R06–07, subject to resolving the parenthesis issue.\u003c/li>\u003cli>Level 3: N13,N24,R03,R10, retaining the source qualifications above.\u003c/li>\u003c/ul>\n\u003ch3>Relevant inventory and freshness\u003c/h3>\n\u003cp>19 distinct supplied sources / 38 paired PDF–Markdown files were inventoried at the inspection stage. This map directly uses the two chapter decks, three tutorial sets, Quiz 2 instructions and Introduction; Quiz 1 is used only for the separate style profile. No standalone tutorial solution set or Quiz 2 sample/revision document was found. All relevant originals have matching Markdown; diagrams and formula layout require originals.\u003c/p>\n\u003cp>Source fingerprint manifest: source-fingerprints.json \u003cspan class=\"source-ref\">(source-fingerprints.json)\u003c/span>, generated locally on 4 October 2026. It covers the PDF/Markdown pairs used by this map/profile. Revisit affected entries if those hashes change, if tutorial answers arrive, or if a later Quiz 2 announcement modifies scope. Learner tracking files are intentionally not created in this stage.\u003c/p>", "profile": "\u003ch2>CS1231 — Quiz 2 lecturer/question-style profile\u003c/h2>\n\u003cp>Prepared 4 October 2026. This is a source-based assessment-style profile, not a personality judgement or a forecast. No teaching, generated questions or learner scoring is included.\u003c/p>\n\u003ch3>Evidence and sample limits\u003c/h3>\n\u003cp>Primary statement: quiz2-information.pdf \u003cspan class=\"source-ref\">(../exam/quiz2-information.pdf)\u003c/span>, physical p. 3: questions will be similar to tutorial problems. Scope is restricted to Chapters 4–5 lecture/tutorial coverage.\u003c/p>\n\u003cp>Directly relevant sample: \u003cstrong>29 top-level tutorial problems\u003c/strong>, with subparts: T03 P7–13 (7), T04 P1–17 (17), T05 P1–5 (5). Their PDFs were inspected, with T03/T04 notation checked at enlarged resolution and T05 inspected in the source-inspection stage. No tutorial solutions are supplied, so expected method and response demand are inferred from stems/hints rather than a marking rubric.\u003c/p>\n\u003cp>Weak background sample: example quiz of 1-solutions.pdf \u003cspan class=\"source-ref\">(../exam/example%20quiz%20of%201-solutions.pdf)\u003c/span>, Quiz 1 dated 14 September 2026, five top-level questions. Its Markdown was reviewed during source inspection. The response instructions and task types can inform a cautious style observation; damaged mathematical layouts are not used as substantive Quiz 2 content evidence.\u003c/p>\n\u003ch3>Observed demands and implications\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003ctr>\u003cth>Demand / confidence for preparation\u003c/th>\u003cth>Supplied evidence\u003c/th>\u003cth>What the evidence supports\u003c/th>\u003cth>Limit\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Computation — STRONGLY SUPPORTED\u003c/td>\u003ctd>T03 P12; T04 P5(a–c); T05 P3(a)\u003c/td>\u003ctd>Base conversion; staged inverse/congruence calculations; generating objects from rules\u003c/td>\u003ctd>No marks or proportion established\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Proof writing — STRONGLY SUPPORTED\u003c/td>\u003ctd>T03 P7–11; T04 P3–4,6–17; T05 P2–5\u003c/td>\u003ctd>General mathematical arguments, including induction and structural induction\u003c/td>\u003ctd>Tutorial prevalence is not an official quiz weighting\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Justification from definitions — STRONGLY SUPPORTED\u003c/td>\u003ctd>T03 P7–10; T04 P4,17; T05 P1,3–4\u003c/td>\u003ctd>Translate definitions, state assumptions, justify steps and domain restrictions\u003c/td>\u003ctd>No exact marking scheme for steps is supplied\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Counterexample / disproof — STRONGLY SUPPORTED\u003c/td>\u003ctd>T04 P1 explicitly says prove or disprove; T05 P1 asks why definitions fail\u003c/td>\u003ctd>Test universal claims and exhibit a decisive obstruction\u003c/td>\u003ctd>No evidence that every proof question hides a false claim\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Proof completion — STRONGLY SUPPORTED\u003c/td>\u003ctd>T04 P8 explicitly completes CRT uniqueness; P17 scaffolds a proof\u003c/td>\u003ctd>Fill a logical gap or connect prompted sub-results\u003c/td>\u003ctd>Does not establish fill-in-the-blank response format\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Applying definitions/theorems — STRONGLY SUPPORTED\u003c/td>\u003ctd>T04 P3,5–8; T05 P3–5\u003c/td>\u003ctd>Check hypotheses and use the result in the relevant setting\u003c/td>\u003ctd>Memorised theorem names alone are not shown to suffice\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Multi-step reasoning — STRONGLY SUPPORTED\u003c/td>\u003ctd>T04 P5: Euclidean/Bézout route → inverse → congruence; P7→8: lemma → uniqueness; P17(a–e): least element → divisibility → gcd\u003c/td>\u003ctd>Linked calculations and proof chains deserve preparation\u003c/td>\u003ctd>No confirmed integrated-question count or length\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Constructing definitions/objects — STRONGLY SUPPORTED\u003c/td>\u003ctd>T05 P3(a),4\u003c/td>\u003ctd>Generate early stages; propose a recursive definition and prove correctness\u003c/td>\u003ctd>No Chapter 8 recurrence-solving inference\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Following required methods — STRONGLY SUPPORTED\u003c/td>\u003ctd>T04 P5 names a method; P7 forbids CRT; P9 specifies induction; P14 specifies strong induction; T05 P3(b–c),4–5 specify proof methods\u003c/td>\u003ctd>Method compliance and avoiding circular reasoning are part of the task\u003c/td>\u003ctd>Cannot infer a penalty schedule\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Short recognition/selected response — POSSIBLE, weak background only\u003c/td>\u003ctd>Quiz 1 P5 has true/false and selected-response items; P1 includes a truth table\u003c/td>\u003ctd>The course has used a mix of response demands\u003c/td>\u003ctd>Quiz 2 MCQ/multi-select/true–false inclusion remains UNKNOWN\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch3>Wording, structure and detail\u003c/h3>\n\u003cul>\u003cli>Relevant tutorials commonly use “show”, “prove”, “find”, “give a recursive definition”, and “prove or disprove”. Claims often quantify over integers with explicit hypotheses; keeping these conditions is part of faithful preparation.\u003c/li>\u003cli>Stems are largely compact mathematical statements, with contextual applications such as gift certificates and splitting stones (T04 P14–15). This supports both abstract and contextual proof preparation; it does not establish a case-based quiz format.\u003c/li>\u003cli>Subparts can scaffold a single reasoning chain (T04 P17), repeat a computational method with varied numbers (P5), or require two different methods for a related claim (T05 P3).\u003c/li>\u003cli>Tutorial hints can prescribe strategy, but there is no evidence that Quiz 2 will always supply hints.\u003c/li>\u003cli>Tutorial 04 P7 expressly prevents circular use of CRT to prove a supporting result. The map therefore distinguishes theorem application from theorem proof.\u003c/li>\u003cli>Tutorial 04 P12 asks for the valid range before proof; T03 P13 permits finding digits or proving nonexistence. These support attention to boundary cases and choosing an appropriate response, without assuming “trick questions”.\u003c/li>\u003cli>No relevant tutorial distractor set exists. A Quiz 2 distractor taxonomy, “most/best” pattern, or close-option strategy cannot be responsibly established.\u003c/li>\u003c/ul>\n\u003ch3>Quiz 1: narrow permissible use\u003c/h3>\n\u003cp>Quiz 1 includes proof/justification tasks, method restrictions and selected-response items: P2 set/function proofs; P3 a specified logical method; P4 justification; P5 answers without justification. This shows that response instructions can differ across items. It does \u003cstrong>not\u003c/strong> establish Quiz 2 content, five questions, 25 marks, an identical balance of formats or identical grading rules. The confirmed Quiz 2 one-hour duration comes from its own instructions, not transfer from Quiz 1.\u003c/p>\n\u003ch3>Prioritisation implications\u003c/h3>\n\u003cp>Prioritise core definitions used inside proofs, dependable calculation chains, complete induction structure, theorem hypotheses and justification. The Level 1–3 assignments are in exam-map.md \u003cspan class=\"source-ref\">(exam-map.md)\u003c/span>. They reflect evidence and dependencies, not observed learner performance or predicted mark allocation.\u003c/p>\n\u003ch3>Open questions\u003c/h3>\n\u003cp>Quiz 2 question count, total marks, response-format mix, proof/computation balance, topic distribution, exact expected working, and whether hints are provided are UNKNOWN. A Quiz 2 sample paper or marking guide could materially change this profile. Source-quality issues in Chapter 5 are recorded in the exam map; do not use unresolved statements as grading keys.\u003c/p>", "coverage": "\u003ch2>Quiz 2 — concept-level teaching coverage\u003c/h2>\n\u003cp>Updated 4 October 2026. Scope remains the approved exam map \u003cspan class=\"source-ref\">(exam-map.md)\u003c/span>. This ledger records the teaching package delivered, not whether the learner has read it or can solve questions. No attempts, accuracy, weakness, mastery or readiness are inferred.\u003c/p>\n\u003cp>\u003cstrong>TAUGHT\u003c/strong> means the package provides meaning, conditions, method, worked examples, source-grounded question-style expectations, pitfalls and cheat-sheet candidates. \u003cstrong>UNRESOLVED — SUPPORTED PARTS TAUGHT\u003c/strong> means supported content is explained but a source claim remains unresolved. There are no NOT STARTED or NEEDS VISUAL VERIFICATION groups.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003ctr>\u003cth>Priority\u003c/th>\u003cth>Total groups\u003c/th>\u003cth>TAUGHT\u003c/th>\u003cth>Unresolved source detail\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Level 1\u003c/td>\u003ctd>24\u003c/td>\u003ctd>24\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Level 2\u003c/td>\u003ctd>19\u003c/td>\u003ctd>18\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Level 3\u003c/td>\u003ctd>4\u003c/td>\u003ctd>4\u003c/td>\u003ctd>0\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>47\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>46\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>1\u003c/strong>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>All 47 groups were addressed. The one unresolved entry is not an omitted lesson: R07 includes valid restricted-parenthesis constructions, a completeness counterexample, and the full supplied well-formed-formula grammar. Lecturer clarification is needed for the intended complete balanced-parenthesis definition/empty-string convention.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003ctr>\u003cth>ID\u003c/th>\u003cth>Concept\u003c/th>\u003cth>Priority\u003c/th>\u003cth>Teaching status\u003c/th>\u003cth>Lesson\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>N01\u003c/td>\u003ctd>Divisibility, factors/multiples, closure under integer linear combinations and transitivity\u003c/td>\u003ctd>L1\u003c/td>\u003ctd>TAUGHT\u003c/td>\u003ctd>Read N01 \u003cspan class=\"source-ref\">(quiz2-teaching-package.md#n01)\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N02\u003c/td>\u003ctd>Division algorithm; quotient/remainder; div and mod for negative integers\u003c/td>\u003ctd>L1\u003c/td>\u003ctd>TAUGHT\u003c/td>\u003ctd>Read N02 \u003cspan class=\"source-ref\">(quiz2-teaching-package.md#n02)\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N03\u003c/td>\u003ctd>Congruence and its equivalent divisibility/equality/remainder formulations\u003c/td>\u003ctd>L1\u003c/td>\u003ctd>TAUGHT\u003c/td>\u003
