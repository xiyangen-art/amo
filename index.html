How to use it.\u003c/strong> Identify the factor you want to cancel and the modulus/divisor against which it must be coprime. State that gcd condition. Convert the congruence to a divisibility statement if needed. Do not use the conclusion to justify its own hypothesis.\u003c/p>\n\u003cp>\u003cstrong>Worked proof — lecture argument, explained.\u003c/strong> From gcd(a,b)=1, Bézout gives sa+tb=1. Multiplying by c yields sac+tbc=c. Both terms on the left are divisible by a if a∣bc, so a∣c. Now ac≡bc (mod m) says m∣c(a−b); with gcd(m,c)=1, cancellation yields m∣a−b.\u003c/p>\n\u003cp>\u003cstrong>Worked example — analogous.\u003c/strong> From 5x≡5·8 (mod 12), gcd(5,12)=1 lets us conclude x≡8 (mod 12). From 6x≡6·8 (mod 12), the same conclusion is invalid: x=0 satisfies the displayed congruence but is not congruent to 8.\u003c/p>\n\u003cp>\u003cstrong>Prime-product consequence.\u003c/strong> If p is prime and p does not divide u, gcd(p,u)=1. Therefore p∣uv forces p∣v. Repeating this argument proves the finite-product version and supports prime-factorisation uniqueness.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P6 proves modular inverse uniqueness; P7 builds a product-divisibility lemma before CRT. A proof must preserve the coprimality assumptions throughout.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Replacing prime p by arbitrary composite d; confusing gcd(a,b)=1 with gcd(a,c)=1 in the first theorem; using ordinary cancellation without conditions.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> gcd(c,m)=1 and ac≡bc (mod m) ⇒ a≡b (mod m); p prime and p∣∏a_i ⇒ p∣a_i for some i.\u003c/p>\n\u003cp>Source: C4 pp. 52,54; T04 P6–7.\u003c/p>", "search": "\n\nWhat it means. If gcd(a,b)=1 and a∣bc, then a∣c. Coprimality prevents b from supplying any of a's required prime factors. In congruence form: ac≡bc (mod m) and gcd(c,m)=1 imply a≡b (mod m). For prime p, if p divides a product, p divides at least one factor.\n\nHow to use it. Identify the factor you want to cancel and the modulus/divisor against which it must be coprime. State that gcd condition. Convert the congruence to a divisibility statement if needed. Do not use the conclusion to justify its own hypothesis.\n\nWorked proof — lecture argument, explained. From gcd(a,b)=1, Bézout gives sa+tb=1. Multiplying by c yields sac+tbc=c. Both terms on the left are divisible by a if a∣bc, so a∣c. Now ac≡bc (mod m) says m∣c(a−b); with gcd(m,c)=1, cancellation yields m∣a−b.\n\nWorked example — analogous. From 5x≡5·8 (mod 12), gcd(5,12)=1 lets us conclude x≡8 (mod 12). From 6x≡6·8 (mod 12), the same conclusion is invalid: x=0 satisfies the displayed congruence but is not congruent to 8.\n\nPrime-product consequence. If p is prime and p does not divide u, gcd(p,u)=1. Therefore p∣uv forces p∣v. Repeating this argument proves the finite-product version and supports prime-factorisation uniqueness.\n\nQuiz 2 style. T04 P6 proves modular inverse uniqueness; P7 builds a product-divisibility lemma before CRT. A proof must preserve the coprimality assumptions throughout.\n\nCommon traps. Replacing prime p by arbitrary composite d; confusing gcd(a,b)=1 with gcd(a,c)=1 in the first theorem; using ordinary cancellation without conditions.\n\nCHEAT SHEET CANDIDATE: gcd(c,m)=1 and ac≡bc (mod m) ⇒ a≡b (mod m); p prime and p∣∏a_i ⇒ p∣a_i for some i.\n\nSource: C4 pp. 52,54; T04 P6–7.\n\n", "shortTitle": "Coprime cancellation and prime divisors of products", "part": "Part 4 — primes, gcd, Euclidean algorithm and Bézout"}, {"id": "N18", "title": "Fundamental theorem of arithmetic: existence and uniqueness proofs", "section": "Chapter 4, Section 4.3 — Primes and gcd", "chapter": "Chapter 4", "priority": "L2", "source": "C4 pp. 34,52–53; C5 p. 30; T04 P3 uses factorisation, not a full theorem proof", "ability": "Separate and reconstruct the existence and uniqueness arguments using their appropriate methods. Proof construction/completion", "prereq": "N09,N17; contradiction; I08 strong induction", "confusion": "Existence versus uniqueness; proof by strong induction versus contradiction", "visual": "T; cross-chapter linkage explicit in slides", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> Every integer n&gt;1 has a prime factorisation, unique when factors are written in nondecreasing order. There are two separate claims: at least one such product exists, and two different prime multisets cannot produce the same n. The first uses strong induction; the second uses the prime-product lemma.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> For existence, split the next integer into prime/composite cases. A composite splits into strictly smaller integers &gt;1, so the strong hypothesis applies to both. For uniqueness, suppose two prime products represent n and use a prime from one side to force a matching prime on the other, then cancel and repeat.\u003c/p>\n\u003cp>\u003cstrong>Worked existence proof — lecture argument, explained.\u003c/strong> Basis n=2 is prime. Assume every j with 2≤j≤k is a product of primes. If k+1 is prime, it already has the required representation. Otherwise k+1=ab with 2≤a,b≤k. By the hypothesis both a and b are prime products; multiplying their representations gives one for k+1. This establishes existence, not uniqueness.\u003c/p>\n\u003cp>\u003cstrong>Worked uniqueness proof — lecture argument, expanded.\u003c/strong> Suppose n=p_1...p_r=q_1...q_s. The prime p_1 divides the right-hand product, so p_1 divides some q_j by N17. Since q_j is prime, p_1=q_j. Cancel the equal factors in ordinary integer equality and repeat. If one side ran out of factors first, it would become 1 while the other remained a product of primes ≥2, impossible. Thus all factors match with the same multiplicities. Equivalently, after cancelling all common factors, any remaining prime would divide a different prime, a contradiction.\u003c/p>\n\u003cp>\u003cstrong>Worked application — analogous.\u003c/strong> The representations 180=2²·3²·5 and 180=2·3·2·5·3 differ only in order. They do not violate uniqueness. A proposed representation with a different exponent of 3 cannot be another prime factorisation of 180.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P3 uses the theorem in the gcd/lcm proof; the slides teach its two proof components. Do not treat an application as evidence of a guaranteed full-theorem question.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Inducting only on k when the factors may be much smaller; overlooking n=2; believing existence implies uniqueness; cancelling congruences as though they were the integer equalities used in this proof.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> existence: strong induction and prime/composite split. Uniqueness: prime divides product ⇒ matching prime; cancel and repeat.\u003c/p>\n\u003cp>Source: C4 pp. 34,52–53; C5 p. 30.\u003c/p>", "search": "\n\nWhat it means. Every integer n1 has a prime factorisation, unique when factors are written in nondecreasing order. There are two separate claims: at least one such product exists, and two different prime multisets cannot produce the same n. The first uses strong induction; the second uses the prime-product lemma.\n\nHow to use it. For existence, split the next integer into prime/composite cases. A composite splits into strictly smaller integers 1, so the strong hypothesis applies to both. For uniqueness, suppose two prime products represent n and use a prime from one side to force a matching prime on the other, then cancel and repeat.\n\nWorked existence proof — lecture argument, explained. Basis n=2 is prime. Assume every j with 2≤j≤k is a product of primes. If k+1 is prime, it already has the required representation. Otherwise k+1=ab with 2≤a,b≤k. By the hypothesis both a and b are prime products; multiplying their representations gives one for k+1. This establishes existence, not uniqueness.\n\nWorked uniqueness proof — lecture argument, expanded. Suppose n=p_1...p_r=q_1...q_s. The prime p_1 divides the right-hand product, so p_1 divides some q_j by N17. Since q_j is prime, p_1=q_j. Cancel the equal factors in ordinary integer equality and repeat. If one side ran out of factors first, it would become 1 while the other remained a product of primes ≥2, impossible. Thus all factors match with the same multiplicities. Equivalently, after cancelling all common factors, any remaining prime would divide a different prime, a contradiction.\n\nWorked application — analogous. The representations 180=2²·3²·5 and 180=2·3·2·5·3 differ only in order. They do not violate uniqueness. A proposed representation with a different exponent of 3 cannot be another prime factorisation of 180.\n\nQuiz 2 style. T04 P3 uses the theorem in the gcd/lcm proof; the slides teach its two proof components. Do not treat an application as evidence of a guaranteed full-theorem question.\n\nCommon traps. Inducting only on k when the factors may be much smaller; overlooking n=2; believing existence implies uniqueness; cancelling congruences as though they were the integer equalities used in this proof.\n\nCHEAT SHEET CANDIDATE: existence: strong induction and prime/composite split. Uniqueness: prime divides product ⇒ matching prime; cancel and repeat.\n\nSource: C4 pp. 34,52–53; C5 p. 30.\n\n", "shortTitle": "Fundamental theorem of arithmetic: existence versus uniqueness", "part": "Part 7 — strong induction and well-ordering"}, {"id": "N19", "title": "Modular inverse: definition, existence and uniqueness modulo m", "section": "Chapter 4, Section 4.4 — Solving congruences", "chapter": "Chapter 4", "priority": "L1", "source": "C4 pp. 57–60; T04 P5–6", "ability": "Find inverses using Bézout coefficients and prove modular uniqueness. Calculation, proof, theorem application", "prereq": "N14–17", "confusion": "Unique integer versus unique residue class; reciprocal versus modular inverse", "visual": "F pp. 57–60 for inverse bars and substitution; V T04 p. 1", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> An inverse of a modulo m&gt;1 is an integer u with au≡1 (mod m). When gcd(a,m)=1 it exists by Bézout. Conversely, au+mv=1 implies every common divisor of a,m divides 1, so an inverse requires gcd=1. “Unique modulo m” means one residue class, not one integer: u,u+m,u−m,... represent the same inverse.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Check gcd(a,m), run Euclid and back-substitute to obtain 1=sa+tm. Reduce s modulo m to obtain the standard inverse representative. Verify a·s mod m=1. If the gcd is not 1, the inverse method is unavailable; this package does not import a general non-coprime congruence-solving unit.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P5(a), inverse stage.\u003c/strong> For a=34,m=89:\u003c/p>\n\u003cp>89=2·34+21; 34=21+13; 21=13+8; 13=8+5; 8=5+3; 5=3+2; 3=2+1.\u003c/p>\n\u003cp>Back-substitution gives 1=3−2=2·3−5=2·8−3·5=5·8−3·13=5·21−8·13=13·21−8·34=13·89−34·34.\u003c/p>\n\u003cp>Thus u=−34≡55 (mod 89). Check 34·55=1870=21·89+1.\u003c/p>\n\u003cp>\u003cstrong>Worked proof — derived T04 P6.\u003c/strong> If u,v are inverses, au≡av≡1. Since gcd(a,m)=1, N17 cancels a and gives u≡v (mod m). This proves residue-class uniqueness while allowing infinitely many integer representatives.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P5 combines computation with a required method; P6 asks for proof. Both aspects matter.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Returning the coefficient of m instead of a; treating a negative coefficient as invalid; claiming the inverse is 1/a as a real number; confusing additive inverse with multiplicative inverse.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> 1=sa+tm ⇒ a^(−1)≡s (mod m); exists iff gcd(a,m)=1 for m&gt;1; inverse is unique modulo m.\u003c/p>\n\u003cp>Source: C4 pp. 57–60; T04 P5–6.\u003c/p>", "search": "\n\nWhat it means. An inverse of a modulo m1 is an integer u with au≡1 (mod m). When gcd(a,m)=1 it exists by Bézout. Conversely, au+mv=1 implies every common divisor of a,m divides 1, so an inverse requires gcd=1. “Unique modulo m” means one residue class, not one integer: u,u+m,u−m,... represent the same inverse.\n\nHow to use it. Check gcd(a,m), run Euclid and back-substitute to obtain 1=sa+tm. Reduce s modulo m to obtain the standard inverse representative. Verify a·s mod m=1. If the gcd is not 1, the inverse method is unavailable; this package does not import a general non-coprime congruence-solving unit.\n\nWorked example — derived T04 P5(a), inverse stage. For a=34,m=89:\n\n89=2·34+21; 34=21+13; 21=13+8; 13=8+5; 8=5+3; 5=3+2; 3=2+1.\n\nBack-substitution gives 1=3−2=2·3−5=2·8−3·5=5·8−3·13=5·21−8·13=13·21−8·34=13·89−34·34.\n\nThus u=−34≡55 (mod 89). Check 34·55=1870=21·89+1.\n\nWorked proof — derived T04 P6. If u,v are inverses, au≡av≡1. Since gcd(a,m)=1, N17 cancels a and gives u≡v (mod m). This proves residue-class uniqueness while allowing infinitely many integer representatives.\n\nQuiz 2 style. T04 P5 combines computation with a required method; P6 asks for proof. Both aspects matter.\n\nCommon traps. Returning the coefficient of m instead of a; treating a negative coefficient as invalid; claiming the inverse is 1/a as a real number; confusing additive inverse with multiplicative inverse.\n\nCHEAT SHEET CANDIDATE: 1=sa+tm ⇒ a^(−1)≡s (mod m); exists iff gcd(a,m)=1 for m1; inverse is unique modulo m.\n\nSource: C4 pp. 57–60; T04 P5–6.\n\na id=\"n20\"/a\n\n", "shortTitle": "Inverses: finding them and proving uniqueness", "part": "Part 5 — modular inverses and simultaneous congruences"}, {"id": "N20", "title": "Linear congruences solved by inverses; all integer solutions", "section": "Chapter 4, Section 4.4 — Solving congruences", "chapter": "Chapter 4", "priority": "L1", "source": "C4 pp. 57,61; T04 P5(a–c)", "ability": "Solve the supported coprime-coefficient cases, check the solution and state its congruence class. Calculation, multi-step application", "prereq": "N03–04,N19", "confusion": "One representative versus all solutions; inverse method versus unrestricted ordinary division", "visual": "F p. 61; tutorial V", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> A linear congruence ax≡b (mod m) asks for every integer x making m divide ax−b. For gcd(a,m)=1, multiplying by an inverse u gives x≡ub (mod m). This describes an entire congruence class, not just one solution.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Find/justify the inverse, multiply both sides, reduce to a representative r, and state x=r+km for k∈Z. A complete solution argument has two directions: any solution must have this residue, and every integer with this residue satisfies the original congruence.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P5(a), solution stage.\u003c/strong> N19 found 34^(−1)≡55 (mod 89). Therefore 34x≡77 implies x≡55·77=4235≡52 (mod 89), because 4235=47·89+52. Conversely, for x=52+89k,\u003c/p>\n\u003cp>34x−77=34·52−77+34·89k=1691+34·89k=89(19+34k).\u003c/p>\n\u003cp>Hence every such x is a solution. The full answer is x≡52 (mod 89), or x=52+89k, k∈Z.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> Solve 3x≡4 (mod 7). An inverse is −2≡5, so x≡−8≡6. Substitution gives 3·6=18≡4. Both 6 and −1 are solutions; reporting only x=6 would omit the rest unless a restricted range was requested.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P5 has three inverse-then-solve subparts. The evidence supports a multi-step computation with justified transformations.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Dividing b by a using decimal arithmetic; forgetting to reduce a negative product; proving only that one representative works; assuming every linear congruence has a unique residue solution without the gcd condition.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> gcd(a,m)=1 ⇒ ax≡b has x≡a^(−1)b (mod m); give the class and verify it in the original congruence.\u003c/p>\n\u003cp>Source: C4 pp. 57,61; T04 P5.\u003c/p>", "search": "\n\nWhat it means. A linear congruence ax≡b (mod m) asks for every integer x making m divide ax−b. For gcd(a,m)=1, multiplying by an inverse u gives x≡ub (mod m). This describes an entire congruence class, not just one solution.\n\nHow to use it. Find/justify the inverse, multiply both sides, reduce to a representative r, and state x=r+km for k∈Z. A complete solution argument has two directions: any solution must have this residue, and every integer with this residue satisfies the original congruence.\n\nWorked example — derived T04 P5(a), solution stage. N19 found 34^(−1)≡55 (mod 89). Therefore 34x≡77 implies x≡55·77=4235≡52 (mod 89), because 4235=47·89+52. Conversely, for x=52+89k,\n\n34x−77=34·52−77+34·89k=1691+34·89k=89(19+34k).\n\nHence every such x is a solution. The full answer is x≡52 (mod 89), or x=52+89k, k∈Z.\n\nWorked example — lecture example, explained. Solve 3x≡4 (mod 7). An inverse is −2≡5, so x≡−8≡6. Substitution gives 3·6=18≡4. Both 6 and −1 are solutions; reporting only x=6 would omit the rest unless a restricted range was requested.\n\nQuiz 2 style. T04 P5 has three inverse-then-solve subparts. The evidence supports a multi-step computation with justified transformations.\n\nCommon traps. Dividing b by a using decimal arithmetic; forgetting to reduce a negative product; proving only that one representative works; assuming every linear congruence has a unique residue solution without the gcd condition.\n\nCHEAT SHEET CANDIDATE: gcd(a,m)=1 ⇒ ax≡b has x≡a^(−1)b (mod m); give the class and verify it in the original congruence.\n\nSource: C4 pp. 57,61; T04 P5.\n\na id=\"n21\"/a\n\n", "shortTitle": "Solving a linear congruence by an inverse", "part": "Part 5 — modular inverses and simultaneous congruences"}, {"id": "N21", "title": "Chinese remainder theorem: hypotheses, construction and uniqueness", "section": "Chapter 4, Section 4.4 — Solving congruences", "chapter": "Chapter 4", "priority": "L1", "source": "C4 pp. 62–65; T04 P7–8", "ability": "Check pairwise coprimality; construct a simultaneous solution; complete uniqueness proof without circularity. Calculation, proof completion, theorem application", "prereq": "N14,N17,N19–20", "confusion": "Uniqueness modulo product versus unique integer; existence versus uniqueness", "visual": "F pp. 63–65 indexed formula; V T04 p. 1", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> For pairwise relatively prime moduli m_1,...,m_n&gt;1, a system x≡a_i (mod m_i) has exactly one residue-class solution modulo M=∏m_i. The a_i can be arbitrary integers. There are infinitely many integer solutions; only the residue modulo M is unique.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Check every pair of moduli. Set M_i=M/m_i, then find y_i with M_i y_i≡1 (mod m_i). Form x_0=Σa_i M_i y_i and reduce modulo M. For modulus m_k, every term except k contains m_k and vanishes; the remaining term equals a_k. This explains the construction and gives a way to check it.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> Solve x≡2 (mod 3), x≡3 (mod 5), x≡2 (mod 7). M=105 and (M_1,M_2,M_3)=(35,21,15). Their inverses in the respective moduli are 2,1,1. Thus x_0=2·35·2+3·21·1+2·15·1=233≡23 (mod 105). Check: 23 leaves remainders 2,3,2. Every solution is 23+105k.\u003c/p>\n\u003cp>\u003cstrong>Lemma and uniqueness — derived T04 P7–8.\u003c/strong> If pairwise coprime m_i each divide z, then their product divides z. For two factors, write z=m_1t. Since m_2∣m_1t and gcd(m_1,m_2)=1, m_2∣t, so m_1m_2∣z. Repeat: the next modulus is coprime to the product of the previous ones, because a common prime factor would contradict pairwise coprimality. This proves the lemma without CRT.\u003c/p>\n\u003cp>If x,y both solve the system, m_i∣x−y for every i. The lemma gives M∣x−y, so x≡y (mod M). Construction proved existence; this separate argument proves uniqueness. Using CRT to prove the lemma would be circular and is explicitly forbidden in T04 P7.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P8 explicitly requests proof completion. Prepare both the numerical construction and its uniqueness argument, not just a formula.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Checking only gcd of all moduli together; inverting m_i instead of M_i; reducing the final result modulo the wrong number; claiming a unique integer; circular proof.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> pairwise gcd=1; M=∏m_i; M_i=M/m_i; y_i=M_i^(−1) mod m_i; x≡Σa_iM_i y_i (mod M). Uniqueness: each m_i∣x−y ⇒ M∣x−y.\u003c/p>\n\u003cp>Source: C4 pp. 62–65; T04 P7–8.\u003c/p>", "search": "\n\nWhat it means. For pairwise relatively prime moduli m_1,...,m_n1, a system x≡a_i (mod m_i) has exactly one residue-class solution modulo M=∏m_i. The a_i can be arbitrary integers. There are infinitely many integer solutions; only the residue modulo M is unique.\n\nHow to use it. Check every pair of moduli. Set M_i=M/m_i, then find y_i with M_i y_i≡1 (mod m_i). Form x_0=Σa_i M_i y_i and reduce modulo M. For modulus m_k, every term except k contains m_k and vanishes; the remaining term equals a_k. This explains the construction and gives a way to check it.\n\nWorked example — lecture example, explained. Solve x≡2 (mod 3), x≡3 (mod 5), x≡2 (mod 7). M=105 and (M_1,M_2,M_3)=(35,21,15). Their inverses in the respective moduli are 2,1,1. Thus x_0=2·35·2+3·21·1+2·15·1=233≡23 (mod 105). Check: 23 leaves remainders 2,3,2. Every solution is 23+105k.\n\nLemma and uniqueness — derived T04 P7–8. If pairwise coprime m_i each divide z, then their product divides z. For two factors, write z=m_1t. Since m_2∣m_1t and gcd(m_1,m_2)=1, m_2∣t, so m_1m_2∣z. Repeat: the next modulus is coprime to the product of the previous ones, because a common prime factor would contradict pairwise coprimality. This proves the lemma without CRT.\n\nIf x,y both solve the system, m_i∣x−y for every i. The lemma gives M∣x−y, so x≡y (mod M). Construction proved existence; this separate argument proves uniqueness. Using CRT to prove the lemma would be circular and is explicitly forbidden in T04 P7.\n\nQuiz 2 style. T04 P8 explicitly requests proof completion. Prepare both the numerical construction and its uniqueness argument, not just a formula.\n\nCommon traps. Checking only gcd of all moduli together; inverting m_i instead of M_i; reducing the final result modulo the wrong number; claiming a unique integer; circular proof.\n\nCHEAT SHEET CANDIDATE: pairwise gcd=1; M=∏m_i; M_i=M/m_i; y_i=M_i^(−1) mod m_i; x≡Σa_iM_i y_i (mod M). Uniqueness: each m_i∣x−y ⇒ M∣x−y.\n\nSource: C4 pp. 62–65; T04 P7–8.\n\na id=\"n22\"/a\n\n", "shortTitle": "Chinese remainder theorem: construction and uniqueness", "part": "Part 5 — modular inverses and simultaneous congruences"}, {"id": "N22", "title": "Back-substitution for simultaneous congruences", "section": "Chapter 4, Section 4.4 — Solving congruences", "chapter": "Chapter 4", "priority": "L2", "source": "C4 pp. 66–67; T04 P7–8 related theorem context, no direct computation task", "ability": "Rewrite congruences as integer equalities and solve successive constraints. Algorithm, multi-step calculation", "prereq": "N03,N20", "confusion": "Congruence-system substitution versus Euclidean back-substitution", "visual": "F pp. 66–67", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> A congruence x≡a (mod m) can be rewritten x=a+mt with t∈Z. Substituting this into another congruence reduces a simultaneous system to a new congruence in t. Repeating accumulates the compatible restrictions. This is different from working backwards through Euclid&#x27;s equations.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Start with one congruence as an integer equality. Substitute into the next, solve for the new integer parameter using valid modular arithmetic, replace that parameter by its residue plus modulus×another parameter, and continue. At the end, express x as one residue plus the product modulus times an arbitrary integer; check all original conditions.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> For x≡1 (mod 5), x≡2 (mod 6), x≡3 (mod 7):\u003c/p>\n\u003cul>\u003cli>Write x=5t+1. The second condition gives 5t≡1 (mod 6), so t≡5, since 5 is its own inverse mod 6.\u003c/li>\u003cli>Put t=6u+5. Then x=30u+26.\u003c/li>\u003cli>The third condition gives 2u+5≡3 (mod 7), hence 2u≡5 and u≡6.\u003c/li>\u003cli>Put u=7v+6. Then x=210v+206, so x≡206 (mod 210).\u003c/li>\u003c/ul>\n\u003cp>Checking 206 gives remainders 1,2,3. The substitutions preserve all integer possibilities; the parameter v is not restricted to positive values.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> This method is explicitly in the lecture. The approved tutorials focus on CRT proof rather than a direct back-substitution calculation, so the demand is source-supported without a frequency claim.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Replacing x≡1 (mod 5) by x=1 only; forgetting that parameters are integers; confusing the current parameter&#x27;s modulus with x&#x27;s final modulus; using the CRT formula when a question specifically requires substitution.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> x≡a (mod m) ⇔ x=a+mt, t∈Z; substitute one condition at a time and preserve the arbitrary integer parameter.\u003c/p>\n\u003cp>Source: C4 pp. 66–67.\u003c/p>", "search": "\n\nWhat it means. A congruence x≡a (mod m) can be rewritten x=a+mt with t∈Z. Substituting this into another congruence reduces a simultaneous system to a new congruence in t. Repeating accumulates the compatible restrictions. This is different from working backwards through Euclid's equations.\n\nHow to use it. Start with one congruence as an integer equality. Substitute into the next, solve for the new integer parameter using valid modular arithmetic, replace that parameter by its residue plus modulus×another parameter, and continue. At the end, express x as one residue plus the product modulus times an arbitrary integer; check all original conditions.\n\nWorked example — lecture example, explained. For x≡1 (mod 5), x≡2 (mod 6), x≡3 (mod 7):\n\n1. Write x=5t+1. The second condition gives 5t≡1 (mod 6), so t≡5, since 5 is its own inverse mod 6.\n2. Put t=6u+5. Then x=30u+26.\n3. The third condition gives 2u+5≡3 (mod 7), hence 2u≡5 and u≡6.\n4. Put u=7v+6. Then x=210v+206, so x≡206 (mod 210).\n\nChecking 206 gives remainders 1,2,3. The substitutions preserve all integer possibilities; the parameter v is not restricted to positive values.\n\nQuiz 2 style. This method is explicitly in the lecture. The approved tutorials focus on CRT proof rather than a direct back-substitution calculation, so the demand is source-supported without a frequency claim.\n\nCommon traps. Replacing x≡1 (mod 5) by x=1 only; forgetting that parameters are integers; confusing the current parameter's modulus with x's final modulus; using the CRT formula when a question specifically requires substitution.\n\nCHEAT SHEET CANDIDATE: x≡a (mod m) ⇔ x=a+mt, t∈Z; substitute one condition at a time and preserve the arbitrary integer parameter.\n\nSource: C4 pp. 66–67.\n\n", "shortTitle": "Solving systems by back-substitution", "part": "Part 5 — modular inverses and simultaneous congruences"}, {"id": "N23", "title": "Fermat's little theorem and modular powers", "section": "Chapter 4, Section 4.4 — Solving congruences", "chapter": "Chapter 4", "priority": "L2", "source": "C4 pp. 68–69; —", "ability": "Check prime/coprimality hypotheses and apply the appropriate stated version to large powers. Theorem application, calculation", "prereq": "N03–04,N09; exponent laws", "confusion": "The two stated versions and their different restrictions; converse versus theorem", "visual": "F pp. 68–69 exponents", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> If p is prime and p does not divide a, then a^(p−1)≡1 (mod p). For every integer a, including multiples of p, a^p≡a (mod p). These are related versions with different restrictions. The first permits reducing a large exponent by multiples of p−1, provided the coprimality condition holds.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Check the modulus is prime. Reduce the base modulo p. If the base is 0, handle that directly rather than using the first version. Otherwise write the exponent N=q(p−1)+r, with 0≤r&lt;p−1, and replace a^N by a^r modulo p. Evaluate the smaller power and reduce. The theorem supplies the exponent reduction; congruence arithmetic alone does not license reducing every exponent modulo every modulus.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> To find 7^222 mod 11, note that 11 is prime and 11∤7. Since 222=22·10+2 and 7^10≡1, we get 7^222=(7^10)^22·7²≡49≡5 (mod 11).\u003c/p>\n\u003cp>\u003cstrong>Worked variation — analogous.\u003c/strong> For 13^100 mod 13 the answer is 0 because the base is divisible by 13. Writing 100=8·12+4 still happens to leave a positive exponent here, but the unsafe method is exposed by 13^12: reducing the exponent to 0 would give 1, while the true remainder is 0. Always check the hypothesis first. The all-integer version correctly says 13^13≡13≡0 (mod 13).\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> The lecture supports theorem application and calculations with large powers. There is no direct approved tutorial problem devoted to Fermat&#x27;s theorem, so no frequency or mark claim is made.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Using a composite modulus; reducing the exponent mod p rather than p−1; missing p∤a; interpreting the converse as true—passing a Fermat congruence need not prove primality.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> p prime, p∤a ⇒ a^(p−1)≡1; all a ⇒ a^p≡a; exponent reduction requires the first version&#x27;s hypotheses.\u003c/p>\n\u003cp>Source: C4 pp. 68–69.\u003c/p>", "search": "\n\nWhat it means. If p is prime and p does not divide a, then a^(p−1)≡1 (mod p). For every integer a, including multiples of p, a^p≡a (mod p). These are related versions with different restrictions. The first permits reducing a large exponent by multiples of p−1, provided the coprimality condition holds.\n\nHow to use it. Check the modulus is prime. Reduce the base modulo p. If the base is 0, handle that directly rather than using the first version. Otherwise write the exponent N=q(p−1)+r, with 0≤rp−1, and replace a^N by a^r modulo p. Evaluate the smaller power and reduce. The theorem supplies the exponent reduction; congruence arithmetic alone does not license reducing every exponent modulo every modulus.\n\nWorked example — lecture example, explained. To find 7^222 mod 11, note that 11 is prime and 11∤7. Since 222=22·10+2 and 7^10≡1, we get 7^222=(7^10)^22·7²≡49≡5 (mod 11).\n\nWorked variation — analogous. For 13^100 mod 13 the answer is 0 because the base is divisible by 13. Writing 100=8·12+4 still happens to leave a positive exponent here, but the unsafe method is exposed by 13^12: reducing the exponent to 0 would give 1, while the true remainder is 0. Always check the hypothesis first. The all-integer version correctly says 13^13≡13≡0 (mod 13).\n\nQuiz 2 style. The lecture supports theorem application and calculations with large powers. There is no direct approved tutorial problem devoted to Fermat's theorem, so no frequency or mark claim is made.\n\nCommon traps. Using a composite modulus; reducing the exponent mod p rather than p−1; missing p∤a; interpreting the converse as true—passing a Fermat congruence need not prove primality.\n\nCHEAT SHEET CANDIDATE: p prime, p∤a ⇒ a^(p−1)≡1; all a ⇒ a^p≡a; exponent reduction requires the first version's hypotheses.\n\nSource: C4 pp. 68–69.\n\na id=\"n25\"/a\n\n", "shortTitle": "Fermat's little theorem and large powers", "part": "Part 10 — remaining Level 2 theory and applications"}, {"id": "N24", "title": "Pseudoprimes and limitations of Fermat-style tests", "section": "Chapter 4, Section 4.4 — Solving congruences", "chapter": "Chapter 4", "priority": "L3", "source": "C4 pp. 70–71; —", "ability": "Recognise composite numbers passing the congruence and interpret test outcomes under valid conditions. Definition, justification", "prereq": "N23", "confusion": "Passing a test versus proving primality; testing base versus modulus", "visual": "F pp. 70–71; Q missing qualifications on p. 71", "confidence": "CONFIRMED / L3", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> A composite integer n satisfying b^(n−1)≡1 (mod n) is a pseudoprime to base b. It imitates one necessary property of primes without actually being prime. The base matters: passing one base&#x27;s test does not establish a universal property or guarantee passing every base.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> For the base-2 test use n&gt;2, as in the preceding lecture slide. If the congruence fails, n is composite by the contrapositive of Fermat&#x27;s theorem. If it passes, n is either prime or a base-2 pseudoprime; another argument is needed. For a general base, use an admissible base coprime to the candidate when applying Fermat&#x27;s contrapositive. If a nontrivial gcd with the base is found, that is separate compositeness evidence for a candidate larger than that divisor.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture number, derived verification.\u003c/strong> 341=11·31 is composite. But 2^10=1024=3·341+1, so 2^340=(2^10)^34≡1 (mod 341). Thus it is a base-2 pseudoprime. The factorisation proves composite; the congruence proves it passes this test. Both are necessary to establish the definition.\u003c/p>\n\u003cp>\u003cstrong>Worked example — analogous.\u003c/strong> For n=15, 2^4≡1 (mod 15), so 2^14=(2^4)^3·2²≡4, not 1. The failed test proves 15 composite because a prime &gt;2 would pass. It does not supply a factorisation by itself, although here 15=3·5 is easy to find.\u003c/p>\n\u003cp>\u003cstrong>Source qualification.\u003c/strong> C4 p. 71 abbreviates the test as applying to a “positive integer” and omits n&gt;2 from p. 70. Without that restriction, prime 2 itself fails 2^(2−1)≡1 (mod 2). Therefore the unrestricted prose is false; retain the preceding hypothesis. More bases provide evidence, not an automatic deterministic guarantee from the limited facts supplied here.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> Definition application, checking an example and explaining why the converse of Fermat is false are lecture-supported. No advanced primality-test algorithm is added.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Calling a passing number prime; calling a prime a pseudoprime; forgetting to prove compositeness; treating the base as irrelevant; applying the base-2 failure implication to n=2.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> composite + passes Fermat congruence = pseudoprime to that base. For n&gt;2, base-2 failure ⇒ composite; passage does not ⇒ prime.\u003c/p>\n\u003cp>Source: C4 pp. 70–71, with conditions reconciled to pp. 68,70.\u003c/p>", "search": "\n\nWhat it means. A composite integer n satisfying b^(n−1)≡1 (mod n) is a pseudoprime to base b. It imitates one necessary property of primes without actually being prime. The base matters: passing one base's test does not establish a universal property or guarantee passing every base.\n\nHow to use it. For the base-2 test use n2, as in the preceding lecture slide. If the congruence fails, n is composite by the contrapositive of Fermat's theorem. If it passes, n is either prime or a base-2 pseudoprime; another argument is needed. For a general base, use an admissible base coprime to the candidate when applying Fermat's contrapositive. If a nontrivial gcd with the base is found, that is separate compositeness evidence for a candidate larger than that divisor.\n\nWorked example — lecture number, derived verification. 341=11·31 is composite. But 2^10=1024=3·341+1, so 2^340=(2^10)^34≡1 (mod 341). Thus it is a base-2 pseudoprime. The factorisation proves composite; the congruence proves it passes this test. Both are necessary to establish the definition.\n\nWorked example — analogous. For n=15, 2^4≡1 (mod 15), so 2^14=(2^4)^3·2²≡4, not 1. The failed test proves 15 composite because a prime 2 would pass. It does not supply a factorisation by itself, although here 15=3·5 is easy to find.\n\nSource qualification. C4 p. 71 abbreviates the test as applying to a “positive integer” and omits n2 from p. 70. Without that restriction, prime 2 itself fails 2^(2−1)≡1 (mod 2). Therefore the unrestricted prose is false; retain the preceding hypothesis. More bases provide evidence, not an automatic deterministic guarantee from the limited facts supplied here.\n\nQuiz 2 style. Definition application, checking an example and explaining why the converse of Fermat is false are lecture-supported. No advanced primality-test algorithm is added.\n\nCommon traps. Calling a passing number prime; calling a prime a pseudoprime; forgetting to prove compositeness; treating the base as irrelevant; applying the base-2 failure implication to n=2.\n\nCHEAT SHEET CANDIDATE: composite + passes Fermat congruence = pseudoprime to that base. For n2, base-2 failure ⇒ composite; passage does not ⇒ prime.\n\nSource: C4 pp. 70–71, with conditions reconciled to pp. 68,70.\n\na id=\"r03\"/a\n\n", "shortTitle": "Pseudoprimes and the limits of Fermat tests", "part": "Part 11 — Level 3 material"}, {"id": "N25", "title": "Primitive roots modulo a prime", "section": "Chapter 4, Section 4.4 — Solving congruences", "chapter": "Chapter 4", "priority": "L2", "source": "C4 p. 72; —", "ability": "Determine from modular powers whether all nonzero residues are generated; state existence fact. Definition, calculation, theorem application", "prereq": "N03–04,N09", "confusion": "Primitive root versus arbitrary nonzero residue or modular inverse", "visual": "F p. 72 power list", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> A primitive root r modulo prime p is a residue whose powers produce every nonzero element of Z_p. Being nonzero or having an inverse is not enough; the powers must cover all p−1 nonzero residues. The lecture states that every prime modulus has a primitive root; no proof of that existence theorem is supplied here.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> For a small prime, compute r,r²,... modulo p by multiplying the previous remainder by r. Record the residues until 1 returns. A return to 1 means the pattern repeats. If the first cycle contains all p−1 nonzero residues, r is primitive; if the cycle is shorter, it is not. This is a finite computation grounded in the definition, not an imported advanced algorithm.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> Modulo 11, the powers of 2 for exponents 1 through 10 are 2,4,8,5,10,9,7,3,6,1. Every nonzero residue appears, so 2 is primitive. For example the transition 8→5 is 8·2=16≡5, and 10→9 is 10·2=20≡9; reducing each step keeps the table manageable.\u003c/p>\n\u003cp>By contrast powers of 3 are 3,9,5,4,1, then repeat. Residues 2,6,7,8,10 are absent. Thus 3 is not primitive mod 11 even though gcd(3,11)=1 and 3 has a multiplicative inverse.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> Definition application, modular calculation and justification from a power list are supported by the lecture. No direct scoped tutorial task establishes additional emphasis.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Seeing several different powers and stopping before demonstrating coverage; forgetting that 0 is not required; confusing an ordinary root of an equation with a primitive root; assuming every nonzero residue is primitive for prime modulus.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> r primitive mod prime p ⇔ its powers cover all p−1 nonzero residues; calculate a modular power cycle and check coverage.\u003c/p>\n\u003cp>Source: C4 p. 72.\u003c/p>", "search": "\n\nWhat it means. A primitive root r modulo prime p is a residue whose powers produce every nonzero element of Z_p. Being nonzero or having an inverse is not enough; the powers must cover all p−1 nonzero residues. The lecture states that every prime modulus has a primitive root; no proof of that existence theorem is supplied here.\n\nHow to use it. For a small prime, compute r,r²,... modulo p by multiplying the previous remainder by r. Record the residues until 1 returns. A return to 1 means the pattern repeats. If the first cycle contains all p−1 nonzero residues, r is primitive; if the cycle is shorter, it is not. This is a finite computation grounded in the definition, not an imported advanced algorithm.\n\nWorked example — lecture example, explained. Modulo 11, the powers of 2 for exponents 1 through 10 are 2,4,8,5,10,9,7,3,6,1. Every nonzero residue appears, so 2 is primitive. For example the transition 8→5 is 8·2=16≡5, and 10→9 is 10·2=20≡9; reducing each step keeps the table manageable.\n\nBy contrast powers of 3 are 3,9,5,4,1, then repeat. Residues 2,6,7,8,10 are absent. Thus 3 is not primitive mod 11 even though gcd(3,11)=1 and 3 has a multiplicative inverse.\n\nQuiz 2 style. Definition application, modular calculation and justification from a power list are supported by the lecture. No direct scoped tutorial task establishes additional emphasis.\n\nCommon traps. Seeing several different powers and stopping before demonstrating coverage; forgetting that 0 is not required; confusing an ordinary root of an equation with a primitive root; assuming every nonzero residue is primitive for prime modulus.\n\nCHEAT SHEET CANDIDATE: r primitive mod prime p ⇔ its powers cover all p−1 nonzero residues; calculate a modular power cycle and check coverage.\n\nSource: C4 p. 72.\n\na id=\"n26\"/a\n\n", "shortTitle": "Primitive roots modulo a prime", "part": "Part 10 — remaining Level 2 theory and applications"}, {"id": "N26", "title": "Discrete logarithms and the course exponent convention", "section": "Chapter 4, Section 4.4 — Solving congruences", "chapter": "Chapter 4", "priority": "L2", "source": "C4 pp. 73–74; —", "ability": "Find an exponent from the modular power list and apply the stated range 1 through p−1. Definition, calculation", "prereq": "N25", "confusion": "Discrete logarithm versus ordinary real logarithm; range-restricted uniqueness versus unrestricted exponents", "visual": "F pp. 73–74; preserve the course range", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> With prime p and primitive root r, the discrete logarithm of nonzero a∈Z_p is the exponent e such that r^e≡a (mod p), using the course&#x27;s range \u003cstrong>1≤e≤p−1\u003c/strong>. The modulus may be omitted from the notation log_r a in the slides, but it must be understood. This is not the real-valued logarithm on a calculator.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Establish the modulus and primitive root. Build or use the modular power table. Find where a occurs and return the exponent in the stated range. Verify by modular exponentiation. Do not assume an arbitrary base reaches every a; the primitive-root hypothesis ensures it does.\u003c/p>\n\u003cp>\u003cstrong>Worked examples — lecture examples, explained.\u003c/strong> In the powers-of-2 table modulo 11, exponent 8 gives residue 3, so log_2 3=8 in this modular setting. Exponent 4 gives residue 5, so log_2 5=4. The table&#x27;s exponent 10 gives 1, so under this course convention log_2 1=10 modulo 11, not 0. Both exponents 0 and 10 give residue 1, but only 10 lies in 1,...,10.\u003c/p>\n\u003cp>\u003cstrong>Why the range matters.\u003c/strong> Multiplying by 2^10≡1 repeats the powers. Thus unrestricted exponents are not unique: 2^8 and 2^18 give the same residue modulo 11. The uniqueness statement is about the representative exponent in the defined range. This parallels modular inverse uniqueness: representative conventions matter.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> The lectures directly support lookup/calculation and definition use. No general discrete-log-solving algorithm or cryptography topic is imported. The slide&#x27;s computational-difficulty comment is contextual, not a procedure needed for these small examples.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Using decimal logarithms; forgetting the modulus; returning exponent 0 for residue 1 under this particular convention; using a non-primitive base and expecting every residue to appear.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> r^e≡a (mod p), p prime, r primitive, 1≤a≤p−1, \u003cstrong>1≤e≤p−1\u003c/strong>; read e from the modular power table.\u003c/p>\n\u003cp>Source: C4 pp. 73–74.\u003c/p>", "search": "\n\nWhat it means. With prime p and primitive root r, the discrete logarithm of nonzero a∈Z_p is the exponent e such that r^e≡a (mod p), using the course's range 1≤e≤p−1. The modulus may be omitted from the notation log_r a in the slides, but it must be understood. This is not the real-valued logarithm on a calculator.\n\nHow to use it. Establish the modulus and primitive root. Build or use the modular power table. Find where a occurs and return the exponent in the stated range. Verify by modular exponentiation. Do not assume an arbitrary base reaches every a; the primitive-root hypothesis ensures it does.\n\nWorked examples — lecture examples, explained. In the powers-of-2 table modulo 11, exponent 8 gives residue 3, so log_2 3=8 in this modular setting. Exponent 4 gives residue 5, so log_2 5=4. The table's exponent 10 gives 1, so under this course convention log_2 1=10 modulo 11, not 0. Both exponents 0 and 10 give residue 1, but only 10 lies in 1,...,10.\n\nWhy the range matters. Multiplying by 2^10≡1 repeats the powers. Thus unrestricted exponents are not unique: 2^8 and 2^18 give the same residue modulo 11. The uniqueness statement is about the representative exponent in the defined range. This parallels modular inverse uniqueness: representative conventions matter.\n\nQuiz 2 style. The lectures directly support lookup/calculation and definition use. No general discrete-log-solving algorithm or cryptography topic is imported. The slide's computational-difficulty comment is contextual, not a procedure needed for these small examples.\n\nCommon traps. Using decimal logarithms; forgetting the modulus; returning exponent 0 for residue 1 under this particular convention; using a non-primitive base and expecting every residue to appear.\n\nCHEAT SHEET CANDIDATE: r^e≡a (mod p), p prime, r primitive, 1≤a≤p−1, 1≤e≤p−1; read e from the modular power table.\n\nSource: C4 pp. 73–74.\n\na id=\"i05\"/a\n\n", "shortTitle": "Discrete logarithms", "part": "Part 10 — remaining Level 2 theory and applications"}, {"id": "I01", "title": "Induction principle, hypothesis, basis and valid starting index", "section": "Chapter 5, Section 5.1 — Mathematical induction", "chapter": "Chapter 5", "priority": "L1", "source": "C5 pp. 5–9,22–23; T04 P9–13,16", "ability": "State and organise a valid induction proof, select its domain and show the transition. Proof construction/completion", "prereq": "Implication; universal statements; integer indexing", "confusion": "Assuming P(k) conditionally versus assuming the entire conclusion; first true case versus a valid continuing step", "visual": "T core text; F p. 5,9 illustrations", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> To prove P(n) for every integer n≥b, prove P(b), then prove that P(k) implies P(k+1) for an arbitrary k≥b. The basis starts the chain; the implication carries truth to the next integer. The inspected ladder/domino pictures show these separate requirements: reaching a rung/knocking one domino does not by itself establish the next-step rule, and a next-step rule does nothing without a starting case.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Write P(n) precisely, including its domain. Check the correct base. State “Assume P(k) for an arbitrary integer k≥b.” Write the target P(k+1), then derive it using that hypothesis. End by invoking induction for every n≥b. You are assuming one case conditionally, not assuming all cases or assuming the target.\u003c/p>\n\u003cp>\u003cstrong>Worked example — analogous.\u003c/strong> Prove 1+3+...+(2n−1)=n² for n≥1. Basis: at n=1, 1=1². Hypothesis: for an arbitrary k≥1, Σ_(j=1)^k(2j−1)=k². Then the sum through k+1 equals k²+[2(k+1)−1]=k²+2k+1=(k+1)². This is exactly P(k+1), so induction proves the statement. The proof succeeds because we expose a copy of the expression controlled by the hypothesis and then account for the extra term.\u003c/p>\n\u003cp>\u003cstrong>Full-reasoning checklist.\u003c/strong> A correct calculation of P(k+1) without a base is not a complete induction proof. A base and a restatement of the target are also insufficient. Explain where the hypothesis is used and why all values in the claimed range are covered.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P9–13,16 exercise induction in different domains, sometimes specifying the method. The template is a framework, not a substitute for the decisive algebra or construction.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Using n and k inconsistently; assuming P(k+1); proving only a numerical case; starting at 1 when the claim starts at 0 or a later threshold; failing to check that the step works at its earliest k.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> state P(n)/domain → basis P(b) → assume P(k), k≥b → derive P(k+1) → conclude by induction.\u003c/p>\n\u003cp>Source: C5 pp. 5–9,22–23; T04 induction problems.\u003c/p>", "search": "\n\nWhat it means. To prove P(n) for every integer n≥b, prove P(b), then prove that P(k) implies P(k+1) for an arbitrary k≥b. The basis starts the chain; the implication carries truth to the next integer. The inspected ladder/domino pictures show these separate requirements: reaching a rung/knocking one domino does not by itself establish the next-step rule, and a next-step rule does nothing without a starting case.\n\nHow to use it. Write P(n) precisely, including its domain. Check the correct base. State “Assume P(k) for an arbitrary integer k≥b.” Write the target P(k+1), then derive it using that hypothesis. End by invoking induction for every n≥b. You are assuming one case conditionally, not assuming all cases or assuming the target.\n\nWorked example — analogous. Prove 1+3+...+(2n−1)=n² for n≥1. Basis: at n=1, 1=1². Hypothesis: for an arbitrary k≥1, Σ_(j=1)^k(2j−1)=k². Then the sum through k+1 equals k²+[2(k+1)−1]=k²+2k+1=(k+1)². This is exactly P(k+1), so induction proves the statement. The proof succeeds because we expose a copy of the expression controlled by the hypothesis and then account for the extra term.\n\nFull-reasoning checklist. A correct calculation of P(k+1) without a base is not a complete induction proof. A base and a restatement of the target are also insufficient. Explain where the hypothesis is used and why all values in the claimed range are covered.\n\nQuiz 2 style. T04 P9–13,16 exercise induction in different domains, sometimes specifying the method. The template is a framework, not a substitute for the decisive algebra or construction.\n\nCommon traps. Using n and k inconsistently; assuming P(k+1); proving only a numerical case; starting at 1 when the claim starts at 0 or a later threshold; failing to check that the step works at its earliest k.\n\nCHEAT SHEET CANDIDATE: state P(n)/domain → basis P(b) → assume P(k), k≥b → derive P(k+1) → conclude by induction.\n\nSource: C5 pp. 5–9,22–23; T04 induction problems.\n\na id=\"i02\"/a\n\n", "shortTitle": "The induction principle and proof structure", "part": "Part 6 — ordinary mathematical induction"}, {"id": "I02", "title": "Summation identities, conjecture then proof, fixed-parameter induction", "section": "Chapter 5, Section 5.1 — Mathematical induction", "chapter": "Chapter 5", "priority": "L1", "source": "C5 pp. 10–11,22–23; T04 P11,16", "ability": "Prove identities, isolate the next term and hold a parameter fixed when instructed. Proof, algebraic calculation", "prereq": "I01; sums/products; exponent/fraction algebra", "confusion": "Induction variable versus fixed parameter; checking examples versus proof", "visual": "V T04 p. 2; F C5 pp. 10–11", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> A finite-sum identity often has a built-in next-step decomposition: sum through k+1 = sum through k + next term. Induction replaces the first part by its hypothesised formula. A second letter may be a fixed parameter; it need not be another induction variable.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Write the new term correctly, substitute the hypothesis only for the old sum and simplify toward the target expression. For a parameterised identity, say “fix an arbitrary positive integer r” before inducting on n. Because r was arbitrary, the completed proof holds for every permitted r.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> To prove Σ_(i=1)^n i=n(n+1)/2: base n=1 holds. Assuming the formula at k, the next sum is k(k+1)/2+(k+1)=(k+1)(k+2)/2. Factor the shared (k+1) before expanding; this makes the target visible.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P11.\u003c/strong> Let S_n=Σ_(j=0)^n(−1/2)^j. The claimed formula is [2^(n+1)+(−1)^n]/(3·2^n). At n=0 it is 3/3=1. Assuming it at k,\u003c/p>\n\u003cp>S_(k+1)=[2^(k+1)+(−1)^k]/(3·2^k)+(−1)^(k+1)/2^(k+1)\u003c/p>\n\u003cp>=[2^(k+2)+2(−1)^k+3(−1)^(k+1)]/(3·2^(k+1))\u003c/p>\n\u003cp>=[2^(k+2)+(−1)^(k+1)]/(3·2^(k+1)).\u003c/p>\n\u003cp>The last step uses (−1)^(k+1)=−(−1)^k. This is the required next formula.\u003c/p>\n\u003cp>\u003cstrong>Parameter example — derived T04 P16, using r for the problem&#x27;s fixed k.\u003c/strong> Prove Σ_(j=1)^n j(j+1)...(j+r−1)=n(n+1)...(n+r)/(r+1). At n=1, both sides equal r!. At n+1, factor B=(n+1)...(n+r) from the old formula and new term: nB/(r+1)+B=(n+r+1)B/(r+1), exactly the next formula. The argument is valid for each fixed positive r, including r=1.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P11 and P16 support sum proofs with signs, fractions and a fixed parameter. A direct geometric-series calculation may establish the equality, but use induction when the question requires it.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Adding term k instead of k+1; changing the fixed parameter during the step; missing the n+1 terms in a sum beginning at 0; uncontrolled fraction manipulation.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> isolate the new summand; hold parameters fixed; factor shared products before expanding.\u003c/p>\n\u003cp>Source: C5 pp. 10–11,22–23; T04 P11,16.\u003c/p>", "search": "\n\nWhat it means. A finite-sum identity often has a built-in next-step decomposition: sum through k+1 = sum through k + next term. Induction replaces the first part by its hypothesised formula. A second letter may be a fixed parameter; it need not be another induction variable.\n\nHow to use it. Write the new term correctly, substitute the hypothesis only for the old sum and simplify toward the target expression. For a parameterised identity, say “fix an arbitrary positive integer r” before inducting on n. Because r was arbitrary, the completed proof holds for every permitted r.\n\nWorked example — lecture example, explained. To prove Σ_(i=1)^n i=n(n+1)/2: base n=1 holds. Assuming the formula at k, the next sum is k(k+1)/2+(k+1)=(k+1)(k+2)/2. Factor the shared (k+1) before expanding; this makes the target visible.\n\nWorked example — derived T04 P11. Let S_n=Σ_(j=0)^n(−1/2)^j. The claimed formula is [2^(n+1)+(−1)^n]/(3·2^n). At n=0 it is 3/3=1. Assuming it at k,\n\nS_(k+1)=[2^(k+1)+(−1)^k]/(3·2^k)+(−1)^(k+1)/2^(k+1)\n\n=[2^(k+2)+2(−1)^k+3(−1)^(k+1)]/(3·2^(k+1))\n\n=[2^(k+2)+(−1)^(k+1)]/(3·2^(k+1)).\n\nThe last step uses (−1)^(k+1)=−(−1)^k. This is the required next formula.\n\nParameter example — derived T04 P16, using r for the problem's fixed k. Prove Σ_(j=1)^n j(j+1)...(j+r−1)=n(n+1)...(n+r)/(r+1). At n=1, both sides equal r!. At n+1, factor B=(n+1)...(n+r) from the old formula and new term: nB/(r+1)+B=(n+r+1)B/(r+1), exactly the next formula. The argument is valid for each fixed positive r, including r=1.\n\nQuiz 2 style. T04 P11 and P16 support sum proofs with signs, fractions and a fixed parameter. A direct geometric-series calculation may establish the equality, but use induction when the question requires it.\n\nCommon traps. Adding term k instead of k+1; changing the fixed parameter during the step; missing the n+1 terms in a sum beginning at 0; uncontrolled fraction manipulation.\n\nCHEAT SHEET CANDIDATE: isolate the new summand; hold parameters fixed; factor shared products before expanding.\n\nSource: C5 pp. 10–11,22–23; T04 P11,16.\n\na id=\"i03\"/a\n\n", "shortTitle": "Induction for sums and fixed parameters", "part": "Part 6 — ordinary mathematical induction"}, {"id": "I03", "title": "Inequalities and locating valid ranges", "section": "Chapter 5, Section 5.1 — Mathematical induction", "chapter": "Chapter 5", "priority": "L1", "source": "C5 pp. 12–13; T04 P12", "ability": "Determine relevant small cases/range and justify inequalities through induction. Proof, boundary analysis", "prereq": "I01; factorials; inequalities", "confusion": "A true base case versus a valid whole range; strict versus non-strict inequality", "visual": "V tutorial p. 2; F C5 pp. 12–13", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> An induction inequality may fail at small values yet hold from a threshold onward. Determining all valid n requires checking the small cases as well as proving the eventual range. Inequality chains need each comparison justified; the hypothesis alone does not automatically imply the next case.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Evaluate small cases to identify a candidate starting point. In the step, rewrite the next expression using the previous one, apply the hypothesis, then establish any extra comparison using k&#x27;s lower bound. Keep strict and non-strict inequalities distinct.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> Prove 2^n&lt;n! for n≥4. Basis 16&lt;24. If 2^k&lt;k! and k≥4, then 2^(k+1)=2·2^k&lt;2k!&lt;(k+1)k!=(k+1)!, since k+1&gt;2. The multiplier comparison is essential.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P12.\u003c/strong> For nonnegative n, n²≤n! holds at 0 and 1, fails at 2 and 3, and holds at 4. For k≥4, assuming k²≤k!, we have\u003c/p>\n\u003cp>(k+1)²≤(k+1)k²≤(k+1)k!=(k+1)!,\u003c/p>\n\u003cp>because k+1≤k². Therefore the complete solution set is n=0,1 or n≥4. Starting an induction at 0 would fail to bridge the false cases 2 and 3.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P12 asks “for which” values and then a proof. Give the exceptional small cases and the proved infinite range, not only a sufficient threshold.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Multiplying by an expression of unknown sign; reversing inequalities accidentally; finding a true base before a false gap; assuming the target inequality in a middle line; proving only that sufficiently large values work.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> check small n; choose a range where the step works; justify every inequality with hypothesis or domain; list exceptional cases separately.\u003c/p>\n\u003cp>Source: C5 pp. 12–13; T04 P12.\u003c/p>", "search": "\n\nWhat it means. An induction inequality may fail at small values yet hold from a threshold onward. Determining all valid n requires checking the small cases as well as proving the eventual range. Inequality chains need each comparison justified; the hypothesis alone does not automatically imply the next case.\n\nHow to use it. Evaluate small cases to identify a candidate starting point. In the step, rewrite the next expression using the previous one, apply the hypothesis, then establish any extra comparison using k's lower bound. Keep strict and non-strict inequalities distinct.\n\nWorked example — lecture example, explained. Prove 2^nn! for n≥4. Basis 1624. If 2^kk! and k≥4, then 2^(k+1)=2·2^k2k!(k+1)k!=(k+1)!, since k+12. The multiplier comparison is essential.\n\nWorked example — derived T04 P12. For nonnegative n, n²≤n! holds at 0 and 1, fails at 2 and 3, and holds at 4. For k≥4, assuming k²≤k!, we have\n\n(k+1)²≤(k+1)k²≤(k+1)k!=(k+1)!,\n\nbecause k+1≤k². Therefore the complete solution set is n=0,1 or n≥4. Starting an induction at 0 would fail to bridge the false cases 2 and 3.\n\nQuiz 2 style. T04 P12 asks “for which” values and then a proof. Give the exceptional small cases and the proved infinite range, not only a sufficient threshold.\n\nCommon traps. Multiplying by an expression of unknown sign; reversing inequalities accidentally; finding a true base before a false gap; assuming the target inequality in a middle line; proving only that sufficiently large values work.\n\nCHEAT SHEET CANDIDATE: check small n; choose a range where the step works; justify every inequality with hypothesis or domain; list exceptional cases separately.\n\nSource: C5 pp. 12–13; T04 P12.\n\na id=\"i04\"/a\n\n", "shortTitle": "Inequalities and valid starting ranges", "part": "Part 6 — ordinary mathematical induction"}, {"id": "I04", "title": "Divisibility by induction", "section": "Chapter 5, Section 5.1 — Mathematical induction", "chapter": "Chapter 5", "priority": "L1", "source": "C5 p. 14; T04 P9(a–c),10", "ability": "Use an inductive hypothesis inside integer/divisibility reasoning. Proof, theorem application", "prereq": "I01,N01,N04; powers", "confusion": "Algebraic equality versus divisibility conclusion; exponent nesting", "visual": "V T04 p. 1, including nested exponent in P9(c); F C5 p. 14", "confidence": "CONFIRMED / L1", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> A statement d∣F(n) can be proved inductively by expressing F(k+1) as a multiple of F(k) plus another visibly d-divisible term. When the divisor depends on n, track its change as well as the expression&#x27;s change.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Check the base. Assume F(k)=d·t for an integer t, or retain the divisibility notation. Rearrange F(k+1) to expose F(k). Finish by using divisibility of sums/products. Avoid reducing exponents using unproved rules.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P9(a), checked again at enlarged resolution.\u003c/strong> Show 6∣4^n+7^n+1 for n≥1. The exponent n applies to both 4 and 7. At n=1, 4+7+1=12. Let F(k)=4^k+7^k+1 and assume 6∣F(k). Then\u003c/p>\n\u003cp>F(k+1)=F(k)+3·4^k+6·7^k.\u003c/p>\n\u003cp>The old expression is divisible by 6 by the hypothesis; 3·4^k is divisible by 6 because k≥1 makes 4^k even; 6·7^k is visibly divisible by 6. Therefore 6∣F(k+1). The lower bound k≥1 is used in the argument, not decorative.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> Show 3∣n³−n for n≥1. Basis: 1³−1=0. The next expression is (k+1)³−(k+1)=(k³−k)+3(k²+k), whose two terms are divisible by 3. This completes the step.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P9(b).\u003c/strong> For n≥0, show 2∣n²−n. Basis n=0 is 0. The difference [(k+1)²−(k+1)]−(k²−k)=2k is divisible by 2, so the hypothesis propagates.\u003c/p>\n\u003cp>\u003cstrong>Worked example — derived T04 P9(c), verified nested exponent.\u003c/strong> Show 2^(n+2)∣3^(2^n)−1 for n≥1. At n=1, 3²−1=8. Assume 3^(2^k)−1=2^(k+2)t. Then\u003c/p>\n\u003cp>3^(2^(k+1))−1=[3^(2^k)−1][3^(2^k)+1].\u003c/p>\n\u003cp>The first factor supplies 2^(k+2); the second is even because 3^(2^k) is odd. Their product is divisible by 2^(k+3), the required next divisor. You need only one extra factor of 2, not an exact valuation.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P9 explicitly requires induction. The method should be shown even if a modular shortcut is available. T04 P10&#x27;s divisor-construction induction is taught in I09.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Assuming a fixed divisor when it changes with n; mistaking 2^n for 2n; producing a factorisation without connecting it to the hypothesis; using a corrupted expression.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> expose the old expression; for a growing divisor, show where the new factor comes from; A²−1=(A−1)(A+1).\u003c/p>\n\u003cp>Source: C5 p. 14; T04 P9. Both powers in P9(a) and the nested power in P9(c) were checked in the original PDF.\u003c/p>", "search": "\n\nWhat it means. A statement d∣F(n) can be proved inductively by expressing F(k+1) as a multiple of F(k) plus another visibly d-divisible term. When the divisor depends on n, track its change as well as the expression's change.\n\nHow to use it. Check the base. Assume F(k)=d·t for an integer t, or retain the divisibility notation. Rearrange F(k+1) to expose F(k). Finish by using divisibility of sums/products. Avoid reducing exponents using unproved rules.\n\nWorked example — derived T04 P9(a), checked again at enlarged resolution. Show 6∣4^n+7^n+1 for n≥1. The exponent n applies to both 4 and 7. At n=1, 4+7+1=12. Let F(k)=4^k+7^k+1 and assume 6∣F(k). Then\n\nF(k+1)=F(k)+3·4^k+6·7^k.\n\nThe old expression is divisible by 6 by the hypothesis; 3·4^k is divisible by 6 because k≥1 makes 4^k even; 6·7^k is visibly divisible by 6. Therefore 6∣F(k+1). The lower bound k≥1 is used in the argument, not decorative.\n\nWorked example — lecture example, explained. Show 3∣n³−n for n≥1. Basis: 1³−1=0. The next expression is (k+1)³−(k+1)=(k³−k)+3(k²+k), whose two terms are divisible by 3. This completes the step.\n\nWorked example — derived T04 P9(b). For n≥0, show 2∣n²−n. Basis n=0 is 0. The difference [(k+1)²−(k+1)]−(k²−k)=2k is divisible by 2, so the hypothesis propagates.\n\nWorked example — derived T04 P9(c), verified nested exponent. Show 2^(n+2)∣3^(2^n)−1 for n≥1. At n=1, 3²−1=8. Assume 3^(2^k)−1=2^(k+2)t. Then\n\n3^(2^(k+1))−1=[3^(2^k)−1][3^(2^k)+1].\n\nThe first factor supplies 2^(k+2); the second is even because 3^(2^k) is odd. Their product is divisible by 2^(k+3), the required next divisor. You need only one extra factor of 2, not an exact valuation.\n\nQuiz 2 style. T04 P9 explicitly requires induction. The method should be shown even if a modular shortcut is available. T04 P10's divisor-construction induction is taught in I09.\n\nCommon traps. Assuming a fixed divisor when it changes with n; mistaking 2^n for 2n; producing a factorisation without connecting it to the hypothesis; using a corrupted expression.\n\nCHEAT SHEET CANDIDATE: expose the old expression; for a growing divisor, show where the new factor comes from; A²−1=(A−1)(A+1).\n\nSource: C5 p. 14; T04 P9. Both powers in P9(a) and the nested power in P9(c) were checked in the original PDF.\n\na id=\"i07\"/a\n\n", "shortTitle": "Divisibility proofs by induction", "part": "Part 6 — ordinary mathematical induction"}, {"id": "I05", "title": "Induction on finite sets and identities", "section": "Chapter 5, Section 5.1 — Mathematical induction", "chapter": "Chapter 5", "priority": "L2", "source": "C5 pp. 15–16; T04 P13", "ability": "Prove a finite-set result/iterated identity by induction; use the needed elementary set laws. Proof", "prereq": "I01; union, intersection, complement, subset", "confusion": "Set complement bars lost in extraction; using counting as an example versus importing Chapter 6", "visual": "V T04 p. 2; F C5 pp. 15–16 diagram", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> Induction applies to any family of statements indexed by integers, including sets. A set claim may involve all sets of size n or an operation on n given sets. The induction hypothesis must cover every set of the stated size, not one chosen example.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Identify the index: cardinality, number of sets, or number of operations. Reduce the n+1 case to an n-case plus one element/set. Use the corresponding set identity or decomposition, then invoke the hypothesis. Keep complements and the universal set explicit.\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture proof, explained.\u003c/strong> A set with n elements has 2^n subsets. At n=0, the empty set has one subset, itself, and 2^0=1. Assume every k-element set has 2^k subsets. For a (k+1)-element set T, choose a∈T and let S=T\\{a}. Every subset of T is uniquely either X or X∪{a}, with X⊆S. The two categories are disjoint because one excludes a and the other includes it. Thus T has 2·2^k=2^(k+1) subsets. The inspected diagram pairs each X with exactly these two choices. This is an induction application, not an expansion into Chapter 6 counting techniques.\u003c/p>\n\u003cp>\u003cstrong>Worked proof — derived T04 P13.\u003c/strong> Prove complement(∪_(j=1)^n A_j)=∩_(j=1)^n complement(A_j). At n=1 it is the same set. Assuming the identity for k,\u003c/p>\n\u003cp>complement((∪_(j=1)^k A_j)∪A_(k+1))\u003c/p>\n\u003cp>=complement(∪_(j=1)^k A_j)∩complement(A_(k+1))\u003c/p>\n\u003cp>=(∩_(j=1)^k complement(A_j))∩complement(A_(k+1)).\u003c/p>\n\u003cp>The first step uses the two-set De Morgan law: an element is outside a union exactly when it is outside both sets. The last line is the desired k+1 intersection. The complement over the entire left-hand union was lost in text extraction and was checked visually.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> T04 P13 asks for a general identity proof. A diagram of two sets can motivate the law but is not by itself a proof for arbitrary n.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Omitting the outer complement; replacing union by intersection without complementing each set; forgetting the empty set is a subset; applying the cardinality hypothesis to a set of the wrong size.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> split off one element/set; for complements, outside a union = outside every member; prove the n→n+1 transition explicitly.\u003c/p>\n\u003cp>Source: C5 pp. 15–16; T04 P13.\u003c/p>", "search": "\n\nWhat it means. Induction applies to any family of statements indexed by integers, including sets. A set claim may involve all sets of size n or an operation on n given sets. The induction hypothesis must cover every set of the stated size, not one chosen example.\n\nHow to use it. Identify the index: cardinality, number of sets, or number of operations. Reduce the n+1 case to an n-case plus one element/set. Use the corresponding set identity or decomposition, then invoke the hypothesis. Keep complements and the universal set explicit.\n\nWorked example — lecture proof, explained. A set with n elements has 2^n subsets. At n=0, the empty set has one subset, itself, and 2^0=1. Assume every k-element set has 2^k subsets. For a (k+1)-element set T, choose a∈T and let S=T\\{a}. Every subset of T is uniquely either X or X∪{a}, with X⊆S. The two categories are disjoint because one excludes a and the other includes it. Thus T has 2·2^k=2^(k+1) subsets. The inspected diagram pairs each X with exactly these two choices. This is an induction application, not an expansion into Chapter 6 counting techniques.\n\nWorked proof — derived T04 P13. Prove complement(∪_(j=1)^n A_j)=∩_(j=1)^n complement(A_j). At n=1 it is the same set. Assuming the identity for k,\n\ncomplement((∪_(j=1)^k A_j)∪A_(k+1))\n\n=complement(∪_(j=1)^k A_j)∩complement(A_(k+1))\n\n=(∩_(j=1)^k complement(A_j))∩complement(A_(k+1)).\n\nThe first step uses the two-set De Morgan law: an element is outside a union exactly when it is outside both sets. The last line is the desired k+1 intersection. The complement over the entire left-hand union was lost in text extraction and was checked visually.\n\nQuiz 2 style. T04 P13 asks for a general identity proof. A diagram of two sets can motivate the law but is not by itself a proof for arbitrary n.\n\nCommon traps. Omitting the outer complement; replacing union by intersection without complementing each set; forgetting the empty set is a subset; applying the cardinality hypothesis to a set of the wrong size.\n\nCHEAT SHEET CANDIDATE: split off one element/set; for complements, outside a union = outside every member; prove the n→n+1 transition explicitly.\n\nSource: C5 pp. 15–16; T04 P13.\n\na id=\"i06\"/a\n\n", "shortTitle": "Induction for finite sets and set identities", "part": "Part 10 — remaining Level 2 theory and applications"}, {"id": "I06", "title": "Geometric induction: deficient checkerboard tiling", "section": "Chapter 5, Section 5.1 — Mathematical induction", "chapter": "Chapter 5", "priority": "L2", "source": "C5 pp. 17–19; —", "ability": "Interpret the geometric construction and connect smaller cases to the next board. Proof completion/construction", "prereq": "I01; powers; spatial decomposition", "confusion": "Arbitrary missing square versus specially placed hole; one step versus assuming the result", "visual": "V pp. 17–19: four subboards and centre triomino", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> The lecture proves that every 2^n by 2^n checkerboard with one square removed can be tiled by L-shaped triominoes for n≥1. Each tile covers three squares. The statement is about any missing-square position, not just a corner; this strength is what makes the recursive construction work.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Match the geometry of the next board to the previous board size. Divide into four quadrants. One quadrant contains the original missing square. Place a central triomino covering one centre-adjacent square in each of the other three quadrants. Each quadrant is now a smaller board with one unavailable square and can use the hypothesis. The central tile plus the four tilings cover exactly the desired board.\u003c/p>\n\u003cp>\u003cstrong>Worked proof — lecture example, explained.\u003c/strong> Basis n=1: a 2×2 board with any one square removed is exactly an L triomino. Assume every deficient 2^k×2^k board can be tiled, wherever its removed square lies. In a deficient 2^(k+1)×2^(k+1) board, apply the four-quadrant construction described above. Tile the quadrant with the original hole by the hypothesis. In each other quadrant, reserve its centre-adjacent square for the central triomino and tile the remaining deficient board by the hypothesis. These pieces do not overlap and leave no uncovered square except the original missing one. This proves the next case.\u003c/p>\n\u003cp>\u003cimg loa
