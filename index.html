osed complete list. It does not claim that the constructed number is always prime. A separate theme is that many successful outputs of a formula do not establish a universal prime-producing rule.\n\n**How to use it.** In a contradiction proof, assume a complete finite list p_1,...,p_n, construct Q=p_1...p_n+1, and compare divisibility by the listed primes. To refute a prime-generating formula, select an input that forces an evident factorisation.\n\n**Worked proof — lecture argument, explained.** Q>1, so Q has a prime divisor r by prime-factorisation existence. If r were p_j on the list, it would divide both Q and p_1...p_n, hence their difference 1, impossible. Thus r is a prime not on the supposedly complete list, a contradiction. Q itself may have several prime factors; any one suffices.\n\n**Worked example — lecture example, explained.** f(n)=n²−n+41 gives a prime at many early inputs, but f(41)=41², which is composite. This one permitted input refutes “prime for all positive n”. It does not refute the separate claim that particular earlier outputs are prime.\n\n**Source qualification.** C4 p. 41's phrase about no simple function always producing primes is too broad to teach as a theorem. A constant function f(n)=2 already disproves an unrestricted reading. Its polynomial statement also needs a nonconstant qualifier. The safe course-grounded lesson is the displayed counterexample and the distinction between numerical evidence and proof; no sweeping impossibility claim is used as a fact to memorise.\n\n**Quiz 2 style.** T04 P1 supports prove/disprove reasoning; the lecture supplies Euclid's proof. The argument must address every prime on the assumed list, not just a few.\n\n**Common traps.** Claiming Q is necessarily prime; selecting Q=p_1...p_n without the +1; treating a single prime-producing example as a universal result; overlooking qualifications on claims.\n\n**CHEAT SHEET CANDIDATE:** finite-prime-list contradiction: product+1 → prime divisor → none of listed primes divides it → contradiction.\n\nSource: C4 pp. 38,41; T04 P1.\n\n\u003ca id=\"n12\">\u003c/a>\n\n### N12 — Mersenne primes and perfect numbers [L2]\n\n**What it means.** A Mersenne prime is a prime of the form 2^p−1, with p prime. A prime exponent is necessary for such primality but not sufficient: 2^11−1=2047=23·89. A positive integer is perfect when it equals the sum of its positive proper divisors, meaning all positive divisors except itself.\n\n**How to use it.** Distinguish the number 2^p−1 from the exponent p. To prove the tutorial's perfect-number construction, exploit its prime factorisation to list all divisor types, sum all divisors, and subtract the number itself. Do not claim the construction works unless 2^p−1 is prime.\n\n**Worked examples — derived T04 P2(a).** The proper divisors of 6 are 1,2,3 and sum to 6. For 28 they are 1,2,4,7,14 and sum to 28. Including 6 or 28 itself would produce twice the number and answer a different question.\n\n**Worked proof — derived T04 P2(b).** Let q=2^p−1 be prime and N=2^(p−1)q. Its positive divisors are 2^j and 2^j q for 0≤j≤p−1, because q is an odd prime distinct from 2. Their total is\n\n(1+q)(1+2+...+2^(p−1))=2^p(2^p−1)=2N.\n\nRemoving N leaves proper-divisor sum N, so N is perfect. The geometric-sum identity is the only extra algebra needed. For p=3, q=7 and N=4·7=28, matching the example.\n\n**Why a composite exponent cannot yield a prime.** If p=uv with u,v>1, then 2^p−1=(2^u)^v−1 factors as (2^u−1)[1+2^u+...+(2^u)^(v−1)]. This explains necessity but does not turn it into sufficiency.\n\n**Quiz 2 style.** T04 P2 mixes definition checking and a general conditional proof. Dated records about the largest known prime are contextual slide claims, not established memorisation targets.\n\n**Common traps.** Assuming 2^p−1 prime whenever p prime; omitting some divisor types; summing only prime divisors; forgetting to remove N from the all-divisor sum.\n\n**CHEAT SHEET CANDIDATE:** if q=2^p−1 is prime, N=2^(p−1)q is perfect; divisor sum=(1+q)(2^p−1)=2N.\n\nSource: C4 p. 39; T04 P2.\n\n\u003ca id=\"n23\">\u003c/a>\n\n### N23 — Fermat's little theorem and large powers [L2]\n\n**What it means.** If p is prime and p does not divide a, then a^(p−1)≡1 (mod p). For every integer a, including multiples of p, a^p≡a (mod p). These are related versions with different restrictions. The first permits reducing a large exponent by multiples of p−1, provided the coprimality condition holds.\n\n**How to use it.** Check the modulus is prime. Reduce the base modulo p. If the base is 0, handle that directly rather than using the first version. Otherwise write the exponent N=q(p−1)+r, with 0≤r\u003cp−1, and replace a^N by a^r modulo p. Evaluate the smaller power and reduce. The theorem supplies the exponent reduction; congruence arithmetic alone does not license reducing every exponent modulo every modulus.\n\n**Worked example — lecture example, explained.** To find 7^222 mod 11, note that 11 is prime and 11∤7. Since 222=22·10+2 and 7^10≡1, we get 7^222=(7^10)^22·7²≡49≡5 (mod 11).\n\n**Worked variation — analogous.** For 13^100 mod 13 the answer is 0 because the base is divisible by 13. Writing 100=8·12+4 still happens to leave a positive exponent here, but the unsafe method is exposed by 13^12: reducing the exponent to 0 would give 1, while the true remainder is 0. Always check the hypothesis first. The all-integer version correctly says 13^13≡13≡0 (mod 13).\n\n**Quiz 2 style.** The lecture supports theorem application and calculations with large powers. There is no direct approved tutorial problem devoted to Fermat's theorem, so no frequency or mark claim is made.\n\n**Common traps.** Using a composite modulus; reducing the exponent mod p rather than p−1; missing p∤a; interpreting the converse as true—passing a Fermat congruence need not prove primality.\n\n**CHEAT SHEET CANDIDATE:** p prime, p∤a ⇒ a^(p−1)≡1; all a ⇒ a^p≡a; exponent reduction requires the first version's hypotheses.\n\nSource: C4 pp. 68–69.\n\n\u003ca id=\"n25\">\u003c/a>\n\n### N25 — Primitive roots modulo a prime [L2]\n\n**What it means.** A primitive root r modulo prime p is a residue whose powers produce every nonzero element of Z_p. Being nonzero or having an inverse is not enough; the powers must cover all p−1 nonzero residues. The lecture states that every prime modulus has a primitive root; no proof of that existence theorem is supplied here.\n\n**How to use it.** For a small prime, compute r,r²,... modulo p by multiplying the previous remainder by r. Record the residues until 1 returns. A return to 1 means the pattern repeats. If the first cycle contains all p−1 nonzero residues, r is primitive; if the cycle is shorter, it is not. This is a finite computation grounded in the definition, not an imported advanced algorithm.\n\n**Worked example — lecture example, explained.** Modulo 11, the powers of 2 for exponents 1 through 10 are 2,4,8,5,10,9,7,3,6,1. Every nonzero residue appears, so 2 is primitive. For example the transition 8→5 is 8·2=16≡5, and 10→9 is 10·2=20≡9; reducing each step keeps the table manageable.\n\nBy contrast powers of 3 are 3,9,5,4,1, then repeat. Residues 2,6,7,8,10 are absent. Thus 3 is not primitive mod 11 even though gcd(3,11)=1 and 3 has a multiplicative inverse.\n\n**Quiz 2 style.** Definition application, modular calculation and justification from a power list are supported by the lecture. No direct scoped tutorial task establishes additional emphasis.\n\n**Common traps.** Seeing several different powers and stopping before demonstrating coverage; forgetting that 0 is not required; confusing an ordinary root of an equation with a primitive root; assuming every nonzero residue is primitive for prime modulus.\n\n**CHEAT SHEET CANDIDATE:** r primitive mod prime p ⇔ its powers cover all p−1 nonzero residues; calculate a modular power cycle and check coverage.\n\nSource: C4 p. 72.\n\n\u003ca id=\"n26\">\u003c/a>\n\n### N26 — Discrete logarithms [L2]\n\n**What it means.** With prime p and primitive root r, the discrete logarithm of nonzero a∈Z_p is the exponent e such that r^e≡a (mod p), using the course's range **1≤e≤p−1**. The modulus may be omitted from the notation log_r a in the slides, but it must be understood. This is not the real-valued logarithm on a calculator.\n\n**How to use it.** Establish the modulus and primitive root. Build or use the modular power table. Find where a occurs and return the exponent in the stated range. Verify by modular exponentiation. Do not assume an arbitrary base reaches every a; the primitive-root hypothesis ensures it does.\n\n**Worked examples — lecture examples, explained.** In the powers-of-2 table modulo 11, exponent 8 gives residue 3, so log_2 3=8 in this modular setting. Exponent 4 gives residue 5, so log_2 5=4. The table's exponent 10 gives 1, so under this course convention log_2 1=10 modulo 11, not 0. Both exponents 0 and 10 give residue 1, but only 10 lies in 1,...,10.\n\n**Why the range matters.** Multiplying by 2^10≡1 repeats the powers. Thus unrestricted exponents are not unique: 2^8 and 2^18 give the same residue modulo 11. The uniqueness statement is about the representative exponent in the defined range. This parallels modular inverse uniqueness: representative conventions matter.\n\n**Quiz 2 style.** The lectures directly support lookup/calculation and definition use. No general discrete-log-solving algorithm or cryptography topic is imported. The slide's computational-difficulty comment is contextual, not a procedure needed for these small examples.\n\n**Common traps.** Using decimal logarithms; forgetting the modulus; returning exponent 0 for residue 1 under this particular convention; using a non-primitive base and expecting every residue to appear.\n\n**CHEAT SHEET CANDIDATE:** r^e≡a (mod p), p prime, r primitive, 1≤a≤p−1, **1≤e≤p−1**; read e from the modular power table.\n\nSource: C4 pp. 73–74.\n\n\u003ca id=\"i05\">\u003c/a>\n\n### I05 — Induction for finite sets and set identities [L2]\n\n**What it means.** Induction applies to any family of statements indexed by integers, including sets. A set claim may involve all sets of size n or an operation on n given sets. The induction hypothesis must cover every set of the stated size, not one chosen example.\n\n**How to use it.** Identify the index: cardinality, number of sets, or number of operations. Reduce the n+1 case to an n-case plus one element/set. Use the corresponding set identity or decomposition, then invoke the hypothesis. Keep complements and the universal set explicit.\n\n**Worked example — lecture proof, explained.** A set with n elements has 2^n subsets. At n=0, the empty set has one subset, itself, and 2^0=1. Assume every k-element set has 2^k subsets. For a (k+1)-element set T, choose a∈T and let S=T\\{a}. Every subset of T is uniquely either X or X∪{a}, with X⊆S. The two categories are disjoint because one excludes a and the other includes it. Thus T has 2·2^k=2^(k+1) subsets. The inspected diagram pairs each X with exactly these two choices. This is an induction application, not an expansion into Chapter 6 counting techniques.\n\n**Worked proof — derived T04 P13.** Prove complement(∪_(j=1)^n A_j)=∩_(j=1)^n complement(A_j). At n=1 it is the same set. Assuming the identity for k,\n\ncomplement((∪_(j=1)^k A_j)∪A_(k+1))\n\n=complement(∪_(j=1)^k A_j)∩complement(A_(k+1))\n\n=(∩_(j=1)^k complement(A_j))∩complement(A_(k+1)).\n\nThe first step uses the two-set De Morgan law: an element is outside a union exactly when it is outside both sets. The last line is the desired k+1 intersection. The complement over the entire left-hand union was lost in text extraction and was checked visually.\n\n**Quiz 2 style.** T04 P13 asks for a general identity proof. A diagram of two sets can motivate the law but is not by itself a proof for arbitrary n.\n\n**Common traps.** Omitting the outer complement; replacing union by intersection without complementing each set; forgetting the empty set is a subset; applying the cardinality hypothesis to a set of the wrong size.\n\n**CHEAT SHEET CANDIDATE:** split off one element/set; for complements, outside a union = outside every member; prove the n→n+1 transition explicitly.\n\nSource: C5 pp. 15–16; T04 P13.\n\n\u003ca id=\"i06\">\u003c/a>\n\n### I06 — Geometric induction: deficient checkerboards [L2]\n\n**What it means.** The lecture proves that every 2^n by 2^n checkerboard with one square removed can be tiled by L-shaped triominoes for n≥1. Each tile covers three squares. The statement is about any missing-square position, not just a corner; this strength is what makes the recursive construction work.\n\n**How to use it.** Match the geometry of the next board to the previous board size. Divide into four quadrants. One quadrant contains the original missing square. Place a central triomino covering one centre-adjacent square in each of the other three quadrants. Each quadrant is now a smaller board with one unavailable square and can use the hypothesis. The central tile plus the four tilings cover exactly the desired board.\n\n**Worked proof — lecture example, explained.** Basis n=1: a 2×2 board with any one square removed is exactly an L triomino. Assume every deficient 2^k×2^k board can be tiled, wherever its removed square lies. In a deficient 2^(k+1)×2^(k+1) board, apply the four-quadrant construction described above. Tile the quadrant with the original hole by the hypothesis. In each other quadrant, reserve its centre-adjacent square for the central triomino and tile the remaining deficient board by the hypothesis. These pieces do not overlap and leave no uncovered square except the original missing one. This proves the next case.\n\n![Original checkerboard induction diagram, Chapter 5 physical page 19](assets/chapter5-page-19.png)\n\nThe left panel marks the quadrant containing the arbitrary missing square; the right panel shows the central L covering one square in each other quadrant. The artificially reserved squares are covered by that central tile, not permanently removed from the board.\n\n**Quiz 2 style.** The lecture supports interpreting a diagram, constructing an inductive step and explaining why the smaller cases meet the hypothesis. There is no direct approved tutorial problem on this tiling.\n\n**Common traps.** Proving only a corner-hole version then applying it to an arbitrary hole; placing the central tile across the wrong quadrants; using boards of size 2k rather than 2^k; counting areas without constructing a tiling.\n\n**CHEAT SHEET CANDIDATE:** four quadrants → one real hole + three central reserved squares → central triomino → apply the hypothesis to each quadrant.\n\nSource: C5 pp. 17–19; diagram directly rendered from the inspected original.\n\n\u003ca id=\"i09\">\u003c/a>\n\n### I09 — Constructive induction: amounts, divisors and splitting [L2]\n\n**What it means.** Some induction statements assert a construction exists; others assert every construction has the same outcome. The step must build a permitted object or analyse all permitted decompositions. A numerical pattern alone does neither.\n\n**How to use it.** For attainable amounts, first find necessary restrictions such as a common divisor, then establish bases covering the step size. For an arbitrary split, express the object as two strictly smaller pieces and apply strong induction to both. For a representation by divisors, verify that transformed pieces remain divisors and remain distinct.\n\n**Worked example — derived T04 P14.** Amounts formed from $25 and $40 are 5 times integers of the form 5a+8b, a,b≥0. For scaled amounts, 28=4·5+8,29=5+3·8,30=6·5,31=3·5+2·8,32=4·8. Strong induction now gives every integer ≥28: for a target t≥33, t−5≥28 is an earlier attainable amount, and one more 5 completes t. Thus every multiple of $5 at least $140 is attainable.\n\nTo determine **all** smaller possibilities, enumerate b=0,1,2,3 while 5a+8b\u003c28. The positive scaled results are 5,8,10,13,15,16,18,20,21,23,24,25,26. Multiply by 5 to obtain $25,$40,$50,$65,$75,$80,$90,$100,$105,$115,$120,$125,$130. Include $0 only if using no certificates is permitted. No nonmultiple of $5 is attainable. This separates the finite boundary check from the infinite induction argument.\n\n**Worked example — derived T04 P15.** Let the claim for n stones be that every full splitting process has total product sum n(n−1)/2. Basis n=1 has no split and sum 0. If the first split gives r,s≥1 with r+s=n, the first contribution is rs. Both piles are smaller than n, so strong induction gives their later totals r(r−1)/2 and s(s−1)/2 regardless of the subsequent splitting choices. Their sum with rs is [(r+s)²−(r+s)]/2=n(n−1)/2. This proves independence from the splitting sequence.\n\n**Worked example — derived T04 P10, ordinary induction.** Claim: every positive m≤n! is a sum of at most n distinct positive divisors of n!. Basis n=1 is 1. Assume the claim for n. For m≤(n+1)!, divide m=(n+1)q+r with 0≤r≤n and 0≤q≤n!. If q>0, express q as a sum of at most n distinct divisors d_i of n!. Then (n+1)d_i are distinct divisors of (n+1)!. If r>0, it also divides (n+1)! because 1≤r≤n, and it is smaller than every (n+1)d_i, so it is a new distinct divisor. These at most n+1 divisors sum to m. If q=0 use only r; if r=0 omit it. All edge cases and distinctness are accounted for.\n\n**Quiz 2 style.** These are directly supplied application problems. P14 specifies strong induction; P10 specifies mathematical induction; P15's decomposition naturally supports strong induction without that method being explicitly mandated.\n\n**Common traps.** Proving only that large amounts work when all amounts are requested; treating 0 as a positive divisor; omitting distinctness; considering one stone-splitting order rather than an arbitrary first split.\n\n**CHEAT SHEET CANDIDATE:** constructions need validity checks; splitting proof: first contribution + two smaller totals; amount proof: necessary restrictions + sufficient bases + backward step.\n\nSource: C5 pp. 30–32; T04 P10,14–15.\n\n\u003ca id=\"r06\">\u003c/a>\n\n### R06 — Strings, concatenation and recursive length [L2]\n\n**What it means.** An alphabet Σ is a set of symbols. Σ* is the set of finite strings over it, including the empty string λ. A recursive definition gives λ∈Σ* and, for w∈Σ* and x∈Σ, wx∈Σ*. The exclusion rule prevents other objects. A symbol is one item; a string is a finite ordered sequence of symbols.\n\nConcatenation joins strings in order. Recursively, w·λ=w and w_1·(w_2x)=(w_1·w_2)x. Length obeys l(λ)=0 and l(wx)=l(w)+1. These are definitions on structure, not arithmetic multiplication and not multiplication of lengths.\n\n**How to use it.** Build a string by appending symbols to λ. For a recursive argument, split a nonempty string into a shorter prefix w and a final symbol x. Match the basis and recursive cases to that definition. When evaluating concatenation, preserve both order and repeated symbols.\n\n**Worked example — lecture example, explained.** For Σ={a,b}, λ→a→aa→aab demonstrates membership of aab. Its length is l(aab)=l(aa)+1=l(a)+2=l(λ)+3=3. Concatenating abra and cadabra yields abracadabra, length 11, preserving all repeated letters.\n\n**Worked proof — analogous structural application.** Show l(uv)=l(u)+l(v), fixing any u and inducting structurally on v. Basis v=λ: l(uλ)=l(u)=l(u)+0. If the property holds for v=w, then l(u(wx))=l((uw)x)=l(uw)+1=l(u)+l(w)+1=l(u)+l(wx). Thus the constructor preserves it. This demonstrates how the string definitions support a proof, not just evaluation.\n\n**Quiz 2 style.** These definitions are explicit in the lecture; no direct approved tutorial task adds emphasis. Recursive construction and definition application are supported styles.\n\n**Common traps.** Confusing λ with ∅: λ is one string, ∅ is a set with no members. Concatenation is generally not commutative: ab differs from ba. A repeated symbol still contributes to length.\n\n**CHEAT SHEET CANDIDATE:** λ basis; append one symbol; l(λ)=0,l(wx)=l(w)+1; wλ=w; split a nonempty string into prefix and last symbol.\n\nSource: C5 pp. 47–49.\n\n\u003ca id=\"r07\">\u003c/a>\n\n### R07 — Balanced parentheses and well-formed formulae [L2; source qualification]\n\n**What it means.** Recursive syntax specifies which symbol strings are permitted expressions. This is separate from whether an expression is true. The lecture's well-formed formula bases are T,F and propositional variables. From already well-formed E,F one may form (¬E),(E∧F),(E∨F),(E→F),(E↔F).\n\nFor parentheses, the supplied p. 50 uses basis () and rules w→()w, w→(w), w→w(). These rules preserve balanced parentheses, but their claim to describe every balanced string is incomplete; the qualification below is part of the lesson, not a silent change of the course definition.\n\n**How to use it.** For membership under a specified grammar, exhibit a finite sequence of allowed constructions. For well-formed formulae, identify the outermost operator and its already valid argument(s). To establish a string is impossible, identify a property every constructor preserves or show that no final constructor could have produced it. Do not invent an extra rule because the string looks reasonable.\n\n**Worked examples — lecture constructions, explained.** Starting with (), append () to obtain ()(), then wrap to obtain (()()). Every operation is allowed. A string beginning with ) such as ))(() cannot be generated, because the base and all three constructors preserve the property that no prefix has more closing than opening parentheses.\n\nFor formulae, start with variables p,q and the constant F. Form (p∨q) and (q∧F), then combine them as ((p∨q)→(q∧F)). This is well formed regardless of its truth value for particular p,q. The string pq∧ is not produced by the infix, parenthesised grammar.\n\n**Source limitation — completeness remains unresolved.** The balanced string (())(()) cannot be produced by the displayed parenthesis rules: it does not begin with (), does not end with (), and cannot be one wrapping (w), because its first opening parenthesis closes before the last character. Those exhaust the possible final constructors. A more general grammar could add a suitable concatenation rule, but that rule is not supplied and is not being substituted as the official definition. Whether the empty string is intended as balanced is also unstated. The valid restricted constructions and formula grammar are taught; the blanket “all balanced strings” claim is not endorsed.\n\n**Quiz 2 style.** Definition application and recursive construction are lecture-supported. There is no direct relevant tutorial resolving the parenthesis grammar.\n\n**Common traps.** Equating well formed with true; using an operator with missing operands; ignoring parentheses; confusing “every generated string is balanced” with “every balanced string is generated”.\n\n**CHEAT SHEET CANDIDATE:** syntax≠truth; prove grammar membership by constructors; grammar soundness≠completeness; retain the p. 50 qualification until lecturer clarification.\n\nSource: C5 pp. 50–51; original visual checked. Supported content taught; completeness/empty-string convention explicitly unresolved.\n\n## Part 11 — Level 3 material\n\n\u003ca id=\"n13\">\u003c/a>\n\n### N13 — Prime distribution, estimates and conjectures [L3]\n\n**What it means.** Let π(x) be the number of primes not exceeding x. The prime number theorem states that π(x)/(x/ln x) approaches 1 as x grows without bound. This is a relative asymptotic statement. It does not assert π(x)=x/ln x at a particular x, nor that the difference tends to 0. Here ln is the natural logarithm.\n\nThe slides also present Goldbach's conjecture (every even integer >2 is a sum of two primes), the conjecture of infinitely many primes of form n²+1, and the twin-prime conjecture (infinitely many prime pairs differing by 2). They are presented as conjectures in the supplied source. This package teaches their statements and logical status in that source, rather than reporting an independently checked current research update.\n\n**How to use it.** Recognise whether the task asks for an estimate, a theorem statement or a conjecture. To estimate a prime count, use x/ln x with the correct logarithm and explain it is approximate. The heuristic fraction of integers up to a large x that are prime is about 1/ln x. To interpret a conjecture, preserve its quantifiers: infinitely many prime values of n²+1 does not mean every such value is prime.\n\n**Worked example — analogous.** At x=1000, x/ln x≈1000/6.9078≈144.8. This estimates roughly 145 primes, without promising that 145 is the exact count. A ratio tending to 1 means the relative error becomes small in the limiting sense; it does not give an error bound for this specific input.\n\n**Recognition examples — analogous.** 28=5+23 is an instance consistent with Goldbach, not a proof for all even integers. The pair 11,13 is a twin-prime pair; knowing it exists does not establish infinitely many such pairs. n²+1 gives 2,5,10 at n=1,2,3; the composite 10 does not refute the claim that infinitely many other inputs produce primes.\n\n**Quiz 2 style.** Recognition, interpreting an estimate and distinguishing proven versus conjectured claims are supported by the slides; no direct approved tutorial problem indicates their exam frequency. Historical numerical records are not treated as compulsory recall facts.\n\n**Common traps.** Replacing ln with log_10; presenting an estimate as an exact answer; confusing “infinitely many” with “all”; assuming computer checks through a large finite bound establish an infinite statement.\n\n**CHEAT SHEET CANDIDATE:** π(x)∼x/ln x means the ratio tends to 1; prime density heuristic ≈1/ln x; conjecture≠theorem; keep quantifiers.\n\nSource: C4 pp. 40–42.\n\n\u003ca id=\"n24\">\u003c/a>\n\n### N24 — Pseudoprimes and the limits of Fermat tests [L3]\n\n**What it means.** A composite integer n satisfying b^(n−1)≡1 (mod n) is a pseudoprime to base b. It imitates one necessary property of primes without actually being prime. The base matters: passing one base's test does not establish a universal property or guarantee passing every base.\n\n**How to use it.** For the base-2 test use n>2, as in the preceding lecture slide. If the congruence fails, n is composite by the contrapositive of Fermat's theorem. If it passes, n is either prime or a base-2 pseudoprime; another argument is needed. For a general base, use an admissible base coprime to the candidate when applying Fermat's contrapositive. If a nontrivial gcd with the base is found, that is separate compositeness evidence for a candidate larger than that divisor.\n\n**Worked example — lecture number, derived verification.** 341=11·31 is composite. But 2^10=1024=3·341+1, so 2^340=(2^10)^34≡1 (mod 341). Thus it is a base-2 pseudoprime. The factorisation proves composite; the congruence proves it passes this test. Both are necessary to establish the definition.\n\n**Worked example — analogous.** For n=15, 2^4≡1 (mod 15), so 2^14=(2^4)^3·2²≡4, not 1. The failed test proves 15 composite because a prime >2 would pass. It does not supply a factorisation by itself, although here 15=3·5 is easy to find.\n\n**Source qualification.** C4 p. 71 abbreviates the test as applying to a “positive integer” and omits n>2 from p. 70. Without that restriction, prime 2 itself fails 2^(2−1)≡1 (mod 2). Therefore the unrestricted prose is false; retain the preceding hypothesis. More bases provide evidence, not an automatic deterministic guarantee from the limited facts supplied here.\n\n**Quiz 2 style.** Definition application, checking an example and explaining why the converse of Fermat is false are lecture-supported. No advanced primality-test algorithm is added.\n\n**Common traps.** Calling a passing number prime; calling a prime a pseudoprime; forgetting to prove compositeness; treating the base as irrelevant; applying the base-2 failure implication to n=2.\n\n**CHEAT SHEET CANDIDATE:** composite + passes Fermat congruence = pseudoprime to that base. For n>2, base-2 failure ⇒ composite; passage does not ⇒ prime.\n\nSource: C4 pp. 70–71, with conditions reconciled to pp. 68,70.\n\n\u003ca id=\"r03\">\u003c/a>\n\n### R03 — Fibonacci growth and Lamé's theorem [L3]\n\n**What it means.** The lecture links two earlier topics: Fibonacci numbers grow quickly, and a long Euclidean division chain forces its initial numbers to be at least as large as corresponding Fibonacci numbers. Thus a number's decimal digit count bounds how many divisions the Euclidean algorithm can require.\n\nLet α=(1+√5)/2. The supplied Fibonacci bound is f_n>α^(n−2) for n≥3. Lamé's theorem says that for positive a≥b, the number D of Euclidean divisions is at most five times the number d of decimal digits in b. Count the final exact division as a division. This is an upper bound, not an exact count or a promise that five divisions occur per digit.\n\n**How to use it.** For an application, identify the smaller positive input b, compute its decimal digit count and multiply by 5. For proof completion, follow the chain: Fibonacci growth → remainder lower bounds → logarithm → integer division bound. Do not import characteristic equations to obtain a Fibonacci closed form.\n\n**Worked growth proof — lecture argument, explained.** α²=α+1. Bases: f_3=2>α and f_4=3>α². Assume the bound for all 3≤j≤k with k≥4. Then\n\nf_(k+1)=f_k+f_(k−1)>α^(k−2)+α^(k−3)=α^(k−3)(α+1)=α^(k−1).\n\nThis is the desired exponent (k+1)−2. Two bases support the two earlier Fibonacci terms.\n\n**Worked proof chain — lecture Lamé argument, expanded.** Write the Euclidean remainders as r_0=a,r_1=b,...,r_D>0 with the final equation r_(D−1)=q_D r_D. For a>b, the last quotient is at least 2; earlier quotients are at least 1. Hence r_D≥1=f_2, r_(D−1)≥2r_D≥f_3, and moving backwards gives r_j≥r_(j+1)+r_(j+2), so b=r_1≥f_(D+1). For D>2, the growth bound yields b>α^(D−1). Taking base-10 logs gives D−1\u003clog_10 b/log_10 α\u003c5 log_10 b, since log_10 α>1/5. With d decimal digits, b\u003c10^d, so D−1\u003c5d; because D and 5d are integers, D≤5d. Cases D≤2 satisfy the bound directly because d≥1. If a=b, one exact division also satisfies it. These small cases make the slide's abbreviated argument complete.\n\n**Worked application — analogous.** For a=287,b=91, b has 2 digits, so the theorem gives at most 10 divisions. The actual chain in N15 has 3, which is consistent. A 100-digit b gives a bound of 500 divisions regardless of the larger a. The lecture's O(log b) consequence describes the growth in the number of divisions, not a full bit-operation runtime analysis.\n\n**Quiz 2 style.** The lecture supports applying the bound and following a multi-step proof. No direct scoped tutorial problem establishes higher emphasis.\n\n**Common traps.** Counting digits of a instead of b; confusing d with D; using the growth theorem below its stated range; treating the upper bound as equality; losing the index offset f_(D+1).\n\n**CHEAT SHEET CANDIDATE:** α²=α+1; f_n>α^(n−2), n≥3; b≥f_(D+1); D≤5·digits(b); handle D≤2/a=b directly.\n\nSource: C5 pp. 41–44; paired proof columns and indices visually verified.\n\n\u003ca id=\"r10\">\u003c/a>\n\n### R10 — Generalized induction on nonnegative integer pairs [L3]\n\n**What it means.** Induction can follow a well-order other than the usual order on single integers. For pairs in N×N, use strict lexicographic order: (a,b)\u003c(c,d) when a\u003cc, or when a=c and b\u003cd. Compare the first coordinates first; compare second coordinates only when the first tie. This is the specific Chapter 5 example, not a new unit on Chapter 9 relations.\n\nEvery nonempty subset of N×N has a least pair under this order: choose the least first coordinate appearing, then the least second coordinate among pairs with that first coordinate. Generalized induction assumes the statement for all strictly earlier pairs and proves it for the current pair. The original p. 61 says “less than or equal” while displaying a strict condition; the p. 62 proof uses the strict interpretation taught here.\n\n**How to use it.** Identify the basis and the recursive branches. For each branch, show the referenced pair is earlier and still nonnegative. Apply the corresponding hypothesis, substitute the claimed formula and simplify. Earlier does not mean both coordinates are smaller: (1,100)\u003c(2,0).\n\n**Worked example — lecture example, explained.** Define a_(0,0)=0 and, for other nonnegative pairs,\n\n- a_(m,0)=a_(m−1,0)+1 when m>0;\n- a_(m,n)=a_(m,n−1)+n when n>0.\n\nClaim a_(m,n)=m+n(n+1)/2. At (0,0) it is 0. Assume the formula for every earlier pair. If n=0,m>0, (m−1,0) is earlier, giving a_(m,0)=(m−1)+0+1=m. If n>0, (m,n−1) is earlier, giving a_(m,n)=m+(n−1)n/2+n=m+n(n+1)/2. Both branches preserve the claim. For example a_(2,3)=2+3·4/2=8; recursively the row has a_(2,0)=2,a_(2,1)=3,a_(2,2)=5,a_(2,3)=8.\n\n**Source distinction.** Well-ordering of nonnegative pairs in this lexicographic order is valid. It does not validate the slide's separate blanket assertion about arbitrary finite strings in dictionary order. Those are different domains.\n\n**Quiz 2 style.** The lecture supports interpreting the definition and completing the two-case proof. No approved tutorial expands this to arbitrary ordered structures.\n\n**Common traps.** Using ≤ while excluding equality inconsistently; assuming the current pair; decreasing m when m=0; treating lexicographic order as comparing sums; demanding both coordinates decrease.\n\n**CHEAT SHEET CANDIDATE:** compare first coordinate, then second; hypothesis covers strictly earlier pairs; verify each recursive branch points backwards and stays in N×N.\n\nSource: C5 pp. 61–62; original piecewise definition visually checked.\n\n## Source qualifications, visual completion and boundaries\n\nAll 47 groups have been addressed. **46 are marked TAUGHT; R07 is marked UNRESOLVED — SUPPORTED PARTS TAUGHT** because the supplied balanced-parenthesis grammar does not support its complete-characterisation claim. Its valid constructions, nonmembership reasoning and well-formed formulae have been taught in full above. This status records a source limitation, not a learner limitation.\n\nThe following issues remain visible rather than being silently corrected:\n\n| Source issue | Treatment in this teaching package | Remaining uncertainty |\n|---|---|---|\n| C5 p. 28 lists one basis in a problem giving two reachable rungs | I08 explicitly uses both given bases | No mathematical teaching gap; whether a lecturer expects a particular shortened presentation is unknown |\n| C5 p. 33 says arbitrary finite strings in lexicographic order are well ordered | I10 teaches the valid integer principle; R10 proves the valid pair case | Lecturer's intended string-order convention remains unspecified. For ordinary dictionary order with a\u003cb, b>ab>aab>... has no least member, so the blanket claim cannot be used |\n| C5 p. 50 parenthesis grammar | R07 teaches its actual rules and shows why completeness fails for (())(()) | Intended full grammar and empty-string convention remain unresolved; excluded from later definitive scoring until clarified |\n| C5 p. 61 says ≤ but supplies a strict condition | R10 labels the displayed relation as strict and follows p. 62's “earlier pair” proof | Typographical intent is not confirmed by an announcement, but the mathematical distinction is explicit |\n| C4 p. 71 omits a test restriction | N24 retains n>2 from p. 70 and explains the n=2 exception | No missing mathematical condition in the teaching explanation |\n| C4 p. 41 uses overly broad prime-function/polynomial wording | N11 does not assert the blanket statement; it teaches the supported counterexample method and notes the constant-prime-function exception | No lecturer erratum supplied |\n| C4 p. 23 promises a base-representation proof not worked in supplied §5.1 | N0  `<div class="grid">${stat('Assessed concept coverage',attempted.length+'/47',independent.length+' have independent attempts')}${stat('Competent / strong',good.length+'/47','Repeated and varied question evidence required')}${stat('Independent proof attempts',proof.length,proof.length?pCorrect+' fully correct by self-check':'No proof evidence')}${stat('Open mistake records',S.mistakes.filter(m=>!m.resolved).length,'Review the cause, then retest independently')}${stat('Graded mocks',S.mockRuns.length,S.mockRuns.length?'Inspect individual results; no official score equivalence':'No timed self-marked evidence')}${stat('Distinct questions attempted',new Set(S.attempts.map(a=>a.qid)).size+'/100','Exposure is not performance')}</div><h2>Evidence by priority</h2><div class="table-scroll"><table><tr><th>Priority</th><th>Assessed</th><th>Competent / strong</th><th>Needs review</th></tr>${['L1','L2','L3'].map(p=>{const cs=DATA.concepts.filter(c=>c.priority===p);return `<tr><td>${p}</td><td>${cs.filter(c=>mastery(c.id).attempts).length}/${cs.length}</td><td>${cs.filter(c=>['COMPETENT','STRONG'].includes(mastery(c.id).state)).length}/${cs.length}</td><td>${cs.filter(c=>mastery(c.id).state==='NEEDS REVIEW').length}</td></tr>`}).join('')}</table></div><h2>Suggested next step</h2><p>${!S.attempts.length?'Begin with standard practice and record honest self-checks.':S.mistakes.some(m=>!m.resolved)?'Review open mistakes and the linked lessons, then use Weak Areas to retest.':independent.length<47?'Broaden independent evidence across unassessed concepts, including Levels 2 and 3.':!S.mockRuns.length?'Try a timed practice mock to examine proof completeness and time management.':'Inspect the remaining developing concepts and retest later with independent reasoning. No threshold here guarantees exam readiness.'}</p><details><summary>Transparent mastery rules and limitations</summary><div class="detail-body">${criteria()}</div></details><h2>Skill dimensions by concept</h2><div class="table-scroll"><table><tr><th>Concept</th><th>Conceptual</th><th>Calculation / procedure</th><th>Proof / reasoning</th></tr>${DATA.concepts.map(c=>`<tr><td><a href="#practice-${c.id}">${c.id}</a>${c.id==='R07'?' (supported parts)':''}</td>${['conceptual','calculation','proof'].map(skill=>`<td>${DATA.questions.some(q=>q.concepts.includes(c.id)&&q.skill===skill)?evidence(c.id,skill).state:'Not separately sampled'}</td>`).join('')}</tr>`).join('')}</table></div>`}
function cheat(){const cs=DATA.cheats.filter(c=>(!filters.category||c.category===filters.category)&&(!filters.search||(c.text+' '+c.concept).toLowerCase().includes(filters.search.toLowerCase()))),included=DATA.cheats.filter(c=>S.cheat[c.id]?.choice==='include');return title('Select / arrange / print','Your double-sided A4 sheet','Candidates come from the approved teaching package. Select deliberately; the full collection will not automatically fit.')+
 `<div class="toolbar filters"><label class="wide">Search candidates<input data-filter="search" value="${esc(filters.search)}" placeholder="Formula, theorem or concept"></label><label>Category<select data-filter="category">${options(['definitions','formulas','theorem conditions','algorithms','proof templates','common traps'],filters.category,'All categories')}</select></label><label>Print font size (pt)<input type="number" id="print-size" min="7" max="14" step="0.5" value="${S.settings.printSize}"></label>${button('Clear filters','clear-filters')}</div><p>${included.length} included · ${DATA.cheats.filter(c=>S.cheat[c.id]?.choice==='exclude').length} excluded · ${DATA.cheats.filter(c=>!S.cheat[c.id]||S.cheat[c.id].choice==='unsure').length} unsure</p><div class="actions">${button('Preview two A4 sides','preview-cheat')}${button('Print included items','print-cheat','','primary')}</div><div id="print-feedback" class="live-note">Assign each included candidate to front or back. Preview checks estimated overflow; verify your browser’s print preview at 100% scale with headers/footers disabled. No automatic fitting is promised.</div><div id="cheat-preview"></div>`+cs.map(c=>{const v=S.cheat[c.id]||{choice:'unsure',side:'front'};return `<div class="card cheat-item"><div><span class="eyebrow">${c.concept} · ${c.category}</span><p>${esc(c.text)}</p>${c.concept==='R07'?'<small>Qualification stays with this candidate; it must not become a universal grammar claim.</small>':''}</div><div><label>Selection · ${c.concept}<select class="cheat-choice" data-id="${c.id}">${options(['include','exclude','unsure'],v.choice)}</select></label><label>Sheet side · ${c.concept}<select class="cheat-side" data-id="${c.id}">${options(['front','back'],v.side)}</select></label></div></div>`}).join('')}
function makeSheets(){return ['front','back'].map(side=>`<section class="sheet" style="--print-size:${S.settings.printSize}pt"><h2>Quiz 2 · ${side==='front'?'Front':'Back'} · personal study sheet</h2>${DATA.cheats.filter(c=>S.cheat[c.id]?.choice==='include'&&S.cheat[c.id].side===side).map(c=>`<div class="sheet-item"><strong>${c.concept} · ${esc(C[c.concept].shortTitle)}</strong><p>${esc(c.text)}</p>${c.concept==='R07'?'<p>Only explicit constructors are established here. Universal balanced-string completeness and the empty-string convention remain unresolved.</p>':''}</div>`).join('')||'<p>No candidates assigned to this side.</p>'}</section>`).join('')}
function previewCheat(print=false){const sheets=makeSheets();$('#print-area').innerHTML=sheets;if($('#cheat-preview'))$('#cheat-preview').innerHTML=`<div class="print-preview">${sheets}</div>`;
 const host=$('#cheat-preview');let overflow=false;if(host){for(const el of host.querySelectorAll('.sheet')){el.style.height='277mm';if(el.scrollWidth>el.clientWidth+2||el.scrollHeight>el.clientHeight+2)overflow=true}$('#print-feedback').innerHTML=overflow?'<strong class="error">Overflow detected: reduce included items or font size, or move items to the other side before printing. Extra columns/pages may otherwise be produced.</strong>':'Estimated content fits two sides at this size. Still verify physical A4 print preview and printer margins.'}
 if(print){if(overflow){toast('Printing paused: fix the visible overflow first.');return}if(!DATA.cheats.some(c=>S.cheat[c.id]?.choice==='include')){toast('Include at least one candidate first.');return}window.print()}}
function backup(){return title('Portable progress / local settings','Keep a copy of your work','The HTML holds the course content. A separate JSON backup transfers your progress between devices and browsers.')+`<div class="card"><label>Appearance<select id="theme">${options(['system','light','dark'],S.settings.theme)}</select></label><p class="live-note">Storage status: ${storageOK?'localStorage available':'memory only — export before closing'}. File-browser storage behaviour varies by device. Open this HTML in a browser that executes JavaScript; a file preview may not run the app.</p></div><div class="grid two"><div class="card"><h2>Export progress</h2><p>Includes reading, attempts, mistakes, mock records and any active mock, cheat choices and settings. Mastery is recalculated from attempts.</p>${button('Export Progress JSON','export','','primary')}<p class="live-note">If downloading is blocked, use the text backup below.</p>${button('Show backup text','backup-text')}<div id="backup-text"></div></div><div class="card"><h2>Import progress</h2><label>Choose a JSON progress file<input type="file" id="import-file" accept=".json,application/json"></label><p>Or paste the exported JSON:</p><label class="sr-only" for="import-text">Progress JSON</label><textarea id="import-text" placeholder="Paste progress JSON here"></textarea>${button('Validate import','validate-import')}<div id="import-status" role="status"></div><p class="live-note">Imports replace this browser’s app record after validation and a preview. Export first if you want to keep both histories. Other subjects are rejected. Unfinished practice answers do not transfer; completed attempts and active mocks do.</p></div></div><div class="card"><h2>Reset this app’s progress</h2><p>Removes this assessment’s local record only. It does not alter any course file or another app’s storage.</p><label>Type RESET to enable reset<input id="reset-text" autocomplete="off" placeholder="RESET"></label><div class="actions">${button('Reset Progress','reset','','danger')}</div></div><details><summary>Content provenance and app behaviour</summary><div class="detail-body"><p>This file embeds the complete approved teaching content, map, profile and coverage. Source PDFs are cited by physical page but are not bundled as separate files. The relevant teaching illustrations are embedded. App schema: ${VERSION}; assessment: ${APP_ID}.</p><p>All question answers and explanations are embedded, so this is a study tool, not secure examination software. Written work and mock marks require honest self-assessment. Storage never leaves your browser except through your chosen JSON export.</p><pre class="break">${esc(JSON.stringify(DATA.fingerprints,null,2))}</pre></div></details>`}
let pendingImport=null;
function stageImport(text){try{if(text.length>30000000)throw Error('Backup is too large.');pendingImport=validate(JSON.parse(text));$('#import-status').innerHTML=`<div class="callout">Valid Quiz 2 backup: ${pendingImport.attempts.length} attempts, ${pendingImport.mistakes.length} mistakes, ${pendingImport.mockRuns.length} completed mocks.<p>This replaces the current ${S.attempts.length} attempts.</p>${button('Replace with imported progress','apply-import','','primary')}</div>`}catch(e){pendingImport=null;$('#import-status').innerHTML=`<p class="error">Import rejected: ${esc(e.message)}</p>`}}
function download(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='quiz2-progress-'+day(Date.now())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Progress export requested. Keep the JSON with your backups.');}
function modal(message,action){const d=$('#dialog');d.innerHTML=`<h2>Please confirm</h2><p>${esc(message)}</p><div class="actions">${button('Confirm',action,'','primary')}${button('Cancel','close-dialog')}</div>`;d.showModal()}
function closeDialog(){if($('#dialog').open)$('#dialog').close()}
function route(){const [target,id]=location.hash.slice(1).split('-');page=pages[target]?target:'dashboard';filters={search:'',priority:'',concept:'',mastery:'',type:'',chapter:'',section:'',teaching:'',category:''};if(id&&C[id])filters.concept=id;render();if(page==='learn'&&id&&C[id]){const d=$('#lesson-'+id);if(d){d.open=true;d.scrollIntoView({block:'start'})}}else window.scrollTo(0,0)}
function exposureHistory(){return `<details><summary>Recently opened questions and model reveals</summary><div class="detail-body"><p>Exposure is tracked separately from submitted, self-checked performance. It never creates mastery evidence.</p>${S.history.slice(-20).reverse().map(h=>`<p>${h.qid} · ${h.action==='opened'?'question opened':'model revealed'} · ${h.mode} · ${esc(date(h.time))}</p>`).join('')||'<p>No exposure history yet.</p>'}</div></details>`}
function render(){theme();storageWarning();$('#nav').innerHTML=Object.entries(pages).map(([id,label])=>`<a href="#${id}" ${id===page?'aria-current="page"':''}>${label}</a>`).join('');const views={dashboard,learn,map,practice,mistakes,mocks,readiness,cheat,backup};$('#view').innerHTML=views[page]()+(page==='practice'?exposureHistory():'');document.title=pages[page]+' · Quiz 2';timerTick()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;
 if(a==='clear-filters'){for(const k in filters)filters[k]='';render()}
 if(a==='read'){const open=$('#lesson-'+id)?.open;S.read[id]=!S.read[id];persist();render();if(open)$('#lesson-'+id).open=true}
 if(a==='recommended'){S.settings.mode='mixed';persist();location.hash='practice';if(page==='practice'){filters.concept='';nextQuestion()}else setTimeout(nextQuestion,0)}
 if(a==='next')nextQuestion();if(a==='question')startQuestion(id);
 if(a==='submit-answer'||a==='skip-answer'){const p=S.practice,q=Q[p.qid];if(p.submitted)return;if(a==='submit-answer'&&((q.options&&p.choice===null)||(!q.options&&!p.response.trim()))){toast('Enter an answer first, or choose Show model / skip.');return}if(a==='skip-answer')p.assisted=true;p.submitted=true;S.history.push({qid:q.id,time:Date.now(),action:'model',mode:p.mode});persist();render()}
 if(a==='rate-all')$$('.rating').forEach(el=>el.value=e.target.closest('[data-rating]').dataset.rating);
 if(a==='save-attempt')saveAttempt();
 if(a==='resolve'){const m=S.mistakes.find(m=>m.id===id);m.resolved=!m.resolved;persist();render()}
 if(a==='retry-mistake'){S.settings.mode='mistake';page='practice';history.replaceState(null,'','#practice');filters.concept='';startQuestion(id)}
 if(a==='mistake-practice'){S.settings.mode='mistake';persist();location.hash='practice'}
 if(a==='start-mock'){S.activeMock={id:uid(),set:id,started:Date.now(),deadline:Date.now()+3600000,status:'running',answers:{},marks:{},ratings:{},assisted:false};S.activeMock.deadline=S.activeMock.started+3600000;for(const qid of DATA.mocks.find(m=>m.id===id).questions)S.history.push({qid,time:Date.now(),action:'opened',mode:'mock'});persist();render();timerTick()}
 if(a==='submit-mock')modal('Submit this practice mock now? Answers will become read-only and model solutions will open.','confirm-submit-mock');
 if(a==='confirm-submit-mock'){closeDialog();submitMock()}
 if(a==='discard-mock')modal('Discard this unfinished mock? Its unsaved score will not enter your performance history.','confirm-discard-mock');
 if(a==='confirm-discard-mock'){closeDialog();S.activeMock=null;persist();render()}
 if(a==='grade-mock')gradeMock();if(a==='preview-cheat')previewCheat();if(a==='print-cheat')previewCheat(true);
 if(a==='export')download();if(a==='backup-text')$('#backup-text').innerHTML=`<label>Copy this JSON<textarea readonly id="export-text">${esc(JSON.stringify(S,null,2))}</textarea></label>`;
 if(a==='validate-import')stageImport($('#import-text').value);
 if(a==='apply-import'&&pendingImport){S=pendingImport;pendingImport=null;storageOK=true;persist();render();toast('Imported progress applied. Mastery recalculated from practice evidence.');}
 if(a==='reset'){if($('#reset-text').value!=='RESET'){toast('Type RESET exactly to confirm clearing this app’s progress.');return}modal('Delete this Quiz 2 app’s local progress? Export first if you may need it.','confirm-reset')}
 if(a==='confirm-reset'){closeDialog();try{localStorage.removeItem(KEY);storageOK=true;loadError=''}catch(err){storageOK=false;loadError='Storage could not be cleared. This tab has been reset in memory only.'}S=fresh();pendingImport=null;practiceSession=[];persist();render();toast('Quiz 2 progress reset. All concepts are unassessed.');}
 if(a==='close-dialog')closeDialog();
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.filter&&el.tagName==='INPUT'){filters[el.dataset.filter]=el.value;clearTimeout(render.searchTimer);const pos=el.selectionStart;render.searchTimer=setTimeout(()=>{render();const n=document.querySelector(`[data-filter="${el.dataset.filter}"]`);if(n){n.focus();n.setSelectionRange(pos,pos)}},180)}
 if(el.id==='response'&&S.practice&&!S.practice.submitted){S.practice.response=el.value.slice(0,30000);persist()}
 if(el.classList.contains('mock-answer')&&S.activeMock?.status==='running'){S.activeMock.answers[el.dataset.id]=el.value.slice(0,30000);persist()}
 if(el.classList.contains('mock-mark')&&S.activeMock){const n=Number(el.value);if(el.value===''||!Number.isInteger(n)||n<0||n>Q[el.dataset.id].rubric.length)delete S.activeMock.marks[el.dataset.id];else S.activeMock.marks[el.dataset.id]=n;persist()}
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.filter){filters[el.dataset.filter]=el.value;render()}
 if(el.id==='mode'){S.settings.mode=el.value;persist();render()}
 if(el.name==='choice'&&S.practice&&!S.practice.submitted){S.practice.choice=Number(el.value);persist()}
 if(el.id==='assisted'&&S.practice&&!S.practice.submitted){S.practice.assisted=el.checked;persist()}
 if(el.id==='mock-assisted'&&S.activeMock){S.activeMock.assisted=el.checked;persist()}
 if(el.classList.contains('mock-rating')&&S.activeMock){if(el.value)S.activeMock.ratings[el.dataset.id]=el.value;else delete S.activeMock.ratings[el.dataset.id];persist()}
 if(el.classList.contains('cheat-choice')||el.classList.contains('cheat-side')){const id=el.dataset.id;S.cheat[id]??={choice:'unsure',side:'front'};S.cheat[id][el.classList.contains('cheat-choice')?'choice':'side']=el.value;persist();render()}
 if(el.id==='print-size'){const value=Number(el.value);if(value>=7&&value<=14)S.settings.printSize=value;persist();render()}
 if(el.id==='theme'){S.settings.theme=el.value;persist();theme()}
 if(el.id==='import-file'&&el.files[0]){const f=el.files[0];if(f.size>30000000){toast('Backup is too large.');return}const reader=new FileReader();reader.onload=()=>stageImport(String(reader.result));reader.onerror=()=>toast('Could not read the selected file.');reader.readAsText(f)}
});
window.addEventListener('hashchange',route);window.addEventListener('storage',e=>{if(e.key===KEY)toast('Progress changed in another tab. Reload before doing more work here to avoid overwriting it.');});
setInterval(timerTick,1000);route();persist();
</script></body></html>
