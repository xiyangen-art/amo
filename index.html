ree concepts are included; traversals, spanning trees and the broader Chapter 11 theory are not added.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Giving a leaf height 1; counting edges as vertices; summing subtree heights; thinking full means perfect; forgetting the added root in either formula.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> leaf: (h,n)=(0,1); join: h=1+max(h_1,h_2), n=1+n_1+n_2.\u003c/p>\n\u003cp>Source: C5 pp. 52–55,59; T05 P5; diagram directly rendered from the inspected PDF.\u003c/p>", "search": "\n\nWhat it means. A rooted tree has a distinguished root. The Chapter 5 recursive construction begins with a single vertex; a new root can be attached to the roots of disjoint rooted trees. A full binary tree uses exactly two subtrees whenever a new non-leaf root is formed; its basis is a single vertex. “Full” does not require equal subtree heights or that every level be filled.\n\nFor a single vertex, height h=0 and vertex count n=1. For T formed from full binary subtrees T_1,T_2,\n\nh(T)=1+max(h(T_1),h(T_2)), while n(T)=1+n(T_1)+n(T_2).\n\nHeight measures the longest root-to-leaf path in edges. Size counts all vertices, including the root. These are different quantities and therefore use max versus addition.\n\nHow to use it. Decompose at the root. Identify the two disjoint child subtrees. Compute each subtree's height and size first, then combine with the recursions. For a proof, the same decomposition tells you which two hypotheses structural induction may use.\n\nWorked examples — analogous, using the lecture constructors. A root with two single-vertex children has h=1+max(0,0)=1 and n=1+1+1=3. Attach a new root above that tree and a single leaf: h=1+max(1,0)=2 and n=1+3+1=5. This five-vertex tree is full even though its leaves have different depths. Joining two three-vertex trees under a root gives h=2 and n=7. Equal height therefore does not imply equal size. A root with three single-vertex children is a rooted tree with height 1 and size 4, but is not a full binary tree: its non-leaf root has three children, not two.\n\n![Original Chapter 5 tree construction, physical page 55](assets/chapter5-page-55.png)\n\nThe original diagram shows the single-vertex basis, the first two-child tree, and two asymmetric next constructions. Read those as applications of the same two-subtree rule, not a requirement of symmetry.\n\nQuiz 2 style. T05 P5 supplies height/vertex-count terminology and requests a structural proof. Only these Chapter 5 tree concepts are included; traversals, spanning trees and the broader Chapter 11 theory are not added.\n\nCommon traps. Giving a leaf height 1; counting edges as vertices; summing subtree heights; thinking full means perfect; forgetting the added root in either formula.\n\nCHEAT SHEET CANDIDATE: leaf: (h,n)=(0,1); join: h=1+max(h_1,h_2), n=1+n_1+n_2.\n\nSource: C5 pp. 52–55,59; T05 P5; diagram directly rendered from the inspected PDF.\n\na id=\"r09\"/a\n\n", "shortTitle": "Recursive trees, height and vertex count", "part": "Part 9 — structural induction and trees"}, {"id": "R09", "title": "Structural-induction bounds on full binary trees", "section": "Chapter 5, Section 5.3 — Recursion and structural induction", "chapter": "Chapter 5", "priority": "L2", "source": "C5 pp. 58–60; T05 P5", "ability": "Build a structural proof using subtree hypotheses and the height/size recursions. Multi-step proof, inequality application", "prereq": "R05,R08; inequalities; powers", "confusion": "Lecture upper bound versus tutorial lower bound; max of heights versus sum of sizes", "visual": "V p. 60 and T05 p. 1; formulas recorded below", "confidence": "CONFIRMED / L2", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> The lectures prove n(T)≤2^(h(T)+1)−1; T05 P5 asks for n(T)≥2h(T)+1. One is an upper bound and the other a lower bound. They are compatible: a full tree can be narrow and asymmetric or wide and balanced.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Use structural induction, not induction on an assumed shape. Verify the one-vertex basis. Assume the desired bound for both child subtrees. Substitute into n=1+n_1+n_2 and compare their heights with H=max(h_1,h_2), so h(T)=H+1. The same decomposition supports both bounds but requires different inequalities.\u003c/p>\n\u003cp>\u003cstrong>Worked upper-bound proof — lecture argument, explained.\u003c/strong> Basis: 1≤2^(0+1)−1=1. Assume n_i≤2^(h_i+1)−1 for i=1,2. Then\u003c/p>\n\u003cp>n(T)≤1+[2^(h_1+1)−1]+[2^(h_2+1)−1]\u003c/p>\n\u003cp>=2^(h_1+1)+2^(h_2+1)−1≤2·2^(H+1)−1\u003c/p>\n\u003cp>=2^(h(T)+1)−1.\u003c/p>\n\u003cp>The comparison works because each h_i≤H and powers of 2 increase with the exponent.\u003c/p>\n\u003cp>\u003cstrong>Worked lower-bound proof — derived T05 P5.\u003c/strong> Basis: 1≥2·0+1. Assuming n_i≥2h_i+1,\u003c/p>\n\u003cp>n(T)≥1+(2h_1+1)+(2h_2+1)=2(h_1+h_2)+3\u003c/p>\n\u003cp>≥2H+3=2(H+1)+1=2h(T)+1,\u003c/p>\n\u003cp>since h_1,h_2≥0 implies h_1+h_2≥max(h_1,h_2). Thus structural induction proves the claim for every full binary tree.\u003c/p>\n\u003cp>\u003cstrong>Worked interpretation — analogous.\u003c/strong> At height 2, the bounds are 5≤n≤7. R08 constructed examples with 5 and 7 vertices. A three-vertex full tree has height 1, so it is not a counterexample to the height-2 lower bound.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> A complete proof must give the leaf case and explain how the constructor preserves the inequality. T05 P5 directly supports this demand.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Replacing max by a sum in the height recursion; using the upper bound to prove the lower; losing the +1 in the exponent; assuming both subtrees have height H.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> 2h+1≤n≤2^(h+1)−1 for full binary trees; set H=max(h_1,h_2) and use both subtree hypotheses.\u003c/p>\n\u003cp>Source: C5 pp. 58–60; T05 P5.\u003c/p>", "search": "\n\nWhat it means. The lectures prove n(T)≤2^(h(T)+1)−1; T05 P5 asks for n(T)≥2h(T)+1. One is an upper bound and the other a lower bound. They are compatible: a full tree can be narrow and asymmetric or wide and balanced.\n\nHow to use it. Use structural induction, not induction on an assumed shape. Verify the one-vertex basis. Assume the desired bound for both child subtrees. Substitute into n=1+n_1+n_2 and compare their heights with H=max(h_1,h_2), so h(T)=H+1. The same decomposition supports both bounds but requires different inequalities.\n\nWorked upper-bound proof — lecture argument, explained. Basis: 1≤2^(0+1)−1=1. Assume n_i≤2^(h_i+1)−1 for i=1,2. Then\n\nn(T)≤1+[2^(h_1+1)−1]+[2^(h_2+1)−1]\n\n=2^(h_1+1)+2^(h_2+1)−1≤2·2^(H+1)−1\n\n=2^(h(T)+1)−1.\n\nThe comparison works because each h_i≤H and powers of 2 increase with the exponent.\n\nWorked lower-bound proof — derived T05 P5. Basis: 1≥2·0+1. Assuming n_i≥2h_i+1,\n\nn(T)≥1+(2h_1+1)+(2h_2+1)=2(h_1+h_2)+3\n\n≥2H+3=2(H+1)+1=2h(T)+1,\n\nsince h_1,h_2≥0 implies h_1+h_2≥max(h_1,h_2). Thus structural induction proves the claim for every full binary tree.\n\nWorked interpretation — analogous. At height 2, the bounds are 5≤n≤7. R08 constructed examples with 5 and 7 vertices. A three-vertex full tree has height 1, so it is not a counterexample to the height-2 lower bound.\n\nQuiz 2 style. A complete proof must give the leaf case and explain how the constructor preserves the inequality. T05 P5 directly supports this demand.\n\nCommon traps. Replacing max by a sum in the height recursion; using the upper bound to prove the lower; losing the +1 in the exponent; assuming both subtrees have height H.\n\nCHEAT SHEET CANDIDATE: 2h+1≤n≤2^(h+1)−1 for full binary trees; set H=max(h_1,h_2) and use both subtree hypotheses.\n\nSource: C5 pp. 58–60; T05 P5.\n\n", "shortTitle": "Structural induction for full-binary-tree bounds", "part": "Part 9 — structural induction and trees"}, {"id": "R10", "title": "Generalized induction on ordered pairs", "section": "Chapter 5, Section 5.3 — Recursion and structural induction", "chapter": "Chapter 5", "priority": "L3", "source": "C5 pp. 61–62; —", "ability": "Interpret the supported order on nonnegative integer pairs and complete the two-branch inductive proof. Definition, proof completion", "prereq": "I10,R01; ordered pairs; case distinction", "confusion": "Strict versus non-strict lexicographic order; induction on pairs versus Chapter 9 general relation theory", "visual": "V pp. 61–62; Q strict/non-strict wording", "confidence": "CONFIRMED / L3 topic", "status": "TAUGHT", "html": "\u003cp>\u003cstrong>What it means.\u003c/strong> Induction can follow a well-order other than the usual order on single integers. For pairs in N×N, use strict lexicographic order: (a,b)&lt;(c,d) when a&lt;c, or when a=c and b&lt;d. Compare the first coordinates first; compare second coordinates only when the first tie. This is the specific Chapter 5 example, not a new unit on Chapter 9 relations.\u003c/p>\n\u003cp>Every nonempty subset of N×N has a least pair under this order: choose the least first coordinate appearing, then the least second coordinate among pairs with that first coordinate. Generalized induction assumes the statement for all strictly earlier pairs and proves it for the current pair. The original p. 61 says “less than or equal” while displaying a strict condition; the p. 62 proof uses the strict interpretation taught here.\u003c/p>\n\u003cp>\u003cstrong>How to use it.\u003c/strong> Identify the basis and the recursive branches. For each branch, show the referenced pair is earlier and still nonnegative. Apply the corresponding hypothesis, substitute the claimed formula and simplify. Earlier does not mean both coordinates are smaller: (1,100)&lt;(2,0).\u003c/p>\n\u003cp>\u003cstrong>Worked example — lecture example, explained.\u003c/strong> Define a_(0,0)=0 and, for other nonnegative pairs,\u003c/p>\n\u003cul>\u003cli>a_(m,0)=a_(m−1,0)+1 when m&gt;0;\u003c/li>\u003cli>a_(m,n)=a_(m,n−1)+n when n&gt;0.\u003c/li>\u003c/ul>\n\u003cp>Claim a_(m,n)=m+n(n+1)/2. At (0,0) it is 0. Assume the formula for every earlier pair. If n=0,m&gt;0, (m−1,0) is earlier, giving a_(m,0)=(m−1)+0+1=m. If n&gt;0, (m,n−1) is earlier, giving a_(m,n)=m+(n−1)n/2+n=m+n(n+1)/2. Both branches preserve the claim. For example a_(2,3)=2+3·4/2=8; recursively the row has a_(2,0)=2,a_(2,1)=3,a_(2,2)=5,a_(2,3)=8.\u003c/p>\n\u003cp>\u003cstrong>Source distinction.\u003c/strong> Well-ordering of nonnegative pairs in this lexicographic order is valid. It does not validate the slide&#x27;s separate blanket assertion about arbitrary finite strings in dictionary order. Those are different domains.\u003c/p>\n\u003cp>\u003cstrong>Quiz 2 style.\u003c/strong> The lecture supports interpreting the definition and completing the two-case proof. No approved tutorial expands this to arbitrary ordered structures.\u003c/p>\n\u003cp>\u003cstrong>Common traps.\u003c/strong> Using ≤ while excluding equality inconsistently; assuming the current pair; decreasing m when m=0; treating lexicographic order as comparing sums; demanding both coordinates decrease.\u003c/p>\n\u003cp>\u003cstrong>CHEAT SHEET CANDIDATE:\u003c/strong> compare first coordinate, then second; hypothesis covers strictly earlier pairs; verify each recursive branch points backwards and stays in N×N.\u003c/p>\n\u003cp>Source: C5 pp. 61–62; original piecewise definition visually checked.\u003c/p>", "search": "\n\nWhat it means. Induction can follow a well-order other than the usual order on single integers. For pairs in N×N, use strict lexicographic order: (a,b)(c,d) when ac, or when a=c and bd. Compare the first coordinates first; compare second coordinates only when the first tie. This is the specific Chapter 5 example, not a new unit on Chapter 9 relations.\n\nEvery nonempty subset of N×N has a least pair under this order: choose the least first coordinate appearing, then the least second coordinate among pairs with that first coordinate. Generalized induction assumes the statement for all strictly earlier pairs and proves it for the current pair. The original p. 61 says “less than or equal” while displaying a strict condition; the p. 62 proof uses the strict interpretation taught here.\n\nHow to use it. Identify the basis and the recursive branches. For each branch, show the referenced pair is earlier and still nonnegative. Apply the corresponding hypothesis, substitute the claimed formula and simplify. Earlier does not mean both coordinates are smaller: (1,100)(2,0).\n\nWorked example — lecture example, explained. Define a_(0,0)=0 and, for other nonnegative pairs,\n\n- a_(m,0)=a_(m−1,0)+1 when m0;\n- a_(m,n)=a_(m,n−1)+n when n0.\n\nClaim a_(m,n)=m+n(n+1)/2. At (0,0) it is 0. Assume the formula for every earlier pair. If n=0,m0, (m−1,0) is earlier, giving a_(m,0)=(m−1)+0+1=m. If n0, (m,n−1) is earlier, giving a_(m,n)=m+(n−1)n/2+n=m+n(n+1)/2. Both branches preserve the claim. For example a_(2,3)=2+3·4/2=8; recursively the row has a_(2,0)=2,a_(2,1)=3,a_(2,2)=5,a_(2,3)=8.\n\nSource distinction. Well-ordering of nonnegative pairs in this lexicographic order is valid. It does not validate the slide's separate blanket assertion about arbitrary finite strings in dictionary order. Those are different domains.\n\nQuiz 2 style. The lecture supports interpreting the definition and completing the two-case proof. No approved tutorial expands this to arbitrary ordered structures.\n\nCommon traps. Using ≤ while excluding equality inconsistently; assuming the current pair; decreasing m when m=0; treating lexicographic order as comparing sums; demanding both coordinates decrease.\n\nCHEAT SHEET CANDIDATE: compare first coordinate, then second; hypothesis covers strictly earlier pairs; verify each recursive branch points backwards and stays in N×N.\n\nSource: C5 pp. 61–62; original piecewise definition visually checked.\n\n", "shortTitle": "Generalized induction on nonnegative integer pairs", "part": "Part 11 — Level 3 material"}], "order": ["N01", "N02", "N03", "N04", "N05", "N06", "N07", "N08", "N09", "N14", "N15", "N16", "N17", "N19", "N20", "N21", "N22", "I01", "I02", "I03", "I04", "I07", "I08", "I10", "I11", "N18", "R01", "R02", "R04", "R05", "R08", "R09", "N10", "N11", "N12", "N23", "N25", "N26", "I05", "I06", "I09", "R06", "R07", "N13", "N24", "R03", "R10"], "questions": [{"id": "Q001", "concepts": ["N01"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "For integers a,b,d with d≠0, assume d divides a and b. Prove d divides 5a−3b.", "answer": "Write a=ds and b=dt with s,t integers. Then 5a−3b=d(5s−3t). Since 5s−3t is an integer, d divides this expression.", "rubric": ["State integer witnesses", "Factor out d", "Establish integer coefficient"], "trap": "A divisibility proof needs an integer witness, not merely a real quotient.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 6–8; T03 P7; T04 P7,17 use these facts"]}, {"id": "Q002", "concepts": ["N01"], "skill": "conceptual", "type": "Counterexample", "difficulty": "Standard", "prompt": "Disprove: if a divides bc, then a divides b or a divides c. Explain a condition that would repair the statement.", "answer": "Take a=10,b=2,c=5. Then 10 divides 10 but divides neither 2 nor 5. Requiring a to be prime repairs the claim by the prime-divisor lemma.", "rubric": ["Verify the premise", "Disprove both alternatives", "State the prime condition"], "trap": "A composite divisor can split its prime factors across the two factors.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 6–8; T03 P7; T04 P7,17 use these facts"]}, {"id": "Q003", "concepts": ["N02"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Find −47 div 9 and −47 mod 9, showing the required remainder bounds.", "answer": "−47=9(−6)+7 and 0≤7\u003c9. Thus the quotient is −6 and the remainder is 7. The quotient −5 would give remainder −2, which is invalid.", "rubric": ["Correct decomposition", "Nonnegative remainder less than 9", "Correct div and mod"], "trap": "Truncating toward zero gives the wrong quotient for this negative dividend.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 9–10; C5 p. 34; T03 P8; T04 P17(d)"]}, {"id": "Q004", "concepts": ["N02"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Prove uniqueness in the division algorithm: if a=dq+r=dq′+r′, d>0 and 0≤r,r′\u003cd, then q=q′ and r=r′.", "answer": "Subtract to obtain d(q−q′)=r′−r. The right side lies strictly between −d and d. The only multiple of positive d in this interval is 0. Hence r′=r, and d(q−q′)=0 implies q=q′.", "rubric": ["Subtract the equalities", "Use strict bounds on the difference", "Conclude both equalities"], "trap": "The condition d>0 and the remainder interval are essential.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 9–10; C5 p. 34; T03 P8; T04 P17(d)"]}, {"id": "Q005", "concepts": ["N03"], "skill": "conceptual", "type": "MCQ", "difficulty": "Standard", "prompt": "For integers a,b and m>0, which statement is equivalent to a≡b (mod m)?", "answer": "The difference is an integer multiple of m: a−b=km for some integer k. This is exactly m divides a−b.", "rubric": ["Choose the integer-multiple statement"], "trap": "Congruence is not ordinary equality.", "options": ["a−b=km for some integer k", "a=b", "a mod m=b for every integer representative b", "a−b divides m"], "key": 0, "optionReasons": ["This is the defining divisibility condition.", "Equality implies congruence but is not necessary.", "b need not be the standard remainder.", "This reverses the divisibility direction."], "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 11–13; T03 P9–11; T04 P4"]}, {"id": "Q006", "concepts": ["N03"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Prove that an integer square is congruent to 0 or 1 modulo 4.", "answer": "Every integer is 2k or 2k+1 for an integer k. In the even case (2k)²=4k²≡0. In the odd case (2k+1)²=4k(k+1)+1≡1. These cases include negative integers and exhaust the domain.", "rubric": ["Exhaustive parity cases", "Even case", "Odd case"], "trap": "Checking four numerical examples alone does not prove the universal claim.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 11–13; T03 P9–11; T04 P4"]}, {"id": "Q007", "concepts": ["N04"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Compute (52·39+31) mod 7 using congruence arithmetic.", "answer": "52≡3,39≡4,31≡3 (mod 7). Addition and multiplication preserve congruence, so the expression is congruent to 3·4+3=15≡1. The standard remainder is 1.", "rubric": ["Reduce the inputs", "Use valid operations", "Reduce final result"], "trap": "An intermediate residue such as 15 is not the standard remainder.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 14–16; T03 P9–11; T04 P4,6"]}, {"id": "Q008", "concepts": ["N04"], "skill": "proof", "type": "Justification", "difficulty": "Standard", "prompt": "A student cancels 6 from 18≡6 (mod 12), obtaining 3≡1 (mod 12). Diagnose the error.", "answer": "The premise is true because 12 divides 18−6. The conclusion is false because 12 does not divide 2. Cancellation modulo the same modulus requires the cancelled factor to be coprime to that modulus; gcd(6,12)=6.", "rubric": ["Verify premise", "Refute conclusion", "Identify missing coprimality"], "trap": "Ordinary division is not automatically valid in a congruence.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 14–16; T03 P9–11; T04 P4,6"]}, {"id": "Q009", "concepts": ["N05"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "In Z₉ compute 7+₉6, 7·₉6, and the additive inverse of 7.", "answer": "Reduce each integer result: 13 mod 9=4, 42 mod 9=6. The additive inverse is 2 because 7+2≡0 (mod 9).", "rubric": ["Sum 4", "Product 6", "Additive inverse 2"], "trap": "An additive inverse sums to zero, not one.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 17–19; —"]}, {"id": "Q010", "concepts": ["N05"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "Explain why 3 has an additive inverse but no multiplicative inverse in Z₉.", "answer": "Its additive inverse is 6 since 3+6≡0. Products 3x have residues only 0,3,6 modulo 9, so none equals 1. Equivalently gcd(3,9)≠1. Additive inverses exist for every residue, unlike multiplicative inverses.", "rubric": ["Additive inverse and check", "Show no product can be 1", "Distinguish the inverse types"], "trap": "Do not confuse −3 with a modular reciprocal.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 17–19; —"]}, {"id": "Q011", "concepts": ["N06"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "The base-5 numeral (2x3)₅ has decimal value 68. Find digit x and check its admissibility.", "answer": "2·5²+x·5+3=68 gives 5x=15, hence x=3. It is a valid base-5 digit because 0≤3\u003c5. The leading digit 2 is nonzero.", "rubric": ["Positional expansion", "Solve x=3", "Check digit constraints"], "trap": "The string 2x3 is a numeral, not multiplication.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 22–26; T03 P12–13"]}, {"id": "Q012", "concepts": ["N06"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "Is (572)₆ a valid numeral? State the digit and leading-digit conditions for a canonical positive base-b numeral.", "answer": "No: the digit 7 is not allowed in base 6. For integer b≥2 every digit is an integer from 0 to b−1. In a canonical positive numeral the leading digit is nonzero; internal zeros are permitted.", "rubric": ["Identify invalid digit", "State digit range", "State leading condition"], "trap": "A positional expression may have a numerical value even when its written digits are not a valid numeral.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 22–26; T03 P12–13"]}, {"id": "Q013", "concepts": ["N07"], "skill": "calculation", "type": "Conversion", "difficulty": "Standard", "prompt": "Convert (2BD)₁₆ to decimal, showing the expansion.", "answer": "B=11 and D=13. Thus 2·16²+11·16+13=512+176+13=701.", "rubric": ["Interpret letters", "Use positional weights", "Obtain 701"], "trap": "The rightmost position has weight 16⁰, not 16¹.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 24–28; T03 P12(a–c),13"]}, {"id": "Q014", "concepts": ["N07"], "skill": "calculation", "type": "Conversion", "difficulty": "Standard", "prompt": "Convert decimal 173 to binary using repeated division and verify the result.", "answer": "Successive quotient/remainder pairs on dividing by 2 are (86,1),(43,0),(21,1),(10,1),(5,0),(2,1),(1,0),(0,1). Read the remainders backwards: 10101101. Check 128+32+8+4+1=173.", "rubric": ["Correct division chain", "Reverse remainder order", "Verify by expansion"], "trap": "The first remainder is the least significant digit.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 24–28; T03 P12(a–c),13"]}, {"id": "Q015", "concepts": ["N08"], "skill": "calculation", "type": "Conversion", "difficulty": "Standard", "prompt": "Convert (6D)₁₆ to octal through binary grouping.", "answer": "6D becomes 0110|1101. Group from the right in threes, padding only at the left: 001|101|101. Thus the octal numeral is 155. Both representations have value 109.", "rubric": ["Four-bit hexadecimal blocks", "Three-bit regrouping", "Octal 155"], "trap": "Padding the right changes the value.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 29–30; T03 P12 related, not a direct block-conversion task"]}, {"id": "Q016", "concepts": ["N08"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "A student converts (40)₁₆ to binary by joining 100 and 0, giving 1000. Explain and correct the error.", "answer": "Each hexadecimal digit needs a four-bit block: 4 is 0100 and 0 is 0000. Joining gives 01000000, or 1000000 after removing leading zeros. This equals 64, whereas 1000₂ is 8.", "rubric": ["Require fixed block width", "Correct representation", "Value check"], "trap": "Zeros inside a numeral cannot be discarded.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 29–30; T03 P12 related, not a direct block-conversion task"]}, {"id": "Q017", "concepts": ["N09"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Find the prime factorisation of 756 and explain why 1 is neither prime nor composite.", "answer": "756=4·189=2²·3³·7. A prime has exactly two positive divisors; 1 has only one. A composite is an integer greater than 1 that is not prime, so 1 is excluded from both classes.", "rubric": ["Complete prime factorisation", "Definition of prime", "Correct status of 1"], "trap": "Do not include 1 as a prime factor.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 33–34; T04 P1–3"]}, {"id": "Q018", "concepts": ["N09"], "skill": "conceptual", "type": "Counterexample", "difficulty": "Standard", "prompt": "Disprove: the product of two distinct odd primes, plus 2, is always prime.", "answer": "Choose 11 and 13. They are distinct odd primes, but 11·13+2=145=5·29 is composite. This single admissible counterexample disproves the universal claim.", "rubric": ["Admissible primes", "Correct calculation", "Exhibit factors"], "trap": "A counterexample must satisfy every hypothesis.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 33–34; T04 P1–3"]}, {"id": "Q019", "concepts": ["N10"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Determine whether 113 is prime using square-root trial division. Explain when you can stop.", "answer": "√113 is between 10 and 11. Test primes 2,3,5,7: none divides 113 (for 7 the remainder is 1). Any composite has a prime divisor at most its square root. All such primes have been excluded, so 113 is prime.", "rubric": ["Correct stopping bound", "All required prime tests", "Justified conclusion"], "trap": "Testing only 2,3,5 would leave 7 unchecked.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 35–37; T04 P1 indirectly"]}, {"id": "Q020", "concepts": ["N10"], "skill": "proof", "type": "Justification", "difficulty": "Standard", "prompt": "Why does a sieve up to 50 only need crossing-out stages for primes 2,3,5,7? Why may a stage for p start at p²?", "answer": "A composite n≤50 has a prime factor at most √n≤√50\u003c8. These four primes therefore suffice. A smaller multiple kp with 2≤k\u003cp has a prime factor below p and was removed earlier. Keep p itself and begin new removals at p².", "rubric": ["Square-root argument", "Correct list of primes", "Justify p² start"], "trap": "Do not cross out the prime itself.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 35–37; T04 P1 indirectly"]}, {"id": "Q021", "concepts": ["N11"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Prove there are infinitely many primes. Explicitly avoid assuming that a product of primes plus 1 is itself prime.", "answer": "Suppose all primes form a finite list p₁,…,pₖ. Set N=p₁⋯pₖ+1>1. N has a prime divisor q. No listed pᵢ divides N, since it divides the product and would then divide their difference 1. Thus q is a prime outside the complete list, a contradiction. N need not itself be prime.", "rubric": ["Assume finite complete list", "Take a prime divisor of N", "Difference-1 contradiction"], "trap": "A new prime divisor is sufficient; primality of N is not justified.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 38,41; T04 P1 related"]}, {"id": "Q022", "concepts": ["N11"], "skill": "conceptual", "type": "Counterexample", "difficulty": "Standard", "prompt": "Test the assertion that n²+n+17 is prime for every nonnegative integer n.", "answer": "At n=16, the expression is 256+16+17=289=17², which is composite. Values that work for smaller n do not establish a universal theorem.", "rubric": ["Choose admissible n", "Evaluate correctly", "Show compositeness"], "trap": "Do not replace one polynomial counterexample with an unsupported claim about all prime-producing functions.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 38,41; T04 P1 related"]}, {"id": "Q023", "concepts": ["N12"], "skill": "calculation", "type": "Theorem application", "difficulty": "Standard", "prompt": "Using the Mersenne-prime construction with p=5, obtain a perfect number and verify it with a divisor sum.", "answer": "2⁵−1=31 is prime and N=2⁴·31=496. All divisors have form 2ⁱ31ʲ with 0≤i≤4 and j=0,1. Their sum is (1+2+4+8+16)(1+31)=31·32=992. The proper-divisor sum is 992−496=496.", "rubric": ["Check Mersenne prime", "Construct 496", "List divisor structure", "Proper-divisor sum equals N"], "trap": "Subtract N itself when passing from all divisors to proper divisors.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 p. 39; T04 P2 supplies the perfect-number definition/application"]}, {"id": "Q024", "concepts": ["N12"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "Does the fact that 11 is prime alone justify calling 2¹⁰(2¹¹−1) perfect by the supplied theorem?", "answer": "No. The theorem requires 2¹¹−1 itself to be prime. In fact 2047=23·89. A prime exponent is not sufficient to make its Mersenne number prime, so this theorem cannot be applied here.", "rubric": ["State required hypothesis", "Factor 2047", "Reject this application"], "trap": "Distinguish a necessary prime exponent from a sufficient Mersenne-prime condition.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 p. 39; T04 P2 supplies the perfect-number definition/application"]}, {"id": "Q025", "concepts": ["N13"], "skill": "calculation", "type": "Theorem application", "difficulty": "Standard", "prompt": "Use the prime number theorem estimate to approximate the number of primes ≤10,000, with ln(10,000)≈9.21034. Explain its limitation.", "answer": "π(x) is approximated by x/ln x for large x. Here 10,000/9.21034≈1086. This is an asymptotic estimate, not an exact count or an error guarantee at this x. The theorem states that the ratio tends to 1.", "rubric": ["Correct estimate expression", "Approximately 1086", "Asymptotic rather than exact"], "trap": "Do not assert that exactly 1086 primes occur.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L3", "sources": ["C4 pp. 40–42; —"]}, {"id": "Q026", "concepts": ["N13"], "skill": "conceptual", "type": "MCQ", "difficulty": "Standard", "prompt": "Which evidence would NOT by itself refute the claim that n²+1 is prime for infinitely many nonnegative integers n?", "answer": "One composite value, 3²+1=10, does not rule out infinitely many other prime values. The claim is not that every value is prime.", "rubric": ["Choose the single composite example"], "trap": "Keep the quantifiers “every” and “infinitely many” distinct.", "options": ["A proof that only finitely many n give prime values", "The observation that 3²+1=10 is composite", "A proof that all values after a fixed bound are composite", "A proof that no n greater than 100 gives a prime value"], "key": 1, "optionReasons": ["This directly negates infinitely many.", "A single exception does not settle an infinitude claim.", "Only finitely many candidate indices would remain.", "Again only finitely many indices could remain."], "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L3", "sources": ["C4 pp. 40–42; —"]}, {"id": "Q027", "concepts": ["N14"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Find gcd(360,840) and lcm(360,840) by prime factorisation, then check the product identity.", "answer": "360=2³3²5 and 840=2³3·5·7. Minimum exponents give gcd=2³3·5=120. Maximum exponents give lcm=2³3²5·7=2520. Their product 302400 equals 360·840.", "rubric": ["Factor both numbers", "Use minima for gcd", "Use maxima for lcm", "Check product"], "trap": "A missing prime has exponent zero.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 43–46; T04 P3–4,7"]}, {"id": "Q028", "concepts": ["N14"], "skill": "conceptual", "type": "Counterexample", "difficulty": "Standard", "prompt": "Show that gcd(a,b,c)=1 does not imply pairwise coprimality. Explain why the distinction matters for the stated CRT.", "answer": "For 6,10,15 the common gcd is 1, but the pairwise gcds are 2,3,5. The supplied CRT requires every pair of moduli to be coprime, not merely a common gcd of 1.", "rubric": ["Correct triple and common gcd", "Pairwise calculations", "Connect to CRT hypothesis"], "trap": "Do not apply the pairwise-coprime CRT to this triple.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 43–46; T04 P3–4,7"]}, {"id": "Q029", "concepts": ["N15"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Use the Euclidean algorithm to find gcd(414,270).", "answer": "414=270+144; 270=144+126; 144=126+18; 126=7·18+0. The last nonzero remainder is 18, hence the gcd is 18.", "rubric": ["Valid division chain", "Include termination", "Identify 18"], "trap": "The final quotient 7 is not the gcd.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 47–49; T04 P4–5,17"]}, {"id": "Q030", "concepts": ["N15"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Prove gcd(a,b)=gcd(b,r) when a=bq+r and b>0.", "answer": "If d divides a and b, it divides a−bq=r. Conversely, if d divides b and r, it divides bq+r=a. Thus the positive common divisors are exactly the same, so their greatest elements agree.", "rubric": ["Forward divisibility", "Reverse divisibility", "Conclude equality of gcds"], "trap": "Proving only one implication does not establish identical common-divisor sets.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 47–49; T04 P4–5,17"]}, {"id": "Q031", "concepts": ["N16"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Use the chain 414=270+144, 270=144+126, 144=126+18 to express 18 as a linear combination of 414 and 270.", "answer": "18=144−126=144−(270−144)=2·144−270=2(414−270)−270=2·414−3·270. The coefficients are 2 and −3; substitution gives 828−810=18.", "rubric": ["Back-substitute in reverse order", "Collect coefficients", "Verify identity"], "trap": "Bézout coefficients can be negative.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 50–51; T04 P5,17"]}, {"id": "Q032", "concepts": ["N16"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "If 1=sa+tb with integers s,t, prove gcd(a,b)=1. Give a numerical example.", "answer": "Every positive common divisor of a,b divides sa+tb=1, so it must be 1. Therefore the gcd is 1. For example 1=3·5−2·7 establishes gcd(5,7)=1.", "rubric": ["Common divisor divides combination", "Only positive divisor of 1", "Valid example"], "trap": "Real rather than integer coefficients would not prove coprimality.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 50–51; T04 P5,17"]}, {"id": "Q033", "concepts": ["N17"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Assume gcd(c,m)=1 and ca≡cb (mod m). Prove a≡b (mod m) using Bézout.", "answer": "There are integers s,t with sc+tm=1. Multiply by a−b: a−b=sc(a−b)+tm(a−b). The first term is divisible by m from the given congruence; the second plainly is. Hence m divides a−b.", "rubric": ["Invoke Bézout with correct condition", "Multiply identity", "Show both terms divisible"], "trap": "The cancelled factor must be coprime to the modulus.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 52,54; T04 P6–7"]}, {"id": "Q034", "concepts": ["N17"], "skill": "conceptual", "type": "MCQ", "difficulty": "Standard", "prompt": "Which condition guarantees that 8x≡8y (mod m) implies x≡y (mod m) for all integers x,y and m>1?", "answer": "gcd(8,m)=1 guarantees cancellation by the coprime cancellation theorem.", "rubric": ["Choose coprimality"], "trap": "The fact that both sides share a factor does not suffice.", "options": ["m is even", "x and y are nonzero", "gcd(8,m)=1", "8 divides m"], "key": 2, "optionReasons": ["Even moduli share a factor with 8.", "Nonzero x and y do not address invertibility of 8.", "Exactly the cancellation hypothesis.", "This makes the common-factor issue worse."], "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 52,54; T04 P6–7"]}, {"id": "Q035", "concepts": ["N18"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Prove by strong induction that every integer n≥2 is a product of primes.", "answer": "Base n=2 is prime. Assume the statement for every integer from 2 through k. For k+1, if it is prime it is already a one-factor product. Otherwise k+1=ab with 2≤a,b≤k. By the hypothesis both a,b are products of primes; multiplying gives a prime factorisation of k+1.", "rubric": ["Base 2", "Strong hypothesis", "Prime/composite cases", "Factors strictly smaller"], "trap": "A prime counts as a product with one prime factor.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 34,52–53; C5 p. 30; T04 P3 uses factorisation, not a full theorem proof"]}, {"id": "Q036", "concepts": ["N18"], "skill": "proof", "type": "Proof completion", "difficulty": "Challenge", "prompt": "Complete the uniqueness argument for prime factorisation, explaining what permits cancellation and why unmatched leftover factors are impossible.", "answer": "If p₁⋯pᵣ=q₁⋯qₛ, the prime-divisor lemma says p₁ divides one qⱼ, hence equals it since qⱼ is prime. Reorder and cancel the equal nonzero factors in the integer equality. Repeat. If one side runs out first, 1 would equal a nonempty product of primes, at least 2, impossible. Thus the factors match with multiplicity.", "rubric": ["Prime-divisor lemma", "Equality of matched primes", "Repeated valid cancellation", "No leftover product"], "trap": "Uniqueness includes multiplicities, not just the set of distinct primes.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 34,52–53; C5 p. 30; T04 P3 uses factorisation, not a full theorem proof"]}, {"id": "Q037", "concepts": ["N19"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Find the inverse of 17 modulo 43 by the Euclidean algorithm.", "answer": "43=2·17+9;17=9+8;9=8+1. Back-substitution: 1=9−8=2·9−17=2·43−5·17. Thus −5≡38 is the inverse. Check 17·38=646=15·43+1.", "rubric": ["Euclidean chain", "Bézout coefficients", "Inverse 38", "Verification"], "trap": "Read the coefficient of 17, not the coefficient of 43.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 57–60; T04 P5–6"]}, {"id": "Q038", "concepts": ["N19"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "For integers a and m>1, if u and v are both inverses of a modulo m, prove their modular uniqueness. Must u and v be equal as integers?", "answer": "au≡av≡1. Existence of an inverse implies gcd(a,m)=1, so cancellation gives u≡v (mod m). Alternatively multiply au≡1 by v. They need not be equal integers: u and u+m represent the same inverse class.", "rubric": ["Use inverse conditions", "Justified cancellation", "Distinguish residues from integers"], "trap": "Uniqueness is modulo m.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 57–60; T04 P5–6"]}, {"id": "Q039", "concepts": ["N20"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Solve 17x≡9 (mod 43), given 17⁻¹≡38 (mod 43). State all integer solutions and check.", "answer": "Multiply by 38: x≡342≡41 (mod 43). All solutions are x=41+43k for integer k. Check 17·41−9=688=16·43; adding 43k preserves the congruence.", "rubric": ["Multiply by inverse", "Reduce to 41", "All integer solutions", "Check"], "trap": "A single representative is not the entire integer solution set.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 57,61; T04 P5(a–c)"]}, {"id": "Q040", "concepts": ["N20"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "For gcd(a,m)=1 and inverse u of a modulo m, prove ax≡b (mod m) iff x≡ub (mod m).", "answer": "Forward: multiply ax≡b by u and use ua≡1. Reverse: multiply x≡ub by a to obtain ax≡aub≡b. Thus both necessity and sufficiency hold, and x=ub+km describes the residue class.", "rubric": ["Forward direction", "Reverse direction", "Use inverse condition"], "trap": "An iff requires both directions, even if solving seems to suggest only one.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 57,61; T04 P5(a–c)"]}, {"id": "Q041", "concepts": ["N21"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Use the constructive CRT formula to solve x≡1 (mod 3), x≡2 (mod 5), x≡3 (mod 7).", "answer": "The moduli are pairwise coprime. M=105 and Mᵢ are 35,21,15. Their inverses modulo 3,5,7 are 2,1,1. Thus x≡1·35·2+2·21+3·15=157≡52 (mod 105). Check 52 leaves remainders 1,2,3. All solutions are 52+105k.", "rubric": ["Check hypotheses", "Construct Mᵢ and inverses", "Compute 52", "Check and give class"], "trap": "The CRT solution is unique modulo the product, not as an integer.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 62–65; T04 P7–8"]}, {"id": "Q042", "concepts": ["N21"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "Let m₁,…,mₖ>1 be pairwise-coprime integers. Prove that two integers x,y satisfying the same prescribed congruences modulo every mᵢ satisfy x≡y modulo M=m₁⋯mₖ. First justify the product-divisibility lemma without invoking CRT itself.", "answer": "If each mᵢ divides z and the moduli are pairwise coprime, build the product inductively. If A=m₁⋯mⱼ divides z, write z=At. The next modulus is coprime to A (by prime factorisation). Since it divides At, coprime cancellation shows it divides t, hence A·mⱼ₊₁ divides z. Apply this to z=x−y for two solutions. Their difference is divisible by M, so x≡y (mod M).", "rubric": ["Product-divisibility lemma", "Justify coprimality with product", "Apply to x−y", "Conclude modular uniqueness"], "trap": "Using CRT to prove its own uniqueness lemma is circular.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C4 pp. 62–65; T04 P7–8"]}, {"id": "Q043", "concepts": ["N22"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Solve x≡2 (mod 5), x≡3 (mod 7) by substitution.", "answer": "Write x=5t+2. Then 5t≡1 (mod 7), and the inverse of 5 is 3, so t≡3. Write t=7k+3 to get x=35k+17. Check 17 has the required remainders.", "rubric": ["Introduce integer parameter", "Solve reduced congruence", "Substitute back", "Check"], "trap": "This substitution solves constraints, unlike Bézout back-substitution.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 66–67; T04 P7–8 related theorem context, no direct computation task"]}, {"id": "Q044", "concepts": ["N22"], "skill": "calculation", "type": "Multi-step", "difficulty": "Standard", "prompt": "Solve x≡1 (mod 4), x≡2 (mod 5), x≡3 (mod 7) by successive substitution.", "answer": "x=4t+1. Modulo 5, 4t≡1, so t≡4. Thus x=20u+17. Modulo 7 this becomes 6u+3≡3, so u≡0 (6 is invertible modulo 7). Hence x=140k+17. Check all three residues.", "rubric": ["First parameterisation", "Combine first two constraints", "Apply third constraint", "All solutions and check"], "trap": "Keep the accumulated modulus when introducing the next parameter.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 66–67; T04 P7–8 related theorem context, no direct computation task"]}, {"id": "Q045", "concepts": ["N23"], "skill": "calculation", "type": "Theorem application", "difficulty": "Standard", "prompt": "Compute 3¹⁰⁰ mod 7 using Fermat’s little theorem, stating its conditions.", "answer": "7 is prime and 7 does not divide 3, so 3⁶≡1. Since 100=6·16+4, 3¹⁰⁰≡3⁴=81≡4 (mod 7).", "rubric": ["Check prime and nondivisibility", "Reduce exponent modulo 6", "Compute remainder 4"], "trap": "Reduce the exponent modulo p−1 here, not modulo p.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 68–69; —"]}, {"id": "Q046", "concepts": ["N23"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "Why is “5⁴≡1 (mod 5) by Fermat” invalid? State a Fermat version that still applies to a=5,p=5.", "answer": "The a^(p−1)≡1 version requires p not to divide a, which fails. Indeed 5⁴≡0. The version aᵖ≡a (mod p) applies to every integer a for prime p, and gives 5⁵≡5≡0.", "rubric": ["Identify failed hypothesis", "Correct residue", "State valid alternative"], "trap": "The two versions have different restrictions.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 68–69; —"]}, {"id": "Q047", "concepts": ["N24"], "skill": "calculation", "type": "Justification", "difficulty": "Standard", "prompt": "Show that 341 is a base-2 pseudoprime using 341=11·31 and 2¹⁰=1024.", "answer": "The factorisation proves 341 composite. Also 1024=3·341+1, so 2¹⁰≡1. Therefore 2³⁴⁰=(2¹⁰)³⁴≡1. A composite passing this Fermat congruence is a base-2 pseudoprime.", "rubric": ["Prove composite", "Compute modular power", "Apply definition"], "trap": "A passing congruence alone does not establish pseudoprimality without compositeness.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L3", "sources": ["C4 pp. 70–71; —"]}, {"id": "Q048", "concepts": ["N24"], "skill": "conceptual", "type": "MCQ", "difficulty": "Standard", "prompt": "For an integer n>2, if 2^(n−1) is NOT congruent to 1 modulo n, what follows?", "answer": "n is composite: every prime n>2 would satisfy the congruence by Fermat. This uses the contrapositive, not the invalid converse.", "rubric": ["Choose composite"], "trap": "The n>2 qualification excludes prime 2.", "options": ["n is prime", "No conclusion can be drawn", "n is a base-2 pseudoprime", "n is composite"], "key": 3, "optionReasons": ["Contradicts Fermat under n>2.", "Failure does give a conclusive result here.", "Pseudoprimes pass the test.", "A failed necessary test proves compositeness."], "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L3", "sources": ["C4 pp. 70–71; —"]}, {"id": "Q049", "concepts": ["N25"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Determine whether 3 is a primitive root modulo 7.", "answer": "The powers with exponents 1 through 6 give 3,2,6,4,5,1 modulo 7. All six nonzero residues occur, so 3 is a primitive root modulo this prime.", "rubric": ["Correct sequence", "Check all nonzero residues", "Conclude primitive root"], "trap": "One invertible power is not enough; the whole nonzero residue set must be generated.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 p. 72; —"]}, {"id": "Q050", "concepts": ["N25"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "Is 2 a primitive root modulo 7? Does it nevertheless have an inverse?", "answer": "Its powers cycle 2,4,1, so residues 3,5,6 never appear. It is not a primitive root. It is invertible: 2·4≡1. Being invertible is weaker than generating every nonzero residue.", "rubric": ["Identify cycle", "Reject primitive-root status", "Find inverse and distinguish"], "trap": "Every nonzero residue modulo a prime is invertible, but not every one is primitive.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 p. 72; —"]}, {"id": "Q051", "concepts": ["N26"], "skill": "calculation", "type": "Calculation", "difficulty": "Standard", "prompt": "Using 3 as a primitive root modulo 7, find the discrete logarithms of 5 and 1 under the course range 1≤k≤6.", "answer": "Powers of 3 are 3,2,6,4,5,1. Thus log₃5=5 and log₃1=6 in this course convention. Exponent 0 also gives 1 but is outside the stated range.", "rubric": ["Find exponent 5", "Use exponent 6 for 1", "Respect the range"], "trap": "Do not silently replace the course convention by 0 through p−2.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 73–74; —"]}, {"id": "Q052", "concepts": ["N26"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "Explain why uniqueness of a discrete logarithm modulo prime p requires a specified exponent range.", "answer": "If rᵏ≡a and r is a primitive root, r^(p−1)≡1, so k+(p−1)t also gives a for every integer t for which powers are interpreted. The range 1,…,p−1 picks one representative; its power list contains each nonzero residue exactly once.", "rubric": ["Show repeating exponents", "Explain range selection", "Use primitive-root property"], "trap": "A discrete logarithm is not an ordinary real logarithm.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C4 pp. 73–74; —"]}, {"id": "Q053", "concepts": ["I01"], "skill": "proof", "type": "Proof completion", "difficulty": "Standard", "prompt": "To prove P(n) for every integer n≥4 by ordinary induction, write the required basis, hypothesis and inductive conclusion. Explain what remains to be justified in the step.", "answer": "Prove P(4). Fix an arbitrary integer k≥4 and assume P(k). Using that conditional assumption, prove P(k+1). The implication must work for every k≥4; proving only a few transitions is insufficient. Conclude P(n) for all n≥4.", "rubric": ["Correct basis", "Arbitrary k and conditional hypothesis", "Correct transition and domain", "Universal conclusion"], "trap": "The hypothesis is not permission to assume P(k+1).", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 5–9,22–23; T04 P9–13,16"]}, {"id": "Q054", "concepts": ["I01"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "You know P(3) is true and P(k)⇒P(k+1) for every k≥5. Is this enough to prove P(n) for all n≥3? Explain precisely.", "answer": "No. There is no justified route from P(3) to P(4) or from P(4) to P(5). Even if P(5) were separately proved, P(4) would remain uncovered. Prove P(4),P(5), or supply the missing transitions, before concluding the full stated range.", "rubric": ["Identify gap at 3 to 4", "Identify entry into k≥5 step", "Explain repair"], "trap": "A true isolated basis does not connect across an unsupported transition.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 5–9,22–23; T04 P9–13,16"]}, {"id": "Q055", "concepts": ["I02"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Prove 1+3+⋯+(2n−1)=n² for n≥1 by induction.", "answer": "At n=1 both sides equal 1. Assume the sum through 2k−1 equals k². The next sum is k²+(2k+1)=(k+1)². Thus the identity holds for all n≥1 by induction.", "rubric": ["Base", "Precise sum hypothesis", "Add correct next term", "Algebra and conclusion"], "trap": "The next odd term is 2k+1, not 2k−1.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 10–11,22–23; T04 P11,16"]}, {"id": "Q056", "concepts": ["I02"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "For a fixed real r≠1, prove Σ(j=0 to n) rʲ=(r^(n+1)−1)/(r−1) for n≥0 by induction. What happens at r=1?", "answer": "At n=0 the right side is (r−1)/(r−1)=1. Assume the formula at k. Add r^(k+1): [(r^(k+1)−1)+(r−1)r^(k+1)]/(r−1)=(r^(k+2)−1)/(r−1). This proves the next case with the same fixed r. For r=1 the sum is n+1, but the quotient is undefined.", "rubric": ["Fix parameter and basis", "Use hypothesis and next term", "Combine numerator", "Handle excluded r=1"], "trap": "Induct on n; do not change r between cases.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 10–11,22–23; T04 P11,16"]}, {"id": "Q057", "concepts": ["I03"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Prove 2ⁿ≥n² for every integer n≥4 and explain why the step works on this range.", "answer": "Base 2⁴=16=4². If 2ᵏ≥k² with k≥4, then 2^(k+1)≥2k². Moreover 2k²−(k+1)²=k²−2k−1=(k−1)²−2≥7>0. Thus 2^(k+1)≥(k+1)².", "rubric": ["Base at 4", "Apply hypothesis", "Justify auxiliary inequality", "Conclusion on correct range"], "trap": "Do not assume 2k²≥(k+1)² without checking its domain.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 12–13; T04 P12"]}, {"id": "Q058", "concepts": ["I03"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Find a valid starting index n₀ for n!>2ⁿ for all n≥n₀, and prove it. Show why your n₀ is the smallest possible for this uninterrupted range.", "answer": "At n=1,2,3 the inequality fails; at n=4,24>16. Assume k!>2ᵏ for k≥4. Then (k+1)!=(k+1)k!>(k+1)2ᵏ>2·2ᵏ=2^(k+1), since k+1>2. Thus n₀=4 works and earlier starting indices include failures.", "rubric": ["Check boundary cases", "Base 4", "Factor factorial and use hypothesis", "Strict inequality and conclusion"], "trap": "Multiplying an inequality requires attention to the sign of the multiplier.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 12–13; T04 P12"]}, {"id": "Q059", "concepts": ["I04"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Prove 6 divides 7ⁿ−1 for every integer n≥0 by induction.", "answer": "At n=0 the expression is 0, divisible by 6. Assume 7ᵏ−1=6t for integer t. Then 7^(k+1)−1=7(7ᵏ−1)+6=6(7t+1). This is an integer multiple of 6.", "rubric": ["Base including zero", "Integer-witness hypothesis", "Useful decomposition", "Integer conclusion"], "trap": "Separate the induction expression instead of merely asserting the next case.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 p. 14; T04 P9(a–c),10"]}, {"id": "Q060", "concepts": ["I04"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "Prove 8 divides 3^(2ⁿ)−1 for all n≥1, explicitly handling the nested exponent.", "answer": "Base n=1 gives 3²−1=8. Let A=3^(2ᵏ) and assume 8 divides A−1. Since 2^(k+1)=2·2ᵏ, 3^(2^(k+1))−1=A²−1=(A−1)(A+1), divisible by 8. Thus the claim follows.", "rubric": ["Base at 1", "Correct exponent relation", "Factor difference of squares", "Use divisibility hypothesis"], "trap": "3^(2ⁿ) is not (3²)ⁿ.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 p. 14; T04 P9(a–c),10"]}, {"id": "Q061", "concepts": ["I05"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Prove a set with n elements has 2ⁿ subsets, by induction on n≥0.", "answer": "The empty set has one subset, giving 2⁰. For a (k+1)-element set select x. Its subsets split into those without x (subsets of the k-element remainder) and those with x (one-to-one with those same subsets by adjoining x). The two disjoint classes each have 2ᵏ members, so the total is 2^(k+1).", "rubric": ["Empty-set base", "Remove one element", "Disjoint exhaustive partition", "Count via correspondence"], "trap": "The empty set has one subset, not zero.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 15–16; T04 P13"]}, {"id": "Q062", "concepts": ["I05"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Using the two-set De Morgan law, prove complement(A₁∪⋯∪Aₙ)=complement(A₁)∩⋯∩complement(Aₙ) for n≥1 in a fixed universe.", "answer": "For n=1 the assertion is immediate. Assume the formula for k sets. Apply the two-set law to (A₁∪⋯∪Aₖ)∪Aₖ₊₁, giving complement(A₁∪⋯∪Aₖ)∩complement(Aₖ₊₁). Substitute the hypothesis and reassociate intersections.", "rubric": ["Fixed universe and base", "Group first k sets", "Apply two-set law", "Substitute hypothesis"], "trap": "Complements must all refer to the same universe.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 15–16; T04 P13"]}, {"id": "Q063", "concepts": ["I06"], "skill": "proof", "type": "Proof completion", "difficulty": "Standard", "prompt": "Explain the induction step that tiles any 2^(k+1) by 2^(k+1) board missing one square using L-triominoes, assuming the result for side 2ᵏ.", "answer": "Divide into four equal quadrants. Exactly one quadrant contains the missing square. Place one central L-triomino covering the central square of each of the other three quadrants. Each quadrant now has one unavailable square. Apply the induction hypothesis to each 2ᵏ by 2ᵏ quadrant, then combine with the central triomino. The base is a 2 by 2 board minus any square.", "rubric": ["Four quadrants", "Correct central placement", "Each subproblem has exactly one hole", "Base and recombination"], "trap": "The original missing square need not be at the centre.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 17–19; —"]}, {"id": "Q064", "concepts": ["I06"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "A proposed tiling proof says: “After dividing into four quadrants, apply the hypothesis to each.” What is missing, and why does area divisibility alone not repair it?", "answer": "Three quadrants have no missing square, so they do not meet the hypothesis for deficient boards. A central L-triomino must create one unavailable square in each of those three. Area divisible by 3 is necessary for a triomino tiling but alone does not construct a tiling or establish the needed subproblem shape.", "rubric": ["Identify three invalid subproblems", "Explain central repair", "Distinguish area condition from construction"], "trap": "An induction hypothesis applies only to objects satisfying its exact conditions.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 17–19; —"]}, {"id": "Q065", "concepts": ["I07"], "skill": "proof", "type": "Counterexample", "difficulty": "Standard", "prompt": "In the “all horses have the same colour” induction, two k-horse subsets of a (k+1)-horse set overlap. At which transition does this argument fail, and why?", "answer": "It fails from k=1 to k+1=2. The subsets {horse 1} and {horse 2} are disjoint, so there is no common horse to link their colours. The one-horse base is true, but the asserted universal transition is false.", "rubric": ["Identify k=1 transition", "Explain empty overlap", "Distinguish true base from false step"], "trap": "A step that works only for k≥2 cannot start from a one-element basis.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 20–23; T04 P12 indirectly reinforces domain checks"]}, {"id": "Q066", "concepts": ["I07"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "A student “proves” 2ⁿ>n² for n≥4 with a valid transition for k≥4, but takes n=4 as the basis without checking. Diagnose and repair the statement.", "answer": "At n=4,2⁴=4², so the strict basis is false. For strict inequality use n≥5 with base 32>25 and the same appropriately checked transition. Alternatively retain n≥4 but use ≥ throughout.", "rubric": ["Compute failed base", "Give valid strict starting case", "Explain alternative non-strict claim"], "trap": "A valid inductive implication cannot create its own starting truth.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 20–23; T04 P12 indirectly reinforces domain checks"]}, {"id": "Q067", "concepts": ["I08"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Let P(2) and P(3) hold. Suppose P(k−1) and P(k) together imply P(k+1) for every k≥3. Prove P(n) for all n≥2 using strong induction.", "answer": "Use bases 2 and 3. For k≥3 assume P(j) for every 2≤j≤k. Then both k−1≥2 and k lie in the hypothesis range, so the given implication proves P(k+1). This covers all n≥2.", "rubric": ["Both bases", "Strong hypothesis range", "Check two dependencies", "Conclusion"], "trap": "One base is insufficient when the first transition needs two earlier cases.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 26–32; T04 P14; T05 P3(b); T04 P15 supports a splitting application"]}, {"id": "Q068", "concepts": ["I08"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "Every pile of n≥1 tokens may be split into two smaller positive piles until all piles have size 1. Prove by strong induction that any complete splitting process makes n−1 splits.", "answer": "Base n=1 requires 0 splits. For n>1 the first split gives sizes a,b≥1 with a+b=n and a,b\u003cn. By the strong hypothesis their complete processes take a−1 and b−1 splits. Including the first split gives 1+(a−1)+(b−1)=n−1, independently of the choices.", "rubric": ["Base", "Arbitrary first split", "Both smaller subproblems", "Add all splits"], "trap": "Counting only one chosen splitting pattern does not establish every process.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 26–32; T04 P14; T05 P3(b); T04 P15 supports a splitting application"]}, {"id": "Q069", "concepts": ["I09"], "skill": "proof", "type": "Proof", "difficulty": "Standard", "prompt": "Prove every integer amount n≥12 can be formed with denominations 4 and 5. Use a finite set of bases and an induction step that adds one 4-unit item.", "answer": "Bases:12=3·4,13=2·4+5,14=4+2·5,15=3·5. For n≥16, n−4≥12 and n−4\u003cn. By strong induction n−4 is attainable, so add a 4-unit item. All coefficients remain nonnegative integers.", "rubric": ["Four consecutive bases", "Check n−4 range", "Apply smaller case", "Construct with nonnegative counts"], "trap": "Negative coefficients are not permissible counts of items.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 30–32; T04 P14–15; P10 related construction"]}, {"id": "Q070", "concepts": ["I09"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "A pile of n positive-unit objects is repeatedly split. Splitting a pile of size a+b into sizes a,b earns ab points. Prove the total is n(n−1)/2 when all final piles have size 1.", "answer": "For n=1 the score is 0. If the first split has sizes a,b, strong induction gives later scores a(a−1)/2 and b(b−1)/2. Adding ab gives [a²−a+b²−b+2ab]/2=[(a+b)²−(a+b)]/2=n(n−1)/2. Since the first split was arbitrary, the total is invariant.", "rubric": ["Base", "Arbitrary split and smaller cases", "Include ab", "Simplify and justify independence"], "trap": "Do not forget the points from the initial split.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 30–32; T04 P14–15; P10 related construction"]}, {"id": "Q071", "concepts": ["I10"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "For integers a and d>0, use well-ordering to establish existence of a quotient and remainder with 0≤r\u003cd.", "answer": "Consider S={a−dq:q is an integer and a−dq≥0}. It is nonempty by choosing q sufficiently negative. Let r be its least member, r=a−dq₀. If r≥d, then r−d=a−d(q₀+1) is a smaller nonnegative member, contradiction. Thus 0≤r\u003cd and a=dq₀+r.", "rubric": ["Define nonnegative candidate set", "Show nonempty", "Apply least-element principle", "Contradiction proves upper bound"], "trap": "Well-ordering requires a nonempty subset of the nonnegative integers.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 8,29,33–34; C4 p. 50; T04 P17(a–e)"]}, {"id": "Q072", "concepts": ["I10"], "skill": "proof", "type": "Proof", "difficulty": "Challenge", "prompt": "For positive integers a,b let d be the least positive integer combination ax+by with x,y integers. Prove that d=gcd(a,b).", "answer": "The set is nonempty since a is in it. Divide a by d: a=qd+r,0≤r\u003cd. Since d=ax₀+by₀, r=a−qd is an integer combination of a,b. If r>0 it contradicts minimality, so d divides a. The same argument gives d divides b. Every common divisor of a,b divides d=ax₀+by₀, and therefore is at most d. Thus d is their greatest positive common divisor.", "rubric": ["Nonempty and least choice", "Remainder is a combination", "Show d divides both", "Every common divisor divides d"], "trap": "Least positive combination is not the least positive common divisor.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L1", "sources": ["C5 pp. 8,29,33–34; C4 p. 50; T04 P17(a–e)"]}, {"id": "Q073", "concepts": ["I11"], "skill": "proof", "type": "Proof completion", "difficulty": "Standard", "prompt": "Explain how well-ordering proves ordinary induction via a least counterexample, including the boundary issue.", "answer": "Assume P(n₀) and all implications P(k)⇒P(k+1) for k≥n₀. If there is a counterexample in n≥n₀, choose the least one m by well-ordering (or shift indices to nonnegative integers). The base implies m>n₀. Then m−1 is in the domain and not a counterexample, so P(m−1) and the step give P(m), contradiction.", "rubric": ["Least counterexample exists", "Exclude basis", "Previous index is valid and true", "Apply step to contradict"], "trap": "Without m>n₀ the previous case might lie outside the proved domain.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 8,29; —"]}, {"id": "Q074", "concepts": ["I11"], "skill": "conceptual", "type": "Justification", "difficulty": "Standard", "prompt": "Strong induction assumes more earlier cases. Does that mean it proves propositions that ordinary induction cannot prove? Explain using an accumulated statement.", "answer": "No; the principles are equivalent. For a target P(n), let Q(k) mean P(n₀),…,P(k) all hold. An ordinary induction on Q retains all earlier P-cases, reproducing a strong-induction argument. The proof templates differ in convenience, not logical power.", "rubric": ["State equivalence", "Define accumulated Q", "Explain how ordinary hypothesis supplies strong one"], "trap": "More convenient access to earlier cases is not a stronger logical principle.", "options": null, "key": null, "optionReasons": null, "provenance": "Authored practice with independently derived model solution, grounded in the approved map/teaching. Not an official quiz question or official answer key.", "priority": "L2", "sources": ["C5 pp. 8,29; —"]}, {"id": "Q075", "concepts": ["R01
